  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/nav.css">

  <style>
    :root {
      --navy: #0D1B2E;
      --navy-2: #0F2440;
      --navy-3: #132D50;
      --amber: #E07B00;
      --white: #FFFFFF;
      --slate: #94A3B8;
      --light: #E2E8F0;
      --sp-1: 0.25rem;
      --sp-2: 0.5rem;
      --sp-3: 0.75rem;
      --sp-4: 1rem;
      --sp-6: 1.5rem;
      --sp-8: 2rem;
      --sp-12: 3rem;
      --sp-16: 4rem;
      --sp-24: 6rem;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --font-body: 'Rubik', sans-serif;
      --font-heading: 'Rubik', serif;
      --font-mono: 'Rubik', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-body);
      color: var(--navy);
      background-color: #F8FAFC;
      line-height: 1.6;
    }

    main {
      flex: 1;
      padding: var(--sp-8) var(--sp-4);
      max-width: 900px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: var(--sp-12);
    }

    .page-header h1 {
      font-family: var(--font-heading);
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: var(--sp-2);
    }

    .project-id {
      font-size: 0.875rem;
      color: var(--slate);
      font-weight: 500;
    }

    .project-summary {
      background: var(--white);
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-lg);
      padding: var(--sp-8);
      margin-bottom: var(--sp-8);
    }

    .project-summary-title {
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: var(--sp-6);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--sp-6);
    }

    .summary-item {
      padding: var(--sp-4);
      background: #F8FAFC;
      border-radius: var(--radius-md);
    }

    .summary-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--sp-2);
    }

    .summary-value {
      font-size: 1rem;
      font-weight: 500;
      color: var(--navy);
    }

    .summary-highlight {
      font-size: 0.875rem;
      color: var(--navy-3);
      margin-top: var(--sp-2);
      padding: var(--sp-3) var(--sp-4);
      background: #EFF6FF;
      border-left: 2px solid var(--amber);
      border-radius: var(--radius-sm);
    }

    .form-card {
      background: var(--white);
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-lg);
      padding: var(--sp-8);
      margin-bottom: var(--sp-8);
    }

    .form-card-title {
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: var(--sp-6);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: var(--sp-6);
    }

    .form-grid.full {
      grid-template-columns: 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--navy);
      margin-bottom: var(--sp-2);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: var(--sp-3) var(--sp-4);
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--navy);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(224, 123, 0, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-help {
      font-size: 0.8rem;
      color: var(--slate);
      margin-top: var(--sp-2);
    }

    .input-prefix {
      display: flex;
      align-items: center;
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .input-prefix span {
      padding: var(--sp-3) var(--sp-4);
      background: #F8FAFC;
      color: var(--navy);
      font-weight: 600;
      border-right: 1px solid #CBD5E1;
    }

    .input-prefix input {
      border: none !important;
      padding: var(--sp-3) var(--sp-4) !important;
      flex: 1;
    }

    .input-prefix input:focus {
      box-shadow: none !important;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--navy);
      margin-bottom: var(--sp-2);
      display: block;
    }

    .form-label.required::after {
      content: ' *';
      color: #DC2626;
    }

    .form-section {
      display: flex;
      flex-direction: column;
    }

    .fee-calculator {
      background: var(--navy-3);
      border: 1px solid var(--navy-2);
      border-radius: var(--radius-lg);
      padding: var(--sp-8);
      margin-bottom: var(--sp-8);
      color: var(--white);
    }

    .fee-calculator-title {
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: var(--sp-6);
      color: var(--amber);
    }

    .fee-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--sp-4) 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.95rem;
    }

    .fee-row.total {
      border-top: 2px solid var(--amber);
      border-bottom: none;
      padding-top: var(--sp-6);
      margin-top: var(--sp-4);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .fee-row.net {
      background: rgba(224, 123, 0, 0.15);
      padding: var(--sp-4);
      margin-top: var(--sp-4);
      border-radius: var(--radius-md);
      border: none;
    }

    .fee-label {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }

    .fee-check {
      color: var(--amber);
      font-weight: bold;
    }

    .fee-amount {
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .fee-percentage {
      font-size: 0.85rem;
      color: #94A3B8;
      margin-left: var(--sp-2);
    }

    .fee-info {
      background: rgba(224, 123, 0, 0.1);
      border-left: 2px solid var(--amber);
      padding: var(--sp-4);
      border-radius: var(--radius-sm);
      margin-top: var(--sp-6);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .fee-info-link {
      color: var(--amber);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .fee-info-link:hover {
      text-decoration: underline;
    }

    .submit-section {
      background: var(--white);
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-lg);
      padding: var(--sp-8);
      margin-bottom: var(--sp-12);
    }

    .submit-button {
      background: var(--amber);
      color: var(--navy);
      padding: var(--sp-4) var(--sp-8);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
      margin-bottom: var(--sp-6);
    }

    .submit-button:hover {
      background: #DDA500;
    }

    .submit-button:active {
      transform: scale(0.98);
    }

    .submit-button:disabled {
      background: #D1D5DB;
      cursor: not-allowed;
      color: var(--slate);
    }

    .submit-disclaimer {
      font-size: 0.85rem;
      color: var(--slate);
      text-align: center;
      line-height: 1.6;
    }

    .success-state {
      background: #ECFDF5;
      border: 1px solid #6EE7B7;
      border-radius: var(--radius-lg);
      padding: var(--sp-8);
      text-align: center;
      color: #065F46;
      display: none;
      margin-top: var(--sp-8);
    }

    .success-state.show {
      display: block;
    }

    .success-icon {
      font-size: 2rem;
      margin-bottom: var(--sp-4);
    }

    /* ── Value-add subsection box ── */
    .va-box {
      margin-bottom: var(--sp-6);
      padding: var(--sp-4);
      background: #F8FAFC;
      border-radius: var(--radius-md);
      border: 1px solid var(--light);
    }

    .va-box h4 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: var(--sp-3);
      color: var(--navy);
    }

    .va-options {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .va-option-row {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-2);
      font-size: 0.875rem;
      cursor: pointer;
      flex-wrap: wrap;
    }

    .va-option-row input[type="radio"],
    .va-option-row input[type="checkbox"] {
      margin-top: 3px;
      flex-shrink: 0;
    }

    .va-inline-dollar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 4px;
    }

    .va-inline-dollar input[type="number"] {
      width: 90px;
      padding: 2px 6px;
      border: 1px solid var(--light);
      border-radius: 4px;
      font-size: 0.875rem;
    }

    .va-notes {
      margin-top: var(--sp-3);
      width: 100%;
      padding: var(--sp-3);
      border: 1px solid var(--light);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.875rem;
      resize: vertical;
      min-height: 70px;
    }

    /* ── Total Bid Price — bid type selector ── */
    .bid-type-options {
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      margin-bottom: var(--sp-4);
    }

    .bid-type-card {
      border: 2px solid #CBD5E1;
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .bid-type-card.selected {
      border-color: var(--amber);
      background: #FFFBEB;
    }

    .bid-type-card label {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-3);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .bid-type-card label input[type="radio"] {
      margin-top: 3px;
      flex-shrink: 0;
    }

    .bid-type-subtext {
      font-size: 0.82rem;
      color: var(--slate);
      margin-top: var(--sp-2);
      margin-left: 1.5rem;
      font-weight: 400;
    }

    .bid-type-rcv-display {
      margin-top: var(--sp-3);
      margin-left: 1.5rem;
      font-size: 0.875rem;
      color: var(--navy-3);
      padding: var(--sp-2) var(--sp-3);
      background: #EFF6FF;
      border-left: 2px solid var(--amber);
      border-radius: var(--radius-sm);
      display: none;
    }

    #bidTypeOtherDetails {
      display: none;
      margin-top: var(--sp-4);
    }

    /* ── Warranty builder ── */
    .warranty-builder {
      margin-top: var(--sp-4);
    }

    .warranty-template-bar {
      display: flex;
      gap: var(--sp-3);
      align-items: center;
      margin-bottom: var(--sp-4);
      flex-wrap: wrap;
    }

    .warranty-template-bar select {
      flex: 1;
      min-width: 180px;
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.875rem;
    }

    .btn-sm {
      padding: var(--sp-2) var(--sp-3);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #CBD5E1;
      background: var(--white);
      color: var(--navy);
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-sm:hover {
      background: #F1F5F9;
    }

    .btn-sm.primary {
      background: var(--amber);
      border-color: var(--amber);
      color: var(--navy);
    }

    .btn-sm.primary:hover {
      background: #DDA500;
    }

    .warranty-cards-container {
      display: flex;
      flex-direction: column;
      gap: var(--sp-6);
    }

    .warranty-card {
      border: 1px solid #CBD5E1;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .warranty-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--sp-3) var(--sp-4);
      background: var(--navy-3);
      color: var(--white);
    }

    .warranty-card-title {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .warranty-card-body {
      padding: var(--sp-4);
      background: var(--white);
    }

    .warranty-name-price-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--sp-4);
      margin-bottom: var(--sp-4);
      align-items: end;
    }

    .warranty-coverage-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-bottom: var(--sp-4);
    }

    .warranty-coverage-table thead th {
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: var(--sp-2) var(--sp-3);
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
    }

    .warranty-coverage-table tbody td {
      padding: var(--sp-2) var(--sp-3);
      border-bottom: 1px solid #F1F5F9;
      vertical-align: middle;
    }

    .warranty-coverage-table tbody tr:last-child td {
      border-bottom: none;
    }

    .warranty-years-input {
      width: 70px;
      padding: 3px 6px;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: var(--font-body);
    }

    .warranty-notes-input {
      width: 100%;
      padding: 3px 8px;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: var(--font-body);
    }

    .warranty-save-bar {
      display: flex;
      gap: var(--sp-3);
      align-items: center;
      margin-top: var(--sp-4);
