# FIXTURE (good): FALSE-POSITIVE control. This file only MENTIONS the string
# `pull_request_target` -- in a job's display name -- and triggers on
# `pull_request`. An unanchored search armed all three rules here (observed
# live against this repo's own workflow-safety-ratchet.yml, 2026-09-08); the
