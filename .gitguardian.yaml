# GitGuardian / ggshield v2 config (gh-2580).
# Excludes SQL test fixtures and migration files from SECRET scanning only.
# Those paths hold row ids, UUIDs and file paths that trip the "Generic High
# Entropy Secret" detector (see #2144, #2146, #2177, #2580). Everything else in
# the repo is still scanned, and no detector is disabled.
# Key `ignored_paths` and `version: 2` per ggshield's .gitguardian.example.yml.
version: 2

secret:
  ignored_paths:
    - 'supabase/tests/**'
    - 'supabase/migrations*/**'
