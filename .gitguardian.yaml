# GitGuardian / ggshield v2 config (gh-2580).
# Excludes four folders from SECRET scanning only, and nothing else:
#   supabase/tests/                      (26 files, 2 of them .test.ts)
#   supabase/migrations_applied_manually/, supabase/migrations_drafts/,
#   supabase/migrations_rollbacks/       (198 files)
# supabase/migrations/ (the applied migrations) is NOT excluded and stays scanned.
# Why: #2580 - GitGuardian's "Generic High Entropy Secret" detector flagged
# UUID-shaped row ids in commit 069a2a4's copy of
# supabase/tests/gh2559_claim_docs_world_fence_proof.sql (that commit is only on
# branch gh-2559-storage-world-fence-cto61; main's copy holds no ids). Same
# false-positive class as #2144/#2146/#2177, which were in other files. The
# flagged path is in supabase/tests/, so the first pattern alone covers it.
# The second pattern does not cover it; it only adds the three migrations_*
# folders.
# ggshield turns each `*` into one-or-more non-slash characters and a trailing
# `**` into the same, so both patterns reach one folder level only; a nested
# folder under these paths would be scanned.
# Every other path is still scanned, and no detector is disabled.
# Key `ignored_paths` and `version: 2` per ggshield's .gitguardian.example.yml.
version: 2

secret:
  ignored_paths:
    - 'supabase/tests/**'
    - 'supabase/migrations*/**'
