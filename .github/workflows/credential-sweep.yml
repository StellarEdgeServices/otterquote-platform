name: Credential Shape Sweep

# CTO standing duty 2 — CI credential-shape grep. Walks the repo tree on
# every PR looking for text shaped like a live credential (a long hex run, a
# provider-prefixed key, a JWT, a PAT, or generic high-entropy base64) and
# fails loudly, naming file:line and the shape class — never the matched
# text itself. See scripts/credential-sweep.py for the full rationale and
# scripts/credential-sweep-allowlist.txt for known-false-positive
# suppressions, each with a stated reason.
#
# Dependency-free by design: stdlib-only Python, no pip install step, no
# external action beyond checkout + setup-python. A credential scanner that
# depends on a third-party package or action is one more supply-chain
# surface for the thing it exists to catch.
#
# INTENTIONALLY NOT A REQUIRED CHECK YET, and intentionally has no `paths:`
# filter (runs on every PR regardless of which files changed, so it catches
# a secret pasted into any file, not just the ones a narrower filter would
# have picked). Making it required is a branch-protection change and that is
# the CTO's call, not this workflow's — see the landing PR body.

# gh-1739 (cto27, 2026-09-06): also runs on direct pushes to main. Until
# now the trigger was `pull_request` only, so
# `workflows/credential-sweep.yml/runs?branch=main` returned
# total_count: 0 -- the repo's only in-CI secrets detector had never once
# run on a direct push to main in 314 runs. It then demonstrated that blind
# spot on itself: the R-120 review key rotation (e0813002a2) went straight
# to main and was never swept there. A detector that cannot observe the
# branch it is protecting is not covering that branch.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  credential-sweep:
    name: Credential Shape Sweep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run credential shape sweep
        run: |
          python scripts/credential-sweep.py --root .
