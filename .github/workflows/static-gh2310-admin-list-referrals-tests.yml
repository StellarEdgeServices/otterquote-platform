name: Static gh2310 admin_list_referrals Tests

# gh-2310 Gap 3 -- admin_list_referrals() keeps its is_test predicate and the nine-row referrals backfill
# keeps its exact-id guard and rollback. Static check of the applied SQL text filed under supabase/migrations/; the live proof is
# supabase/tests/gh2310_gap3_referrals_is_test_proof.sql, a rolled-back run a human does against production.
# `pull_request` + `push` to main, no secrets, read-only token.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'supabase/migrations/*gh2310_gap3_*'
      - 'supabase/migrations_rollbacks/gh2310_gap3_*'
      - 'tests/gh2310-static-admin-list-referrals.mjs'
      - '.github/workflows/static-gh2310-admin-list-referrals-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*gh2310_gap3_*'
      - 'supabase/migrations_rollbacks/gh2310_gap3_*'
      - 'tests/gh2310-static-admin-list-referrals.mjs'
      - '.github/workflows/static-gh2310-admin-list-referrals-tests.yml'

permissions:
  contents: read

concurrency:
  group: static-gh2310-admin-list-referrals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static-gh2310-admin-list-referrals:
    name: admin_list_referrals is_test predicate (gh2310)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Predicate and backfill checks
        run: node tests/gh2310-static-admin-list-referrals.mjs
      - name: Negative control (the live-shaped v98 body must FAIL the predicate checks)
        run: |
          if node tests/gh2310-static-admin-list-referrals.mjs sql/v98-admin-list-referrals.sql; then
            echo "negative control did not fail"; exit 1
          fi
