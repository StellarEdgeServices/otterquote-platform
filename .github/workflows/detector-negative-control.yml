name: Detector Negative Control Gate

# gh-1738 -- "every detector needs a negative control that RUNS IN CI." This
# workflow is that wiring for scripts/detector-negative-control-check.py
# (PR #1742), which itself checks that OTHER detectors have been observed
# rejecting the thing they exist to reject, and that a scanner's declared
# inputs are reconciled against what its own workflow trigger actually hands
# it. Landing that script with no workflow invoking it would have been
# instance 6 of the exact class gh-1738 exists to close -- a checker that
# cannot fire, shipped inside the fix for checkers that cannot fire. A PR
# review on #1742 caught this before merge; this file is the fix.
#
# BOTH STEPS ARE NOW BUILD-FAILING (flipped by gh-1841) -- see each step's
# comment for the reasoning:
#   1. Self-test the gate's OWN logic       -> BUILD-FAILING (hard gate)
#   2. Run the gate against this repo       -> BUILD-FAILING (flipped, see below)
#
# WHY STEP 2 WAS ADVISORY UNTIL NOW, AND WHY IT IS SAFE TO FLIP:
# Run cold against `main` as of this workflow's landing, the gate reported
# GATE: FAIL with two pre-existing, known findings that predated this
# workflow and were not that PR's defect: scripts/check-legal-surface-links.py
# had one stale fixture (a negative control pinned to #766's 404, which was
# fixed out from under it), and scripts/schema-column-lint.py's declared
# extensions were not fully reconciled against schema-lint.yml's push.paths
# (the .js/.ts/.tsx gap this very gate exists to catch -- ironic, but real,
# and already true before this workflow existed). Wiring this in as a
# REQUIRED, build-failing check at that point would have made it red on
# every single PR regardless of what that PR touched, which is exactly this
# repo's Credential Shape Sweep since #1717: a check nobody can ever make
# green trains everyone to ignore it, which is worse than not having the
# check. Advisory-first, with a loud and complete summary every run (never
# silent, never truncated), was the honest choice until those findings were
# cleared -- documented at the time as "a one-line change" once that
# happened (see step 2 below).
#
# gh-1841 cleared both pre-existing findings, plus two brand-new ones this
# same gate had already caught in advisory mode and nobody had acted on
# (scripts/check-credential-claims.py and scripts/check-supabase-js-sri.py,
# both detector-shaped, both shipped with no self-test -- precisely the
# instance-1/2/4 shape this gate exists to catch, arriving twice more while
# advisory): scripts/check-legal-surface-links.test.py's negative control no
# longer pins to a specific tracked defect (#766) that can be fixed out from
# under it; scripts/schema-lint.yml's push trigger dropped its stale
# paths: filter to match the pull_request trigger's already-reviewed,
# unfiltered posture (PR #1740 comment 5560891984); and
# check-credential-claims.py / check-supabase-js-sri.py each gained a real
# self-test with its own negative control. `python
# scripts/detector-negative-control-check.py` now reports VIOLATIONS: 0 /
# GATE: PASS on `main` -- the precondition this comment named for the flip.
# Step 2 below now propagates its exit code instead of neutralizing it.
#
# NOT REPEATING INSTANCE 3 (PR #1737: a new step crashed and silently
# short-circuited a job, killing a pre-existing check that ran later in the
# same job): this gate is its OWN job in its OWN workflow file, with no
# `needs:` on or from any other job. GitHub Actions runs jobs independently
# unless a `needs:` edge links them; none does here in either direction, so
# nothing this job does -- crash, hang, or fail -- can affect any other job's
# execution. Additionally, step 2 below cannot itself fail the job even if
# the checker script raises an uncaught exception, because its exit code is
# captured (`|| true`) rather than allowed to propagate.
#
# NOT REPEATING INSTANCE 5 (a scanner's declared inputs not reconciled
# against its own workflow's push.paths filter -- the harder half of what
# this very gate's CHECK 2 exists to catch): deliberately NO `paths:` filter
# on the triggers below. scripts/detector-negative-control-check.py does not
# scan a fixed set of changed files -- CHECK 1 walks the whole scripts/
# directory, CHECK 2 walks the WHOLE repo tree for extension-declaring
# scanners, and CHECK 3 scans every workflow file -- so it must see the
# repo's full, current state on every run regardless of which files a given
# PR touched. A paths: filter here would silently stop catching a violation
# introduced by editing some other file (e.g. a new secrets.GITHUB_X
# reference added to a workflow this PR doesn't otherwise touch), which is
# precisely the instance-5 shape. Self-check disclosure: the checker's own
# CHECK 2 does not evaluate this reasoning, because it only reconciles
# scripts that declare a top-level SCAN_EXTENSIONS/EXTENSIONS set, and this
# script declares neither (it walks directories directly). CHECK 2 is
# therefore silent on this workflow's wiring by construction, not because it
# verified "no paths: filter" is correct -- that verification is the human
# reasoning in this comment, not the tool's. Said explicitly per the work
# order: the checker cannot check itself here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detector-negative-control:
    name: Detector Negative Control Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # CHECK 2's find_referencing_workflows() parses workflow YAML
      # structurally (post-PR-#1742-review fix for gh-1738 instance 7: a raw
      # substring match previously mistook a script's name inside a workflow
      # comment for that workflow invoking it). setup-python's interpreter
      # ships with no third-party packages, and no other workflow in this
      # repo installs one (they're deliberately stdlib-only) -- this is the
      # one new dependency this gate introduces, so it gets its own explicit
      # install rather than assuming the runner image happens to have it.
      - name: Install PyYAML
        run: pip install --quiet --disable-pip-version-check pyyaml

      # BUILD-FAILING. This proves the gate's own detection logic still works
      # (firing-coverage bookkeeping, wiring reconciliation, and the CHECK 3
      # secret-syntax matching fixed on PR #1742) before trusting its verdict
      # on the rest of the repo below. A regression here means the gate
      # itself is broken, not that the repo has new debt -- that is always
      # worth blocking on, independent of the advisory posture of step 2.
      - name: Self-test the gate's own detection logic
        run: python scripts/detector-negative-control-check.test.py

      # gh-1840 control 1, BUILD-FAILING. Self-tests
      # scripts/spec-spy-order-check.py (a spy installed inside a Playwright
      # page.evaluate()/addInitScript() block without a preceding `typeof`
      # guard, e.g. PR #1720's original entry-point-reachability spec) --
      # also registered in DETECTOR_REGISTRY above so the step immediately
      # below re-confirms its self-test demonstrated the SPY_UNVERIFIED
      # negative-control token actually passing, not merely present in
      # source. Independent of "Run the gate against this repo" below: this
      # step fails on a regression in the CHECKER's own detection logic,
      # not on new debt found in the rest of the repo.
      - name: Self-test the spec-spy-order-check gate (gh-1840 control 1)
        run: python scripts/spec-spy-order-check.test.py

      # gh-1840 control 2, BUILD-FAILING. Self-tests
      # scripts/workflow-step-unrun-check.py (a step that never ran because
      # an earlier step in the same job crashed, e.g. PR #1737's
      # require_cli() ordering defect, reported as UNRUN rather than
      # silently absent). See that script's own module docstring for why it
      # is a post-hoc triage tool over job-result JSON rather than a live
      # per-push gate -- this step proves its detection logic against the
      # committed fixtures, the same role the step above plays for control 1.
      - name: Self-test the workflow-step-unrun-check gate (gh-1840 control 2)
        run: python scripts/workflow-step-unrun-check.test.py

      # Self-disclosure, per gh-1840's own instruction to say things plainly
      # rather than narrow scope quietly: the three self-test steps above
      # (this file's original one plus the two just added) have no
      # `if: always()` and are not `needs:`-decoupled from each other or
      # from "Run the gate against this repo" below -- a crash in any ONE of
      # them skips the rest, including the gate run itself, exactly the
      # shape scripts/workflow-step-unrun-check.py (control 2, immediately
      # above) exists to name. That script cannot watch ITS OWN job in real
      # time (see its module docstring: job-result data only exists once a
      # run has finished), so this residual risk is disclosed, not solved,
      # here. "Publish gate report to the job summary" / "Upload gate
      # report" below both keep `if: always()` specifically so a crash at
      # any step still leaves a visible, non-silent job summary and
      # artifact rather than nothing at all.

      # BUILD-FAILING as of gh-1841 (previously advisory -- see the
      # workflow-level comment above for the history and the precondition
      # that made this safe). The exit code is still captured into
      # $GITHUB_OUTPUT first (so the job-summary step below can report it,
      # and so the report/artifact steps below still run via `if: always()`
      # even on failure), but it is no longer neutralized: `|| code=$?`
      # only stops `set -e` from killing the script mid-capture (standard
      # bash: a command on the left of `||` doesn't trigger -e), and the
      # explicit `exit "$code"` at the end propagates a non-zero verdict to
      # the job for real. No `set +e` / `set -e` toggling and no `|| true`
      # remain in this step.
      - name: Run the gate against this repo
        id: gate
        run: |
          python scripts/detector-negative-control-check.py > gate-report.txt 2>&1 || code=$?
          : "${code:=0}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat gate-report.txt
          exit "$code"

      - name: Publish gate report to the job summary
        if: always()
        run: |
          {
            echo "# Detector Negative Control Gate (gh-1738)"
            echo
            echo "Exit code: \`${{ steps.gate.outputs.exit_code }}\` -- BUILD-FAILING as of gh-1841: a non-zero value here already failed this job."
            echo
            echo '```'
            cat gate-report.txt 2>/dev/null || echo "(no report produced -- see the step log above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detector-negative-control-report
          path: gate-report.txt
          if-no-files-found: ignore
