name: "CodeQL SAST"

# gh-1731 (COST GATE), 2026-09-08: the `pull_request` trigger is REMOVED.
# Measured, 7-day census Sep 1-7 2026 (Actions API, job-level ceil(sec/60),
# 1-minute-per-job billing floor): this workflow ran 454 times, of which 327
# were `pull_request` and 127 were `push` to main, at 1.88 billable job-min per
# run. The PR half alone was 327 x 1.88 = 615 min/7d = 2,635 job-min/month --
# the second-largest single line in the repo after Playwright E2E.
#
# What is preserved, and why this is not a coverage hole: `push: main` is kept,
# so EVERY commit that actually reaches main is still scanned, and the weekly
# cron still sweeps the whole default branch. What is given up is scanning each
# intermediate PR iteration -- i.e. the finding arrives at merge instead of a
# few minutes earlier on the PR. CodeQL is not a branch-protection-required
# context (live required_status_checks.contexts on main, 2026-09-08T02:41Z, is
# exactly ["Null-Byte & Size Sanity Check", "5-Page Revenue-Path Smoke Check"]),
# and #1651 records that CodeQL's measured yield on this repo's actual defect
# population is zero. If that yield ever becomes non-zero, put `pull_request`
# back and pay the 2,635 min/month deliberately rather than by default.
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 1'

# gh-1731: dedupe repeat-push churn on open PRs -- only the newest push's scan
# result is ever useful (an older commit's SAST result is moot once superseded),
# so cancel a still-running scan for the same PR/ref rather than let both finish.
# Scoped per-PR (falls back to the ref for push/schedule) so unrelated PRs never
# cancel each other. No fixture/DB state here (pure static analysis), so
# cancelling mid-run is safe -- unlike e2e-tests.yml's job, which is NOT
# touched here for exactly that reason (see this PR's body).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # gh-1731: every job in this repo now carries an explicit timeout. Saves 0
    # minutes on a healthy run; caps a hung job at 20 minutes instead of
    # GitHub's 6-hour default, i.e. 360 billable minutes from one stuck run.
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
