name: "CodeQL SAST"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 1'

# gh-1731: dedupe repeat-push churn on open PRs -- only the newest push's scan
# result is ever useful (an older commit's SAST result is moot once superseded),
# so cancel a still-running scan for the same PR/ref rather than let both finish.
# Scoped per-PR (falls back to the ref for push/schedule) so unrelated PRs never
# cancel each other. No fixture/DB state here (pure static analysis), so
# cancelling mid-run is safe -- unlike e2e-tests.yml's job, which is NOT
# touched here for exactly that reason (see this PR's body).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
