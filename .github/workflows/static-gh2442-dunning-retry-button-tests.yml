name: Static gh-2442 Dunning Retry Button Tests

# gh-2442: the contractor dashboard's "Retry Payment Now" button calls the server's request_dunning_retry() and
# makes no direct payment_failures write. `pull_request` (never `pull_request_target`), no secrets, read-only token.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'contractor-dashboard.html'
      - 'tests/gh2442-dunning-retry-button.mjs'
      - 'supabase/migrations_drafts/gh2442_dunning_retry_request.sql'
      - '.github/workflows/static-gh2442-dunning-retry-button-tests.yml'
  push:
    branches: [main]
    paths:
      - 'contractor-dashboard.html'
      - 'tests/gh2442-dunning-retry-button.mjs'
      - 'supabase/migrations_drafts/gh2442_dunning_retry_request.sql'
      - '.github/workflows/static-gh2442-dunning-retry-button-tests.yml'

permissions:
  contents: read

concurrency:
  group: static-gh2442-dunning-retry-button-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static-gh2442-dunning-retry-button-tests:
    name: Retry button calls request_dunning_retry, no direct write (gh2442)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Retry button uses the server request path (gh2442)
        run: node tests/gh2442-dunning-retry-button.mjs
