name: Static gh3009 Admin Allowlist

# gh-3009 items 2 and 3 -- the owner email must not ship in browser/edge files and admin
# determination must come from the server (is_admin_email()). Static check of tracked files;
# no secrets, read-only token. See tests/gh3009-no-owner-email-in-shipped-files.mjs.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: static-gh3009-admin-allowlist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static-gh3009-admin-allowlist:
    name: no owner email in shipped files (gh3009)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Shipped-file email and server-gate checks
        run: node tests/gh3009-no-owner-email-in-shipped-files.mjs
      - name: Negative control (a tracked shipped file carrying the owner email MUST make the detector fail)
        run: |
          # Plant a temporary tracked file under a shipped path; the literal is assembled at
          # runtime so it is never committed. Then require the detector to fail on it.
          f=react-app/gh3009-negative-control.ts
          cleanup() { git rm -q --cached -f "$f" 2>/dev/null || true; rm -f "$f"; }
          trap cleanup EXIT
          a=dustinstohler1; b=gmail.com
          printf "export const x = '%s@%s';\n" "$a" "$b" > "$f"
          git add -f "$f"
          if node tests/gh3009-no-owner-email-in-shipped-files.mjs > nc.log 2>&1; then
            cat nc.log; rm -f nc.log; echo "negative control did not fail"; exit 1
          fi
          grep -q "offenders: $f" nc.log || { cat nc.log; rm -f nc.log; echo "negative control failed for the wrong reason"; exit 1; }
          rm -f nc.log
          echo "negative control failed as expected"
