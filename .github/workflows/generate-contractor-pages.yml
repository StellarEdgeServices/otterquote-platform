name: Generate Contractor Directory Pages

on:
  schedule:
    - cron: '0 2 * * *'  # nightly at 2:00 AM UTC
  workflow_dispatch:       # allow manual trigger from Actions UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate:
    name: Generate Contractor Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # required to push generated files back to repo

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Generate contractor pages
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/generate_contractor_pages.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # gh-403: generator output dir is contractors/ (plural) — the old
          # "contractor/" path silently staged nothing, so CI-generated pages
          # were never committed.
          git add contractors/ sitemap.xml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit — pages are up to date."
          else
            git commit -m "chore(seo): regenerate contractor directory pages [skip ci]"
            git push
          fi
