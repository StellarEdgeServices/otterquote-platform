name: New-Table Service-Role Grant

# gh-2145 -- Supabase vendor notice (2026-09-23): on 2026-10-30 Supabase
# stops auto-granting Data API access to any NEW table created in `public`.
# Existing tables keep their current grants; this is diff-scoped exactly
# like permissions-ratchet.yml (gh-1767) and migrations-reconciliation-
# ratchet.yml (gh-1438) -- it only inspects what a PR's OWN diff adds to
# supabase/migrations/**/*.sql, never the repo's pre-existing 150+ files.
#
# Scope: requires an explicit `GRANT ... TO service_role` (or a schema-wide
# `ALL TABLES IN SCHEMA public` grant) covering any brand-new public table a
# PR creates. It does NOT require anon/authenticated grants -- those are a
# per-table product decision already gated by permissions-ratchet.yml's own
# allowlist/bypass-label rule, and duplicating that here would let the two
# gates disagree about the same statement. See scripts/new-table-service-
# role-grant-check.py's module docstring for the full reasoning, including
# the read-only prod grant enumeration that corrected gh-2145's own issue-
# body premise about partner_onboarding_sends.
#
# BUILD-FAILING, not advisory -- same posture as permissions-ratchet.yml,
# for the same reason: diff-scoped checks start clean on every PR that
# doesn't touch supabase/migrations/**, so there is no "can never go green"
# problem to justify an advisory posture.

# CTO RUN 46 (2026-09-28): this job became a REQUIRED status check on main
# at ~17:10Z (#2145). Two trigger gaps then blocked every merge:
#   1. no `merge_group` trigger -- main merges through a merge queue, which
#      fires `merge_group` on a gh-readonly-queue ref, so every queue entry
#      waited forever for this check (PR #2263 sat AWAITING_CHECKS from
#      17:02Z; its merge-group commit a52f37e4 ran the other 4 required
#      checks and never this one). Same class as gh-1855.
#   2. a `paths:` filter -- a required check whose workflow is path-filtered
#      out never reports on PRs that don't touch those paths, so those PRs
#      can never satisfy it. The script is already diff-scoped (it inspects
#      only migrations the diff adds), so running it on every PR costs one
#      billing-floor minute and changes no verdict.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]

permissions:
  contents: read

# gh-1731 (COST GATE): dedupe repeat-push churn on open PRs -- this check
# re-evaluates from scratch each run, so only the newest push's verdict is
# useful. Cancelling a still-running run for the same PR/ref is safe here
# (diff- or whole-tree-scoped, no shared fixture state) and does not change
# what this check verifies or whether it reports on the final commit --
# same pattern already applied to e2e-tests.yml/schema-lint.yml/
# react-app-tests.yml/codeql.yml/credential-sweep.yml (PR #1740).
# Measured net effect: ~$0 direct minute savings -- every job in this
# workflow already sits on GitHub's 1-minute billing floor, so a
# cancelled job bills the same minute a completed one does (PR #1740
# measured this directly). This is queue-depth and merge-latency only,
# per #1731's own "wall-clock is the half that costs throughput" framing,
# never applied to a merge_group-triggered required check.
concurrency:
  group: new-table-service-role-grant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  new-table-service-role-grant:
    name: New public tables must GRANT service_role explicitly
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history -- the script diffs base...head itself

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # BUILD-FAILING. Proves the detector's own rule logic (fixture-driven,
      # with a real negative control -- see new-table-service-role-grant-
      # fixtures/new_table_no_grant_bad.sql) before trusting its verdict on
      # this PR's actual diff below.
      - name: Self-test the detector's own rules
        run: python scripts/new-table-service-role-grant-check.py --self-test

      # BUILD-FAILING. gh-2145 follow-up: this repo's detector convention
      # (scripts/detector-negative-control-check.py CHECK 1) requires a
      # sibling <name>.test.py per detector-shaped script -- until now it
      # existed but was never actually run in this workflow. Exercises the
      # diff-mode path directly (ordering, UNLOGGED, TEMP, PARTITION OF
      # cases) rather than relying solely on the fixtures directory.
      - name: Run the detector's own test.py
        run: python scripts/new-table-service-role-grant-check.test.py

      # Stale-base trap fix (gh-1438, Marty A 5896036859): the event payload's
      # base.sha is not the current tip of main, so `base...head` spanned every
      # main commit merged into the PR since and read already-live GRANT lines
      # as new. Resolve the base from the checked-out ref instead: for a
      # pull_request event actions/checkout checks out the PR MERGE ref
      # (refs/pull/N/merge, fetch-depth 0), whose first parent HEAD^1 is the
      # current tip of the target branch. Fallbacks: merge_group -> its own
      # base_sha; anything else (or a checkout that is not a merge commit) ->
      # the target branch's remote tip, else fail loudly rather than guess.
      - name: Resolve base sha from the checked-out merge ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            base="$MERGE_GROUP_BASE"
          elif [ "$EVENT_NAME" = "pull_request" ] \
               && [ "$(git rev-parse --verify -q 'HEAD^2' || true)" = "$PR_HEAD" ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$(git rev-parse --verify -q "origin/${BASE_REF}" || true)"
          fi
          if [ -z "$base" ]; then
            echo "::error::could not resolve a base sha (event=$EVENT_NAME)" >&2
            exit 1
          fi
          echo "Resolved base: $base"
          echo "RESOLVED_BASE_SHA=$base" >> "$GITHUB_ENV"

      - name: Run the check against this PR's diff
        run: |
          python scripts/new-table-service-role-grant-check.py \
            --root . \
            --base "$RESOLVED_BASE_SHA" \
            --head "${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}"
