name: Playwright E2E Tests

# gh-1261 / Dustin's CEO ruling 2026-08-26 ("strip"): this suite's "Run E2E
# Tests" job had failed on every PR since 2026-06-23. It was neutralized with
# continue-on-error, NOT deleted. Its replacement as the merge gate is the
# "5-Page Revenue-Path Smoke Check" (.github/workflows/e2e-smoke.yml).
#
# gh-1731 (COST GATE), 2026-09-08: `Run E2E Tests` and `Seed Must Pass` have
# MOVED to .github/workflows/e2e-nightly.yml (nightly cron +
# workflow_dispatch). Measured, 7-day census Sep 1-7 2026 via the Actions API
# with job-level ceil(seconds/60) and GitHub's 1-minute-per-job billing floor:
# those two jobs cost 5.66 billable job-min per run x 452 runs/7d
# = 2,558 min/7d = 10,963 job-min/month, against a repo total of ~35,558
# job-min/month (independently confirmed against the org billing API:
# 8,297 "Actions Linux" minutes for this repo Sep 1-7). Net saving after the
# nightly run's own 190 job-min/month: -10,773 job-min/month. See #1731.
#
# NOTHING that carried PR signal was deleted. Step-by-step disposition of the
# old `test` job, so this is auditable rather than asserted:
#   * check-partner-sw-version.py, check-partner-surface-single-source.py,
#     check-payout-timing-copy-drift.py  -> moved into `static-integrity`
#     below (Python only, no new toolchain setup, no new job, so no new
#     1-minute billing floor is paid).
#   * `node --check` over js/**/*.js and the four tests/auth-*.mjs unit tests
#     -> moved into `typescript-check` below, which already runs
#     actions/setup-node, so again no new setup and no new job.
#   * `deno test supabase/functions/notify-contractors/test-exclusion.test.ts`
#     and `deno test supabase/functions/docusign-webhook/payload-parser.test.ts
#     ack-verify.test.ts` -> DROPPED as provably redundant, not as a cut. The
#     `edge-function-tests` job below already runs
#     `deno test --allow-read=supabase/functions supabase/functions/`, which
#     discovers every *.test.ts under that tree; all three files live under it
#     (verified: `find supabase/functions -name '*.test.ts'` lists
#     notify-contractors/test-exclusion.test.ts,
#     docusign-webhook/payload-parser.test.ts and
#     docusign-webhook/ack-verify.test.ts), and that job's own comment already
#     counts them ("ack-verify 11, payload-parser 7, test-exclusion 11").
#     They were being executed twice per PR, once for a 1-minute floor.
#   * Playwright install / seed / npm test / teardown / report+video artifact
#     uploads -> moved to e2e-nightly.yml unchanged.
#
# Not touched by gh-1731, deliberately, each with its measured reason:
#   * The two branch-protection-required contexts. Live
#     required_status_checks.contexts on `main` (2026-09-08T02:41Z) is exactly
#     ["Null-Byte & Size Sanity Check", "5-Page Revenue-Path Smoke Check"].
#     No `concurrency`/`paths` was added to either workflow: #1596 cost this
#     repo an hour-long merge-group timeout when a required check stopped
#     reporting, and the measured saving would have been ~0 anyway (both are
#     single-job and both sit on the 1-minute floor).
#   * Wider `paths` filters. Measured on a random 45 of the 155 PRs opened
#     Sep 1-7: 1 was docs/evidence-only (2.2%), so path filtering is worth
#     <=600 job-min/month across the whole repo. The `paths-ignore` below is
#     kept because it is free, not because it pays.

on:
  push:
    branches:
      - staging
      - main
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - 'handoffs/**'
  pull_request:
    branches:
      - staging
      - main
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - 'handoffs/**'
# gh-1731 (PR #1740, kept): skip this suite for pure prose/doc changes. Priced
# again on this run against a random 45 of the 155 PRs opened Sep 1-7 2026: 1
# was docs/evidence-only (2.2%), so this filter is worth well under 600
# job-min/month. Kept because it is free, not because it pays. NOTE the jobs
# below are NOT all advisory any more -- `ci-test-function-parity` and
# `is-test-cross-table-guard` deliberately carry no continue-on-error and MUST
# be able to fail a PR (gh-1584, gh-1763), so do not widen this filter without
# checking what it would let through for those two.

# gh-1731: supersede a PR's own in-flight run when a new push lands. Measured
# saving is ~0 job-minutes today -- the 155 PRs opened Sep 1-7 averaged 2.1
# push events each, and every remaining job in this workflow sits on GitHub's
# 1-minute billing floor, where a cancelled job bills the same minute a
# completed one does (PR #1740 measured this and reported it). It is added for
# queue depth and merge latency, which #1731 calls "the half that costs
# throughput", NOT as a cost line. Scoped per-PR (never repo-wide) and never
# applied to a merge_group-triggered required check.
concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static-integrity:
    name: Static Integrity Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Spec file structural integrity check (Stage 5 prevention, 86e1cee4y)
        run: python3 scripts/check-spec-files-closed.py

      - name: sb.auth.onAuthStateChange guard check (Stage 5 prevention, 86e1fratf)
        run: python3 scripts/check-sb-auth-guards.py

      - name: cookie-storage.js/config.js load-order check (Stage 5 prevention, #601)
        run: python3 scripts/check-script-load-order.py

      - name: $10,000 commission-floor phrasing guard (D-286, gh-920)
        run: python3 scripts/check-10k-floor-phrasing.py

      - name: Contractor credential/screening claim guard (D-104, gh-1617)
        run: python3 scripts/check-credential-claims.py

      - name: Partner-signup consent checkbox link guard (D-278, gh-943)
        run: python3 scripts/check-partner-consent-link.py

      - name: Analytics loader single-source guard (gtag.js + clarity.ms behind the host gate, gh-1619)
        run: python3 scripts/check-gtag-single-source.py

      # gh-1339 item 6 / D-312: no third-party vendor named on a customer-facing
      # surface. A gate demanding ZERO would be red on arrival — the residue is
      # 373 client-side references whose removal needs the D-312 scope ruling
      # recorded on #1339 — and a gate that is red on arrival gets switched off
      # within a day. So this is a RATCHET against scripts/vendor-scrub-baseline.json:
      # green today, red the moment a new vendor reference lands on any page, and
      # red again (with instructions) when a count DROPS and the baseline is not
      # lowered in the same PR, so the floor cannot silently drift back up. Its own
      # firing self-test runs first, because a ratchet whose detector cannot fire is
      # a green light bolted to a wall (gh-1738).
      - name: Vendor-scrub detector, firing self-test (D-312)
        run: python3 scripts/vendor-scrub-check.py --self-test

      - name: Vendor-scrub ratchet, all pages (D-312)
        run: python3 scripts/vendor-scrub-check.py --repo . --ratchet

      - name: supabase-js CDN pin + SRI guard (gh-1793)
        run: python3 scripts/check-supabase-js-sri.py

      # gh-1731: moved here from the old `test` job (now nightly). Pure Python,
      # no toolchain setup, so they cost this job 0 additional billable minutes
      # instead of riding along inside a 5.33-min/run Playwright job.
      - name: partner-sw.js VERSION-bump check (gh-831)
        run: python3 scripts/check-partner-sw-version.py

      - name: partner-surface single-source-of-truth check (gh-807)
        run: python3 scripts/check-partner-surface-single-source.py

      - name: payout-timing copy drift check (gh-832)
        run: python3 scripts/check-payout-timing-copy-drift.py

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'react-app/package-lock.json'

      - name: Install react-app dependencies
        working-directory: react-app
        run: npm ci --no-audit --no-fund

      # gh-1731: moved here from the old `test` job (now nightly). This job
      # already runs actions/setup-node, so these steps add no setup, no new
      # job and therefore no new 1-minute billing floor. They are cheap
      # (<10s each) and every one of them is a named regression guard, so they
      # keep running on every PR rather than moving to the nightly cadence.
      - name: Lint vanilla JS for syntax errors
        run: |
          echo "Running node --check on js/**/*.js ..."
          failed=0
          while IFS= read -r -d '' file; do
            if node --check "$file" 2>/tmp/node_check_err; then
              echo "PASS: $file"
            else
              echo "FAIL [parse-error]: $file"
              head -1 /tmp/node_check_err
              failed=1
            fi
          done < <(find js/ -name "*.js" -print0 2>/dev/null)
          if [ "$failed" -eq 1 ]; then
            echo "One or more JS files failed syntax check."
            exit 1
          fi
          echo "All js/ files passed syntax check."

      - name: auth.js stale-session no-hang unit test (#602 regression)
        run: node tests/auth-stale-session-no-hang.mjs

      - name: auth.js partner-role-resolution unit test (#817/#643 regression)
        run: node tests/auth-partner-role-resolution.mjs

      - name: index.html bounce routing-outcome unit test (#817 A1b regression)
        run: node tests/auth-index-bounce-routing.mjs

      - name: auth.js partner-surface single-source-of-truth unit test (#807 regression)
        run: node tests/auth-partner-surface-single-source.mjs

      - name: tsc --noEmit type gate (gh-414)
        working-directory: react-app
        run: npx tsc --noEmit

  ci-test-function-parity:
    name: CI-test Edge Function Parity Check (gh-1584)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No continue-on-error: this is the mechanism the CTO ruled for on gh-1584
    # ("only-as-needed *plus* a check that fails a PR whose test path calls a
    # function the CI-test project lacks") -- it must actually be able to
    # fail a PR, unlike the `test` job below.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Edge Function parity check against the CI-test project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/ci-test-function-parity.py

  is-test-cross-table-guard:
    name: is-test Cross-Table Guard (gh-1763)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No continue-on-error: same discipline as ci-test-function-parity above --
    # this must actually be able to fail a PR, not just log a warning.
    #
    # gh-1763: profiles.is_test and contractors.is_test disagreed on 7 production
    # rows and broke a real R-173 gate (claim 82f5dff4...). The CTO's ruling
    # (comment 5572645535): profiles is authoritative; contractors mirrors it. A
    # disagreement recurs the next time a test contractor is seeded by a path
    # that writes one table and not the other -- which is exactly how the 7
    # rows happened -- so per constitution entry 16 ("a recurring defect closes
    # on a mechanism, not a rule"), this job is that mechanism, not a follow-up.
    #
    # Runs against the CI-test project (zsdvaqilfdclwosmiheh) -- the same DB
    # `Seed Must Pass (gh-1584)` and `CI-test Edge Function Parity Check` already
    # use -- via --self-test, which seeds one throwaway fixture row in the exact
    # bad shape gh-1763 found, proves the guard goes RED, repairs it, proves
    # GREEN, then deletes everything it created. It never runs against
    # production (yeszghaspzwwstvsrioa): scripts/is-test-cross-table-check.py's
    # self_test() refuses that project ref outright before making any network
    # call, per gh-1763's hard limits -- the RED control's seeded write may only
    # ever happen in a local/fixture context.
    #
    # PR #1826 review (comment 5577633751): this job proves the DETECTION LOGIC
    # isn't regressed, and nothing else -- it says nothing about the actual
    # production disagreement count on any given day. That coverage is the
    # `is-test-cross-table-guard-prod` job in
    # .github/workflows/edge-function-drift.yml, on the same daily schedule as
    # the other production-drift detectors, reading production read-only via
    # the Management API (--management-api --project-ref) since this job's
    # PostgREST + service-role-key path is structurally unusable against
    # production (no SUPABASE_SERVICE_ROLE_KEY for prod exists anywhere).
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Pure client-side join+compare logic, no network -- catches a logic
      # regression even on a run where the CI-test project is unreachable.
      - name: Self-test the disagreement-detection logic (hermetic)
        run: python3 scripts/is-test-cross-table-check.test.py

      # Live RED/GREEN demonstration against the CI-test project's own DB.
      # Reuses SUPABASE_TEST_SERVICE_ROLE_KEY -- the same secret the `test`
      # job's Seed/Run/Teardown steps already use to write to this project --
      # rather than requesting a new one, since this job needs the identical
      # write scope (insert/update/delete one throwaway fixture row).
      - name: RED/GREEN self-test against the CI-test project
        env:
          SUPABASE_URL: https://zsdvaqilfdclwosmiheh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: python3 scripts/is-test-cross-table-check.py --self-test

  edge-function-tests:
    # Renamed from "Edge Function Tests (Deno)" (gh-1738): the old name was
    # load-bearing on trust it hadn't earned -- this job runs `deno test`
    # scoped to supabase/functions/ ONLY (see the step below) and has never
    # exercised netlify/edge-functions/*.ts. That gap is now covered
    # separately by .github/workflows/netlify-edge-functions.yml, whose own
    # job name says what IT covers instead of borrowing this one's. Verified
    # safe to rename: `git grep -n "Edge Function Tests"` finds this `name:`
    # as the only occurrence in the repo, and branch protection's
    # required_status_checks.contexts (queried live via the API) is exactly
    # ["Null-Byte & Size Sanity Check", "5-Page Revenue-Path Smoke Check"] --
    # this check was never in it.
    name: Supabase Edge Function Tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.8.3'

      # Pure-unit lane (gh-422): discovers every *.test.ts under supabase/functions/.
      # Runs with ZERO permission flags by default — no env, no secrets, no --allow-net —
      # so any future test that needs a secret fails loudly here instead of silently
      # gaining one. As of gh-422: 66 tests across 4 files (ack-verify 11, payload-parser 7,
      # test-exclusion 11, templates 37 — incl. the #850/#856 duration-guard class tests).
      #
      # gh-1319: three source-extraction tests (exhibit-a-shapes.test.ts,
      # starter-template.test.ts, parse-roof-summary.test.ts) read their own sibling
      # index.ts as text via Deno.readTextFile to pull out testable functions from an
      # otherwise single-file, untestable Edge Function. That needs --allow-read.
      # Scoped to supabase/functions/ only — still no --allow-net/--allow-env/--allow-sys,
      # so the gh-422 secret/network guarantee is unchanged; only local source reads
      # are permitted, and the whole repo is already present on the runner's disk.
      - name: Edge Function unit tests (pure-unit, no secrets)
        run: deno test --allow-read=supabase/functions supabase/functions/
