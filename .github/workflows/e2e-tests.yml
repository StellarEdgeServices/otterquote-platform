name: Playwright E2E Tests

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static-integrity:
    name: Static Integrity Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Spec file structural integrity check (Stage 5 prevention, 86e1cee4y)
        run: python3 scripts/check-spec-files-closed.py

      - name: sb.auth.onAuthStateChange guard check (Stage 5 prevention, 86e1fratf)
        run: python3 scripts/check-sb-auth-guards.py

      - name: cookie-storage.js/config.js load-order check (Stage 5 prevention, #601)
        run: python3 scripts/check-script-load-order.py

      - name: $10,000 commission-floor phrasing guard (D-286, gh-920)
        run: python3 scripts/check-10k-floor-phrasing.py

  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # gh-689: every E2E run seeds/tears down ONE shared set of fixtures on the
    # production Supabase project, so concurrent runs corrupt each other
    # (proven twice on the issue: 08-11 run-timestamp reconciliation, and
    # #703's claim-not-found failures on a SQL-only diff). Serialize all runs
    # of this job repo-wide until real data isolation lands.
    # GitHub semantics: at most 1 running + 1 pending per group; a newer
    # queued run supersedes (cancels) the previously PENDING one. E2E is
    # advisory, so a superseded run loses signal but blocks nothing — better
    # than N concurrent runs producing N false reds against each other.
    concurrency:
      group: e2e-shared-prod-fixtures
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: partner-sw.js VERSION-bump check (gh-831)
        run: python3 scripts/check-partner-sw-version.py

      - name: partner-surface single-source-of-truth check (gh-807)
        run: python3 scripts/check-partner-surface-single-source.py

      - name: payout-timing copy drift check (gh-832)
        run: python3 scripts/check-payout-timing-copy-drift.py

      - name: Lint vanilla JS for syntax errors
        run: |
          echo "Running node --check on js/**/*.js ..."
          failed=0
          while IFS= read -r -d '' file; do
            if node --check "$file" 2>/tmp/node_check_err; then
              echo "PASS: $file"
            else
              echo "FAIL [parse-error]: $file"
              head -1 /tmp/node_check_err
              failed=1
            fi
          done < <(find js/ -name "*.js" -print0 2>/dev/null)
          if [ "$failed" -eq 1 ]; then
            echo "One or more JS files failed syntax check."
            exit 1
          fi
          echo "All js/ files passed syntax check."

      - name: Setup Deno (notify-contractors unit tests)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: notify-contractors fan-out symmetry unit tests (#564 regression, notification direction)
        run: deno test supabase/functions/notify-contractors/test-exclusion.test.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package.json'

      - name: auth.js stale-session no-hang unit test (#602 regression)
        run: node tests/auth-stale-session-no-hang.mjs

      - name: auth.js partner-role-resolution unit test (#817/#643 regression)
        run: node tests/auth-partner-role-resolution.mjs

      - name: index.html bounce routing-outcome unit test (#817 A1b regression)
        run: node tests/auth-index-bounce-routing.mjs

      - name: auth.js partner-surface single-source-of-truth unit test (#807 regression)
        run: node tests/auth-partner-surface-single-source.mjs

      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Seed test database
        working-directory: tests/e2e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: npm run seed

      - name: Run Playwright tests
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test

      - name: Teardown test database
        if: always()
        working-directory: tests/e2e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run teardown

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 30

      - name: Upload test videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: tests/e2e/test-results/
          retention-days: 7
