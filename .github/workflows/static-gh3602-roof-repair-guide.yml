name: Static Roof Repair Guide Test

# gh-3602 -- the roof repair / overlay / replacement bids guide is built, listed in the sitemap and wired into the guides index.
# Runs tests/gh3602-roof-repair-overlay-guide.mjs (no browser, no secrets). `pull_request` only, read-only token, path-filtered.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'guides/roof-repair-overlay-or-replacement-bids.html'
      - 'guides/index.html'
      - 'sitemap.xml'
      - 'llms.txt'
      - '_redirects'
      - 'netlify/edge-functions/blog-guides-redirect.ts'
      - 'tests/gh3602-roof-repair-overlay-guide.mjs'
      - '.github/workflows/static-gh3602-roof-repair-guide.yml'

permissions:
  contents: read

concurrency:
  group: static-gh3602-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  roof-repair-guide:
    name: Roof repair guide (gh-3602)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Guide exists, listed, approved H1 (gh3602)
        run: node tests/gh3602-roof-repair-overlay-guide.mjs
