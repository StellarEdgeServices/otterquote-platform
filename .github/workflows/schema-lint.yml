name: Schema Column Lint

# gh-1731 (COST GATE), CTO RUN 43, figure corrected per adversarial review
# (comment 5857733012 on PR #2262 -- the original number below wrongly reused
# this workflow's whole-workflow run total instead of its push share): the
# `push` trigger is REMOVED (it fired on `main` -- 135 runs/7d measured
# 2026-09-20..27 -- and, separately, on 5 manual human pushes to `staging`
# over the workflow's history, most recently 2026-07-13; the GITHUB_TOKEN-
# pushed `staging` mirror itself never triggers a run -- each `main` run was
# a post-merge re-run of a commit the
# `pull_request` trigger below already fail-hard-checked pre-merge; at this
# workflow's measured 1.0 billable min/run that is ~579 job-min/month of
# zero-new-coverage re-checking, NOT ~2,563/month as originally stated here).
# Unlike e2e-tests.yml, a 7-day census found no merged-tree-only breakage
# this workflow's push leg would have caught, so accepting that (small,
# theoretical) coverage loss for the saving is defensible. Not a
# branch-protection-required context (see e2e-tests.yml's `on:` comment for
# the current required list). The paths:-filter history below is left in
# place unchanged -- it applies to `pull_request`, which still runs on every
# PR exactly as before; nothing about that reasoning changes when `push` is
# removed.
on:
  pull_request:
    branches: [main]
    # gh-1731 PR #1740 REVIEW: FAIL (comment 5560891984) -- a `paths:` filter
    # mirroring `push` was added here and reverted. The shared filter list
    # omits react-app/**/*.{ts,tsx,jsx}, which scripts/schema-column-lint.py's
    # own SCAN_EXTENSIONS (line 40) explicitly scans. That would have let a
    # PR touching only e.g. react-app/app/(homeowner)/bids/actions.ts skip
    # schema-contract checking entirely. Deliberately left unfiltered: this
    # is a fail-hard check (see Claude's Memories send-adjuster-email-prod-drift.md)
    # and the workflow already hits GitHub's 1-minute billing floor regardless
    # of whether it runs, so a path filter here saves ~0 real minutes against
    # a real money-path coverage hole. See PR #1740 for the withdrawn attempt
    # and #1731 for the cost-reduction context.

# gh-1731: dedupe repeat-push churn on open PRs -- the linter re-checks the
# full repo tree each run, so only the newest commit's result is useful.
concurrency:
  group: schema-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  schema-lint:
    name: Schema contract check
    runs-on: ubuntu-latest
    # gh-1731: explicit timeout. 0 minutes saved on a healthy run; caps a hung
    # job at 10 minutes instead of GitHub's 6-hour default (360 billable min).
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # gh-1314 / PR #1856: the linter now has one way NOT to fail -- a column
      # declared pending in sql/schema-pending.json against a drafted migration.
      # An escape hatch on a fail-hard money-path check is worth exactly as much
      # as the test that shows it cannot be widened by accident, so that test runs
      # FIRST, in this same job: an undeclared column must still fail, a missing
      # migration file must fail, and a stale declaration must fail.
      - name: Pending-column mechanism, proof of detection
        run: python3 scripts/schema-column-lint.test.py

      # FAIL-HARD MODE: All violations cleared in PR #148 (2026-05-26).
      # Any new FAIL line will block the PR. See ADR-010 for column contract rules.
      - name: Run schema column linter
        run: |
          python3 scripts/schema-column-lint.py \
            --root . \
            --schema sql/schema-snapshot.json

      # FAIL-HARD MODE: guard added for gh-720/gh-770 (2026-08-12) after a
      # hardcoded sb_secret_ key was found live in two SECURITY DEFINER
      # function bodies, world-readable via pg_catalog to anon/authenticated.
      - name: Run hardcoded-secret function-body linter
        run: |
          python3 scripts/schema-secret-lint.py --root .

      # FAIL-HARD MODE: guard added for gh-1307 (2026-08-28). A migration file
      # without the YYYYMMDDHHMMSS_ prefix is skipped by the Supabase runner
      # SILENTLY -- no error, no artifact -- so merged is indistinguishable from
      # applied. v113 sat merged-and-unapplied for over a week. Second occurrence
      # of the same defect, so per R-148 it closes on a mechanism, not a rule.
      # The script landed in PR #1308; this step is the wiring that PR claimed
      # and did not include (caught by CTO run cto-2026-08-28T19:45:25Z).
      - name: Run migration filename prefix linter
        run: |
          python3 scripts/migration-filename-lint.py --root .
