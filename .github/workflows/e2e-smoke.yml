name: 5-Page Revenue-Path Smoke Check

# gh-1261 / Dustin's CEO ruling 2026-08-26 ("strip"): the Playwright E2E
# suite (e2e-tests.yml, job "Run E2E Tests") has failed on every PR for 64
# days and stopped being a usable gate. This is its replacement: five pages
# picked for revenue-path coverage, each asserted for HTTP 200 + its own
# visible <h1> + zero uncaught console errors. It serves the site locally
# with a static file server rather than depending on staging being up, so it
# has no seeded-fixture contention and no external dependency to go stale.
# See hazard-register.md for the full history of the check it replaces.

on:
  # Merge queue: GitHub builds each queued PR on a gh-readonly-queue/main/**
  # branch, which matches neither the push branch filters nor pull_request.
  # Without this trigger the required check never reports and the merge group
  # is dropped at checkResponseTimeout (3600s). See gh-1596.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

jobs:
  smoke:
    name: 5-Page Revenue-Path Smoke Check
    runs-on: ubuntu-latest
    # gh-1588: raised 5 -> 10 as a stopgap, not a fix. Root cause (measured
    # 2026-09-03) is the "Install E2E test dependencies" (npm ci) step
    # intermittently stalling 2-5+ minutes with a WARM npm cache hit and
    # zero output in between -- consistent with npm-registry/network
    # flakiness on the runner, not a growing dependency tree (tests/e2e has
    # 15 resolved packages) or a genuinely slower job. 10m gives headroom
    # for the stall observed tonight (worst completed case ~4m10s for this
    # step alone); it does not address why npm ci stalls on a warm cache.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package.json'

      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: npm ci

      # gh-3050: the required check timed out 3x on 2026-10-23, always inside
      # the install step (runs 39964306779, 39936723774, 39936608041 sat in
      # "Install Playwright browser" for the full 10 min and were cancelled;
      # 39976719446 took 9m22s). Healthy runs take 12-16s there. The old step
      # ran `playwright install --with-deps`, whose apt-get update/install
      # leg has no timeout and stalls on the runner's apt mirrors, and the
      # cache key hashed the whole lockfile rather than the Playwright
      # version. Now: (1) cache keyed on the resolved Playwright version,
      # (2) the browser download is separate from the apt dependency step,
      # (3) apt deps are installed only if chromium cannot launch, (4) every
      # network leg has a hard per-attempt timeout and up to 3 attempts, so a
      # stall costs ~100s and a retry rather than the whole job. The job
      # timeout and the checks themselves are unchanged.
      - name: Resolve Playwright version
        id: pw-version
        working-directory: tests/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browser (chromium)
        working-directory: tests/e2e
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if timeout 100 npx playwright install chromium; then exit 0; fi
            echo "::warning::playwright install chromium attempt $attempt failed or timed out"
          done
          exit 1

      - name: Install Chromium system dependencies (only if chromium cannot launch)
        working-directory: tests/e2e
        timeout-minutes: 5
        run: |
          launch_check='require("@playwright/test").chromium.launch().then(b=>b.close()).then(()=>process.exit(0),e=>{console.error(e.message.split("\n")[0]);process.exit(1)})'
          if node -e "$launch_check"; then
            echo "chromium launches; skipping apt dependency install"
            exit 0
          fi
          for attempt in 1 2 3; do
            if timeout 100 npx playwright install-deps chromium; then exit 0; fi
            echo "::warning::playwright install-deps attempt $attempt failed or timed out"
          done
          exit 1

      - name: Run 5-page smoke check
        working-directory: tests/e2e
        run: npx playwright test --config=smoke/playwright.smoke.config.ts

      - name: Run internal-traffic opt-out gate check (gh-2064)
        working-directory: tests/e2e
        run: npx playwright test --config=smoke/internal-traffic-gate.config.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
