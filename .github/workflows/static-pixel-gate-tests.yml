permissions:
  contents: read

concurrency:
  group: static-pixel-gate-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static-pixel-gate-tests:
    name: Static pixel gate (node vm harness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Credential in the URL, PageView and history guards (gh2106-pixel-gaps)
        run: node tests/gh2106-pixel-gaps.mjs
      - name: Advertising-sharing opt-out and stored-flag read (gh2107-pixel-gate-optout)
        run: node tests/gh2107-pixel-gate-optout.mjs
      - name: GPC opt-out extended to GA4/Clarity-adjacent and LinkedIn/Reddit static gates (gh1925-gpc-optout)
        run: node tests/gh1925-gpc-optout.mjs
      - name: GPC capture on the create-payment-intent call (gh2107-gpc-client)
        run: node tests/gh2107-gpc-client.mjs
      - name: Partner dashboard activation RPC, per-user flag (gh2154-p2-app-activation)
        run: node tests/gh2154-p2-app-activation.mjs
      - name: Home-inspector agreement v3-2026-09, no fee/D-266 for inspectors (gh2155-hi0b)
        run: node tests/gh2155-hi0b-inspector-agreement.mjs
      - name: Static inspector agreement build parity, no drift vs source (gh2155-hi0c-parity)
        run: node tests/gh2155-hi0c-inspector-agreement-parity.mjs
      - name: No fee wording reachable on the inspector track, JS on/off + negative controls (gh2155-hi0c-sweep)
        run: node tests/gh2155-hi0c-inspector-sweep.mjs
      - name: leads_force_safe_insert_defaults() X-OQ-Internal header, start.html half (gh2068)
        run: node tests/gh2068-start-html-oq-internal-header.mjs
      - name: leads_force_safe_insert_defaults() X-OQ-Internal header, partner-re.html half (gh2068, cto38-b2068r)
        run: node tests/gh2068-partner-re-html-oq-internal-header.mjs
      - name: Short partner signup field set, attribution, D-333 (gh2154-p1-short-signup)
        run: node tests/gh2154-p1-short-signup.mjs
      - name: Partner dashboard one-time set-password card (gh2154-p1-set-password)
        run: node tests/gh2154-p1-set-password.mjs
      - name: Partner invite accept page -- prefill, checkbox gate, inspector track (gh2154-p5-invite-page)
        run: node tests/gh2154-p5-invite-page.mjs
      - name: Partner login forgot-password reset clears needs_password (gh2154-p1-login-reset)
        run: node tests/gh2154-p1-login-reset.mjs
      - name: Real supabase-js -- rejected updateUser() must not sign the partner out (gh2154-p1-cookie-storage-updateuser)
        run: node tests/gh2154-p1-cookie-storage-updateuser.mjs
      - name: gh-1980 PR 1 -- storage-adapter factory parity + key-awareness discriminating test (gh1980-pr1-key-aware-storage)
        run: node tests/gh1980-pr1-key-aware-storage.mjs
      - name: gh-1980 PR 2 -- storageKey convergence + #488 sign-out purge regression (gh1980-pr2-storagekey-migration)
        run: node tests/gh1980-pr2-storagekey-migration.mjs
      - name: gh-1980 PR 3 -- Google-only PKCE; shared clients implicit; landing-page fragment rescue (gh1980-pr3-pkce-flow)
        run: node tests/gh1980-pr3-pkce-flow.mjs
      - name: gh-1980 funnel-page convergence -- hi-4/hi-5/ins-3/ins-5 canonical client (gh1980-funnel-convergence)
        run: node tests/gh1980-funnel-convergence.mjs
      - name: RE-1 dedicated landing page -- approved copy, funnel_id attribution (gh2150-re1-page)
        run: node tests/gh2150-re1-page.mjs
      - name: INS-1 dedicated landing page -- approved copy, field set, funnel-id attribution (gh2151-ins1-page)
        run: node tests/gh2151-ins1-page.mjs
      - name: HI-1 dedicated landing page -- approved copy, field set, no-fee disclosure, HI-0.5 track links (gh2152-hi1-page)
        run: node tests/gh2152-hi1-page.mjs
      - name: S05 perf structure -- no render-blocking scripts/styles, lazy Supabase bundle on re-1/ins-1/hi-1 (gh2150-gh2151-s05-perf-structure)
        run: node tests/gh2150-gh2151-s05-perf-structure.mjs
      - name: S05 perf must-fixes -- recruit-code attribution race, pre-hydration submit queue/no-GET (gh2192-s05-must-fix)
        run: node tests/gh2192-s05-must-fix.mjs
      - name: Inspector-context crawler -- no fee text within 3 hops (JS on) / 1 hop (JS off) of hi-1/partner-inspectors, negative control (gh2155-hi05b-crawler)
        run: node tests/gh2155-hi05b-inspector-crawler.mjs
      - name: Handout PII/pixel gate -- code-only query string, validated code, no pixel, no Indiana claim, no paraphrased fee bullet, negative controls (gh2225)
        run: node tests/gh2225-handout-pii-gate.mjs
      - name: Install Playwright + Chromium from the tests/e2e lockfile (gh-2361 real-browser proof)
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Partner trust header on re-1/ins-1/hi-1 -- 390x744 FB UA, fields/legal/events unchanged, negative controls PN1-PN4 (cro47-trust-partner)
        run: node tests/cro47-trust-partner.mjs
