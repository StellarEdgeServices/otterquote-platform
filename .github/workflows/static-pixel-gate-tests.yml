name: Static Pixel Gate Tests

# gh-2107 / D-330 -- the STATIC Meta Pixel gate (js/meta-pixel-gate.js, loaded by 63 static pages) had its opt-out, credential-in-URL and
# PageView guards proven only by node vm-harness tests that no workflow ran (REVIEW N1 on #2139: "the static-stack guards have no CI
# coverage"). This runs them. Each test executes the REAL js/ file in a vm context and exits non-zero on any failed assertion.
#
# `pull_request` (never `pull_request_target`), no secrets, read-only token: it needs none. Path-filtered to the files that can change the
# verdict, so it costs nothing on unrelated PRs.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'js/meta-pixel-gate.js'
      - 'js/services.js'
      - 'js/cookie-storage.js'
      - 'tests/gh2106-pixel-gaps.mjs'
      - 'tests/gh2107-pixel-gate-optout.mjs'
      - 'tests/gh2107-gpc-client.mjs'
      - '.github/workflows/static-pixel-gate-tests.yml'
  push:
    branches: [main]
    paths:
      - 'js/meta-pixel-gate.js'
      - 'js/services.js'
      - 'js/cookie-storage.js'
      - 'tests/gh2106-pixel-gaps.mjs'
      - 'tests/gh2107-pixel-gate-optout.mjs'
      - 'tests/gh2107-gpc-client.mjs'
      - '.github/workflows/static-pixel-gate-tests.yml'

permissions:
  contents: read

concurrency:
  group: static-pixel-gate-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static-pixel-gate-tests:
    name: Static pixel gate (node vm harness)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Credential in the URL, PageView and history guards (gh2106-pixel-gaps)
        run: node tests/gh2106-pixel-gaps.mjs
      - name: Advertising-sharing opt-out and stored-flag read (gh2107-pixel-gate-optout)
        run: node tests/gh2107-pixel-gate-optout.mjs
      - name: GPC capture on the create-payment-intent call (gh2107-gpc-client)
        run: node tests/gh2107-gpc-client.mjs
