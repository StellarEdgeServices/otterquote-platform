name: R-120 retrigger sweep

# gh-1753: R-120 required-check retrigger sweep. Ruled by the CTO
# (2026-09-06T21:02:00Z, comment on gh-1753): "A workflow_dispatch-based
# sweep that finds open PRs missing a completed R-120 signed review check
# and re-triggers it. No verifier change, no pubkey change... Scope it to
# re-trigger and report, never to interpret."
#
# ROOT CAUSE THIS SERVES: r120-signed-review.yml runs on `pull_request_target:
# [opened, synchronize, reopened]`. GitHub has no way to fire that trigger
# retroactively, so a PR that has gone quiet since the check was added to
# branch protection, or since the signing key was rotated, keeps a required
# context that is not green, not red — just ABSENT, with nothing to notice.
# Confirmed live population as of this run: #1646 and #1668 (both `dirty`,
# and #1668 is stacked on #1646 — a signature covers a specific head sha, so
# they need manual conflict resolution by someone with write access before
# either can be signed; this sweep deliberately does not touch them, see the
# `exclude_prs` default below). BECAUSE those two are excluded by default,
# this tool's classification logic has, as of this fix, only ever been
# exercised against synthetic test fixtures — never against a real GitHub
# API response shape for the exact case it exists to serve. That is a
# genuine gap, not resolved by this fix (a live dispatch is out of scope for
# the fix itself — see PR #1785). Before flipping `dry_run` to `false`
# against the real population, dispatch once with `dry_run: true` (report
# only, confirmed inert by reading executeSweep/executeRecovery — dryRun
# short-circuits before any write call) to sanity-check classification
# against live data with zero risk, before ever writing.
#
# ⛔ WHAT THIS WORKFLOW CANNOT DO, ENFORCED STRUCTURALLY, NOT BY INTENT:
#   - `permissions:` below grants `pull-requests: write` (to list/get PRs,
#     read their head sha and auto_merge state, and — for a MISSING PR, or
#     one a previous crashed run stranded closed, only — close/reopen it
#     plus post plain informational/marker comments), `checks: read` (the
#     ONLY thing this workflow reads via the Checks API — `checks.listForRef`
#     — to see whether a completed "R-120 signed review" run already exists;
#     no other checks.* call is made anywhere in this workflow), and
#     `contents: read` (to check out scripts/r120/retrigger-sweep.mjs from
#     `main`, same sparse pattern r120-signed-review.yml itself uses). It
#     does NOT hold `checks: write`, so it has no API path that could create
#     or update a check-run — it cannot manufacture a green "R-120 signed
#     review" context even if a bug tried to. It does not hold
#     `contents: write`, so it cannot push a commit to any PR branch, and it
#     never checks out or reads PR head content — only PR *metadata*
#     (number, state, head sha, auto_merge) via the API.
#   - The verdict logic lives ENTIRELY in scripts/r120/verify.mjs, imported
#     by r120-signed-review.yml, which this workflow never imports, edits,
#     or triggers directly. This workflow's only effect on that gate is
#     closing-then-reopening an already-open PR, which is a metadata-only
#     state transition (no file, ref or commit touched) that happens to fire
#     GitHub's own `pull_request_target: reopened` event — the same event a
#     human clicking "Close" then "Reopen" in the UI would fire. The real
#     gate then runs unmodified and decides for itself.
#   - scripts/r120/retrigger-sweep.mjs never branches on a check's PASS/FAIL
#     conclusion — only on whether a completed run exists at all (see that
#     file's docstring and its own structural-incapacity test). A PR whose
#     check already ran, green or red, is left alone; so is one whose check
#     is still queued/in_progress. Fixture-driven proof of both the
#     retrigger action and the "leave it alone" declines — including a
#     driven, not described, crash-and-recover cycle for BLOCKER 1 — lives
#     in scripts/r120/retrigger-sweep.test.mjs (`node --test`).
#
# RECOVERABILITY (PR #1785 review, BLOCKER 1): the original close→reopen was
# two unguarded API calls, and a crash between them left a PR permanently
# closed with no trace and no way for this tool to rediscover it. Every
# dispatch of this workflow now runs a RECOVERY PASS FIRST: it scans
# recently-updated, non-merged, CLOSED PRs for a dangling "closing" marker
# comment (posted by this tool BEFORE it ever closes a PR) with no later
# "done" marker — i.e. a PR this tool itself stranded closed on some earlier,
# crashed run — and reopens it. See scripts/r120/retrigger-sweep.mjs for the
# full design rationale and scripts/r120/retrigger-sweep.test.mjs for the
# driven proof.
#
# BLAST RADIUS (PR #1785 review, MINOR 1): `max_actions` bounds the TOTAL
# number of close/reopen write actions (recovery reopens + new retriggers,
# combined) a single dispatch will perform. Defaults low (5) on purpose —
# this sweep exists to serve a rare-event population (a handful of PRs at
# most as of this writing), not to be a tool that can act on every open PR
# in one invocation. Anything beyond the cap is explicitly reported as
# `skipped-cap-reached`, never silently dropped.
#
# AUTO-MERGE (PR #1785 review, MINOR 2): closing a PR clears GitHub's
# auto_merge setting; reopening does not restore it. Rather than guess at
# restoring a setting this tool did not set, it refuses to act on any PR
# with auto_merge armed and reports `skipped-auto-merge-armed` — a human
# needs to retrigger that PR (and re-arm auto-merge if desired) manually.
#
# RECOVERY-PASS COMMENT FETCH (PR #1785 review round 2, BLOCKER): the
# recovery scan above now fetches EVERY comment on each closed candidate PR
# via scripts/r120/retrigger-sweep.mjs's `fetchAllComments` (full pagination
# through `github.paginate`), not a single `per_page:30` page. The per-issue
# comments endpoint returns oldest-first with no documented sort/direction
# override, so a bounded single page could — and, demonstrated on this PR,
# did — silently miss a closing marker on any PR with more than 30 total
# comments (routine here: Netlify, CI bots, the R-120 gate, prior run-work
# comments). See the FIX ROUND 2 section at the top of
# scripts/r120/retrigger-sweep.mjs for the full rationale and
# scripts/r120/retrigger-sweep.test.mjs for the driven before/after proof.
#
# HUMAN OVERRIDE (PR #1785 review round 2, SECOND FINDING; matching rule
# TIGHTENED in round 3 — see below): a person who sees a stranded PR and
# wants it to STAY closed can post a plain comment anywhere on it containing
# a LINE — by itself, nothing else sharing that line — that, once trimmed,
# is case-insensitively identical to the exact phrase
# `r120-retrigger-sweep: do-not-recover` (no special/hidden formatting
# needed — a human just types that one line). The recovery pass treats that
# as the chronologically-last signal on the PR (same precedence rule already
# used for closing/done markers) and will never reopen it while that remains
# the most recent signal. Overridden PRs are reported every dispatch as
# `skipped-human-override`, not silently dropped — see the "SECOND FINDING"
# section in scripts/r120/retrigger-sweep.mjs for the full design. Removing
# the phrase (posting a later comment without it — the override itself
# cannot be edited away without a fresh comment, this pass never edits or
# deletes anything) re-enables recovery on the next dispatch.
#
# FIX ROUND 3 (PR #1785 review, round 3 BLOCKER): round 2's match was a
# case-insensitive SUBSTRING anywhere in the comment body, which the round-3
# reviewer showed reclassifies a genuinely stranded PR as intentionally
# overridden the moment ANY later comment merely quotes or discusses the
# phrase in prose — including, demonstrably, this very PR's own review
# thread, which had already quoted the literal value several times before
# this fix landed. `isOverrideComment` (scripts/r120/retrigger-sweep.mjs) now
# requires the phrase ALONE on its own line, so ordinary discussion of the
# mechanism no longer arms it — see that file's "FIX ROUND 3" docstring for
# the full rationale, including the deliberate decision NOT to add a
# commenter-privilege check (stated there: this is a convenience control,
# not an authorisation boundary, and it can only ever suppress this tool's
# own automatic reopen — it performs no writes and never blocks a human from
# reopening the PR manually at any time).
#
# COST (gh-1731, R-031): `workflow_dispatch` ONLY, no `schedule:` trigger —
# standing cost is zero; it runs only when someone explicitly dispatches it.
# A single run (list open PRs + recovery scan of recently-updated closed PRs
# + one check-runs lookup per open PR + at most `max_actions` close/reopen
# pairs) is a single short job, well under a minute of runner time per
# invocation — call it ~1-2 job-minutes when dispatched, 0 job-minutes/month
# otherwise. Not scheduled because the population this closes (a check
# silently never running) is created by rare events — adding a required
# check, rotating the signing key — not by routine PR activity; a human or
# the CTO lane dispatches it after either of those, or whenever gh-1753-style
# symptoms recur.
#
# Reopening a MISSING/stranded PR fires GitHub's default `pull_request`
# event types (`opened, synchronize, reopened`), not just
# r120-signed-review.yml — this repo's codeql.yml, credential-sweep.yml,
# e2e-smoke.yml, e2e-tests.yml, post-deploy-verify.yml, schema-lint.yml, and
# (pre-existing, superseded, advisory-only) r120-review-gate.yml all also
# listen for those events and will re-run as a side effect. `max_actions`
# bounds how many PRs can trigger this cascade in one dispatch.
#
# Defaults to `dry_run: true` — the report-only mode — so a manual dispatch
# with no inputs never writes anything. Flip `dry_run` to `false` to act.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = report only, no writes. false = actually recover stranded PRs and close+reopen MISSING PRs.'
        type: boolean
        default: true
      exclude_prs:
        description: 'Comma-separated PR numbers to never act on even if MISSING (default: the known-dirty gh-1753 population — see the top-of-file comment for why).'
        type: string
        default: '1646,1668'
      max_actions:
        description: 'Cap on total close/reopen write actions this dispatch will perform (recovery + retrigger combined). Kept low on purpose.'
        type: string
        default: '5'

permissions:
  contents: read        # sparse-checkout retrigger-sweep.mjs from main only
  pull-requests: write  # list/get open+closed PRs, and — MISSING or stranded only — close+reopen+comment
  checks: read          # checks.listForRef — the only Checks API call this workflow makes, read-only

concurrency:
  group: r120-retrigger-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: R-120 retrigger sweep
    runs-on: ubuntu-latest
    steps:
      - name: Check out BASE branch only (sparse)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/r120/retrigger-sweep.mjs
          sparse-checkout-cone-mode: false

      - name: Run sweep
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EXCLUDE_PRS: ${{ inputs.exclude_prs }}
          MAX_ACTIONS: ${{ inputs.max_actions }}
        with:
          script: |
            const path = require('path');
            const { pathToFileURL } = require('url');
            const ws = process.env.GITHUB_WORKSPACE;
            const { planSweep, executeSweep, planRecovery, executeRecovery, fetchAllComments, formatReport, CHECK_NAME } =
              await import(pathToFileURL(path.join(ws, 'scripts/r120/retrigger-sweep.mjs')).href);

            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN !== 'false';
            const excludeNumbers = (process.env.EXCLUDE_PRS || '')
              .split(',').map((s) => s.trim()).filter(Boolean).map(Number);
            const maxActions = Number(process.env.MAX_ACTIONS || '5');

            // --- Recovery pass FIRST, every dispatch (BLOCKER 1 fix): find
            // PRs a previous, crashed run of this same tool left stranded
            // closed, and reopen them. Bounded to the most-recently-updated
            // closed PRs — a stranding is necessarily recent (this tool
            // only started existing with this PR), so there is no need to
            // paginate the repo's full closed-PR history.
            const recentClosed = await github.rest.pulls.list({
              owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 50,
            });
            const candidateClosed = recentClosed.data.filter((pr) => !pr.merged_at);
            // FIX ROUND 2 (PR #1785 review): issues.listComments documents no
            // sort/direction parameter and returns comments oldest-first, so a
            // single per_page:30 page silently misses a marker posted late in
            // a long thread. fetchAllComments paginates to exhaustion instead —
            // see its docstring in retrigger-sweep.mjs for why that is the
            // only option correct by the documented API contract.
            const commentsByPr = new Map();
            for (const pr of candidateClosed) {
              const allComments = await fetchAllComments({ github, owner, repo, issueNumber: pr.number });
              commentsByPr.set(pr.number, allComments);
            }
            const { stranded, overridden } = planRecovery(candidateClosed, commentsByPr);
            // Human override (PR #1785 review, SECOND FINDING): PRs a person
            // has explicitly told this tool to leave closed are reported here
            // — zero API calls, they are simply excluded from `stranded`.
            const overriddenResults = overridden.map((item) => ({ ...item, action: 'skipped-human-override' }));
            const { results: recoveryResultsRaw, actionsUsed: recoveryUsed } =
              await executeRecovery({ github, owner, repo, stranded, dryRun, maxActions });
            const recoveryResults = [...overriddenResults, ...recoveryResultsRaw];

            // --- Main sweep: open PRs missing a completed check.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            const checkRunsByPr = new Map();
            for (const pr of prs) {
              const resp = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, check_name: CHECK_NAME, per_page: 20,
              });
              checkRunsByPr.set(pr.number, resp.data.check_runs);
            }

            const plan = planSweep(prs, checkRunsByPr);
            const remainingActions = Math.max(0, maxActions - recoveryUsed);
            const { results } = await executeSweep({
              github, owner, repo, plan, dryRun, excludeNumbers, maxActions: remainingActions,
            });
            const report = formatReport(results, { dryRun, recoveryResults });

            core.info(report);
            await core.summary
              .addHeading(`R-120 retrigger sweep — ${dryRun ? 'dry run' : 'live'}`)
              .addCodeBlock(report, 'text')
              .write();
