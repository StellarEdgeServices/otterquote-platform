name: Entry-Point Reachability (Live)

# gh-1697 Part 2. Part 1 (the "Entry-Point Reachability" job in
# .github/workflows/e2e-smoke.yml) proves the CODE is operable, pre-merge,
# against a local static server. It cannot prove the bytes actually served by
# a deploy are operable -- byte-identical-to-main was exactly what #1693
# shipped, broken. This workflow runs the SAME spec
# (tests/e2e/smoke/entry-point-reachability.spec.ts, completely unchanged)
# against the live deployed site instead, via
# tests/e2e/smoke/playwright.entrypoint-live.config.ts.
#
# Trigger: deployment_status, filtered to a successful deployment whose
# target_url is the production otterquote.com site (Netlify's GitHub
# integration creates a GitHub Deployment + deployment_status per deploy;
# this also fires for deploy previews, which target_url filters out).
#
# gh-1729 UPDATE (2026-09-07): the "known gap" below was measured, not just
# suspected -- it is not a gap, it is a certainty. `deployment_status` cannot
# fire in this repo:
#
#   GET /repos/StellarEdgeServices/otterquote-platform/deployments   -> 200, count 0
#   GET /repos/StellarEdgeServices/otterquote-platform/environments  -> {"total_count":0}
#
# Zero GitHub Deployments have ever existed here and no environment is
# defined -- Netlify's integration with this repo does not create them. Two
# recent `main` tips also carried zero commit statuses of any kind, so there
# is no other GitHub-side event to react to either. The `deployment_status`
# trigger below is left in place (harmless, and free if Netlify's GitHub App
# integration is ever reconfigured to emit it), but this workflow's real
# trigger is now the `schedule` + `poll-for-new-deploy` job added below,
# which asks NETLIFY DIRECTLY whether a new production deploy has completed
# -- see scripts/deploy-completion-poll.py for the full reasoning, including
# the async-merge trap (a trigger keyed on the merge commit runs against
# bytes that have not deployed yet and is worse than no check at all; this
# polls Netlify's own `published_deploy`, never the triggering commit).
#
# KNOWN GAP, ORIGINAL (see gh-1697 closing comment): this workflow was
# authored and reviewed for correctness but its trigger could not be
# exercised from the authoring environment -- there is no way to generate a
# real `deployment_status` event without an actual Netlify deploy completing
# against this repo. Superseded by the measurement above: it cannot be
# exercised because it cannot occur, not because nobody has tried yet.
#
# Scope note: every entry point this spec clicks has its target function
# replaced with a spy BEFORE the click (see entry-point-reachability.spec.ts)
# -- the real Stripe/Supabase-backed implementations never run, against
# local OR live. Submit Bid/Renew Bid are asserted by href only, never
# clicked. Running this against production performs no purchase, no
# approval, and no navigation away from the page under test.

on:
  deployment_status:
  schedule:
    # gh-1729: the real trigger. Every 15 minutes, ask Netlify (not GitHub)
    # whether jade-alpaca-b82b5e's published production deploy has changed
    # since the last time this workflow checked. This is what actually keys
    # on the deploy COMPLETING rather than the merge happening -- see
    # scripts/deploy-completion-poll.py.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to run the reachability spec against'
        required: false
        default: 'https://otterquote.com'

jobs:
  poll-for-new-deploy:
    name: Poll Netlify for a new production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule'
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
      commit_ref: ${{ steps.poll.outputs.commit_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Self-test the poll decision logic
        run: python3 scripts/deploy-completion-poll.test.py

      # actions/cache has no "overwrite an existing key" primitive, so this
      # keys each run's saved state uniquely (by run id) and restores the
      # newest prior entry via the shared prefix -- the standard idiom for
      # state that must change on every run. GitHub evicts old entries under
      # its normal cache LRU; nothing here needs them kept beyond the most
      # recent one, and letting them expire is a feature (no unbounded growth).
      - name: Restore last-seen deploy state
        uses: actions/cache/restore@v4
        with:
          path: .netlify-deploy-poll-state.json
          key: netlify-deploy-poll-state-${{ github.run_id }}
          restore-keys: |
            netlify-deploy-poll-state-

      - name: Check Netlify for a completed production deploy
        id: poll
        env:
          NETLIFY_PAT: ${{ secrets.NETLIFY_PAT }}
        run: |
          set +e
          python3 scripts/deploy-completion-poll.py \
            --site-name jade-alpaca-b82b5e \
            --last-seen-file .netlify-deploy-poll-state.json
          poll_exit=$?
          set -e
          # Exit-code contract (scripts/deploy-completion-poll.py, same
          # convention as netlify-deploy-drift.py): 0 = measured/unchanged,
          # 2 = measured/changed (a new deploy just completed -- the routine,
          # DESIRED case this workflow exists to catch, not a failure), 3 =
          # UNMEASURED, 1 = uncaught error/timeout. REVIEW: FAIL (PR #1809
          # comment 5577200063) caught this step running with no exit-code
          # handling at all, so it went red on exit 2 -- the expected, common
          # case -- exactly as loudly as on a broken poller, training
          # reviewers to ignore red here. Fixed below: 0 and 2 both PROCEED
          # to the reachability spec; 1 and 3 FAIL THE JOB LOUDLY, because
          # "unmeasured is not a pass" is this repo's standing rule (gh-1419).
          case "$poll_exit" in
            0)
              echo "poll: exit 0 -- measured, no new deploy since last check. Proceeding (the spec job's if: condition will skip it)."
              ;;
            2)
              echo "poll: exit 2 -- measured, a new production deploy completed. Proceeding to the reachability spec."
              ;;
            3)
              echo "::error::poll: exit 3 -- UNMEASURED (could not read Netlify: bad token, network, or bad site name). Failing the job loudly rather than reporting silent green."
              exit 1
              ;;
            1)
              echo "::error::poll: exit 1 -- error or timeout in the poll script. Failing the job loudly."
              exit 1
              ;;
            *)
              echo "::error::poll: exit $poll_exit -- unexpected exit code (expected 0, 1, 2, or 3). Failing the job loudly."
              exit 1
              ;;
          esac

      - name: Save deploy state for the next scheduled run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .netlify-deploy-poll-state.json
          key: netlify-deploy-poll-state-${{ github.run_id }}

  entry-point-reachability-live:
    name: Entry-Point Reachability (Live)
    needs: [poll-for-new-deploy]
    permissions:
      contents: read
      # REVIEW: FAIL (PR #1809 comment 5577200063): the "Alarm on a real
      # production reachability failure" step below posts an issue comment
      # via the ambient github.token, but this repo's
      # default_workflow_permissions is `read` and neither the job nor the
      # workflow granted issues:write -- so the alarm 403s on every real
      # failure, reproducing the exact #1721 defect class ("the drift
      # detector's own comment channel silently 403s") this issue's body
      # cites as the reason "on failure it must do something" matters. Same
      # shape as edge-function-drift.yml's `netlify-drift` job: scoped to
      # this job only (poll-for-new-deploy doesn't need it).
      issues: write
    # `needs` alone would skip this job whenever poll-for-new-deploy is
    # itself skipped (every non-schedule trigger) -- always() plus the
    # explicit per-trigger conditions below is what keeps workflow_dispatch
    # and deployment_status working exactly as before.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deployment_status.state == 'success' &&
        contains(github.event.deployment_status.target_url, 'otterquote.com') &&
        !contains(github.event.deployment_status.target_url, 'deploy-preview')) ||
       (github.event_name == 'schedule' && needs.poll-for-new-deploy.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'tests/e2e/package.json'

      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browser (chromium)
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run entry-point reachability spec against the live site
        working-directory: tests/e2e
        env:
          LIVE_BASE_URL: ${{ github.event.inputs.base_url || github.event.deployment_status.target_url || 'https://otterquote.com' }}
          # gh-1729: logged only, for the async-trap negative control -- the
          # published commit ref this run's poll observed, so a closing
          # comment can paste it beside the merge sha and show they can
          # differ. Never used to select what to fetch: this spec always
          # hits LIVE_BASE_URL, which is the one URL Netlify actually serves.
          POLLED_PUBLISHED_COMMIT_REF: ${{ needs.poll-for-new-deploy.outputs.commit_ref }}
        run: npx playwright test --config=smoke/playwright.entrypoint-live.config.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: entry-point-reachability-live-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      # #1729's own body: "On failure it must do something. Today there is
      # no alert, no issue, no rollback." This is that something -- the
      # ambient per-run github.token (the #1721/#1733 reference pattern:
      # minted per-run, scoped to this repo, never stored) posts a comment
      # naming the run and the URL whose spec just failed live. Deliberately
      # NOT routed through netlify-deploy-drift.py's alarm path (that file
      # is owned by #1549/#1779 right now) -- this is its own minimal,
      # independent alarm, on its own issue.
      - name: Alarm on a real production reachability failure
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const base = "${{ github.event.inputs.base_url || github.event.deployment_status.target_url || 'https://otterquote.com' }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1729,
              body: `Entry-point reachability spec FAILED against the live production site (${base}), run triggered by \`${context.eventName}\`. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
