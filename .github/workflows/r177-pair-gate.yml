name: R-177 pair gate

# gh-2965. A REQUIRED-STATUS candidate: fails a PR flagged `r177:legal-read`
# (or titled [R-120]/[R-177]) unless a human-authored `LEGAL-READ: PASS` and
# `R-177 SIGNED` both name its exact head sha. Decision
# logic: scripts/r177/gate.mjs (offline tests: scripts/r177/gate.test.mjs).
#
# Why it exists: PR #2964 (flagged) merged through the merge queue with REVIEW
# only, because the pair was enforced only by a local tool. See Docs/r177-legal-read.md.
#
# Triggers are UNCONDITIONAL (no path filter) and include `merge_group`, for the
# reason spelled out in r177-predicate-tests.yml (gh-1855): a required context
# whose workflow does not report on the queue ref freezes the whole merge queue.
# `labeled`/`unlabeled` are included so the label the labeller adds is seen.
# `pull_request`, never `pull_request_target` (workflow-safety-ratchet, gh-1651):
# the pull_request job needs only read tokens.
#
# The gate code is checked out from the DEFAULT BRANCH, never from the PR, so a PR
# cannot weaken the gate that polices it. Bootstrap: while run.cjs is not yet on
# the default branch (the PR that introduces it) the job reports a notice and passes.
#
# THIS FILE DOES NOT MAKE THE CHECK REQUIRED. Adding "R-177 pair gate" to the
# merge-queue ruleset's required status checks is a repository-settings change
# owned by Dustin/exec:cto and is deliberately not done here.
#
# After posting the pair, post any comment (or edit/delete one) on the PR: the issue_comment job
# re-evaluates and posts a fresh "R-177 pair gate" check run on the head sha. The merge_group run
# re-evaluates from scratch regardless.
#
# STRICT HEAD (#2912 comment 6323562999): the pair must name the exact head sha; the
# main-merge ancestor walk is off (STRICT_HEAD in scripts/r177/gate.mjs).
#
# TRUST (R-134, REVIEW 6324652357): the repo is public. Only comments whose author_association is
# OWNER/MEMBER/COLLABORATOR (or the company login) count, never bots.
#
# SAFETY: two jobs. `r177-pair-gate` (pull_request, merge_group) holds READ-ONLY permissions.
# `r177-pair-gate-comment` (issue_comment) is the only job with `checks: write`. Neither checks
# out nor executes PR code: scripts/r177/gate.mjs and run.cjs are read from the DEFAULT branch,
# actions are pinned by full commit sha, credentials are not persisted, only GITHUB_TOKEN is used.
# issue_comment (created, edited, deleted): deleting a pair comment re-evaluates and turns red.

on:
  issue_comment:
    types: [created, edited, deleted]
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

# No workflow-level permissions: each job declares its own minimal set.
permissions: {}

jobs:
  r177-pair-gate:
    name: R-177 pair gate
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    concurrency:
      group: r177-pair-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out gate code from the default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/r177/gate.mjs
            scripts/r177/run.cjs
          sparse-checkout-cone-mode: false

      - name: Evaluate the R-177 pair
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runPath = path.join(process.env.GITHUB_WORKSPACE, 'scripts/r177/run.cjs');
            if (!fs.existsSync(runPath)) {
              core.notice('scripts/r177/run.cjs is not on the default branch yet (bootstrap); gate not applicable.');
              return;
            }
            await require(runPath)({ github, context, core, postCheck: false });

  r177-pair-gate-comment:
    name: R-177 pair gate (comment re-evaluation)
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: write
    concurrency:
      group: r177-pair-gate-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Check out gate code from the default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/r177/gate.mjs
            scripts/r177/run.cjs
          sparse-checkout-cone-mode: false

      - name: Evaluate the R-177 pair and post the check run on the PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runPath = path.join(process.env.GITHUB_WORKSPACE, 'scripts/r177/run.cjs');
            if (!fs.existsSync(runPath)) {
              core.notice('scripts/r177/run.cjs is not on the default branch yet (bootstrap); gate not applicable.');
              return;
            }
            await require(runPath)({ github, context, core, postCheck: true });
