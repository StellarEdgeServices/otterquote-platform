name: React App Unit Tests

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'react-app/**'
      - 'supabase/functions/_shared/capi-event-id.contract.json'
      - '.github/workflows/react-app-tests.yml'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'react-app/**'
      - 'supabase/functions/_shared/capi-event-id.contract.json'
      - '.github/workflows/react-app-tests.yml'

# gh-1731: dedupe repeat-push churn on open PRs -- unit tests have no shared
# fixture state, so cancelling a superseded run is safe.
concurrency:
  group: react-app-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  react-app-tests:
    name: React App Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Vitest unit tests
        run: npm test
      # gh-1462: ESLint gate (flat config, eslint 9 + eslint-config-next 16). Runs in this
      # existing job so it reuses the installed dependencies (no extra job, no extra billing
      # minute) and inherits the same path filters and push:main trigger. Errors fail the
      # step; --max-warnings is a ratchet pinned at the warning count measured on main
      # (124, all from the five react-hooks v7 rules set to "warn" in eslint.config.mjs).
      # Lower it as warnings are cleaned up; never raise it without a tracked reason.
      - name: Run ESLint (gh-1462)
        run: npx eslint . --max-warnings=124
