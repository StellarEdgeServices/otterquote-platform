name: React App Unit Tests

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'react-app/**'
      - 'supabase/functions/_shared/capi-event-id.contract.json'
      - 'supabase/functions/_shared/platform-fee.ts'
      - 'contractor-bid-form.html'
      - '.github/workflows/react-app-tests.yml'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'react-app/**'
      - 'supabase/functions/_shared/capi-event-id.contract.json'
      - 'supabase/functions/_shared/platform-fee.ts'
      - 'contractor-bid-form.html'
      - '.github/workflows/react-app-tests.yml'

# gh-1731: dedupe repeat-push churn on open PRs -- unit tests have no shared
# fixture state, so cancelling a superseded run is safe.
concurrency:
  group: react-app-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  react-app-tests:
    name: React App Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Vitest unit tests
        run: npm test
      # gh-1462: ESLint gate (flat config, eslint 9 + eslint-config-next 16). Runs in this
      # existing job so it reuses the installed dependencies (no extra job, no extra billing
      # minute) and inherits the same path filters and push:main trigger. Errors fail the
      # step; --max-warnings is a ratchet pinned at the warning count measured on main
      # (124, all from the five react-hooks v7 rules set to "warn" in eslint.config.mjs).
      # Lower it as warnings are cleaned up; never raise it without a tracked reason.
      - name: Run ESLint (gh-1462)
        run: npx eslint . --max-warnings=124
      # CEO153 (Refs #3702): production build gate. tsc, vitest and eslint all passed on Dependabot
      # #3702 (tailwindcss 3 -> 4) while `next build` fails ("use tailwindcss directly as a PostCSS
      # plugin"). Runs last in this job so it reuses the installed dependencies and never changes the
      # order or behaviour of the gates above. Env values are non-secret placeholders: app/lib/supabase.ts
      # throws at module evaluation if the two NEXT_PUBLIC_SUPABASE_* vars are empty, and nothing is
      # contacted at build time (same placeholders as static-gh3266-fold-tests.yml). Netlify builds with
      # the same `npm run build` (react-app/netlify.toml).
      - name: Build react-app (next build)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-not-a-real-key
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
