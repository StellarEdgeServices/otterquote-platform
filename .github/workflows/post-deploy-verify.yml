name: File Integrity Check

on:
  # Merge queue: GitHub builds each queued PR on a gh-readonly-queue/main/**
  # branch, which matches neither the push branch filters nor pull_request.
  # Without this trigger the required check never reports and the merge group
  # is dropped at checkResponseTimeout (3600s). See gh-1596.
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  file-integrity:
    name: Null-Byte & Size Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run file integrity checks
        run: python3 scripts/ci-file-integrity.py
