# R-072: File integrity gate — null-byte / truncation detection (86e1unc2b)
# Runs scripts/ci-file-integrity.py on every PR to main and every push to
# staging/main. Fails the build on any null-byte, size-floor, HTML truncation,
# JS parse, or TS EF / MD check violation.
# See scripts/ci-file-integrity.py for full violation class documentation.
name: File Integrity Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [staging, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  integrity:
    name: Null-byte / truncation gate (R-072)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: File integrity check (null-byte, size, HTML, JS, TS EF, MD)
        run: python3 scripts/ci-file-integrity.py
