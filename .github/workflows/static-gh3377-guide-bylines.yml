name: Static gh3377 Guide Bylines

# gh-3377 -- Dustin's byline must be on the 32 guides he cleared plus the earlier guides still live,
# on no other page, and the total carrier count must match (retiring or adding a guide changes it).
# Static check of tracked files; no secrets, read-only token. See tests/gh3377-guide-bylines.mjs.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'guides/**'
      - '**/*.html'
      - '_redirects'
      - 'tests/gh3377-guide-bylines.mjs'
      - '.github/workflows/static-gh3377-guide-bylines.yml'

permissions:
  contents: read

concurrency:
  group: static-gh3377-guide-bylines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  static-gh3377-guide-bylines:
    name: guide bylines on exactly the expected pages (gh3377)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: Guide byline checks
        run: node tests/gh3377-guide-bylines.mjs
