name: Permissions Ratchet

# gh-1767 -- the only thing that previously noticed `GRANT EXECUTE ON
# FUNCTION public.<x>() TO anon` was R-120's money-permission branch
# (scripts/r177/predicate.mjs, formerly scripts/r120/verify.mjs before PR
# #1803), and it only noticed by accident: it fires on the function's NAME
# matching a money-word regex, so it misses `admin_delete_user()` entirely
# and over-fires on #1634's all-REVOKE forward migration. See
# scripts/permissions-ratchet.py's own module docstring for the full
# reasoning, the allowlist enumeration, and the scope boundary
# (supabase/migrations/** literal -- migrations_drafts/ and
# migrations_rollbacks/ are sibling directories, excluded by construction).
#
# Per the issue's own instruction, R-120's money-permission branch is NOT
# removed here -- that is its own follow-up, itself a GATE_FILE change
# needing its own signature.
#
# BUILD-FAILING, not advisory (unlike detector-negative-control.yml's
# report-only posture): this check is diff-scoped to lines a PR itself adds,
# so -- unlike a whole-repo sweep -- it starts clean on every PR that doesn't
# touch supabase/migrations/**, and a PR that does touch it only fails on
# what THAT PR newly introduces, never on the repo's pre-existing 150+
# migration files. There is no "can never go green" problem here to justify
# an advisory posture.
#
# Runs on `pull_request` only (never `push`), because the label-bypass read
# (`github.event.pull_request.labels`) only exists on a pull_request event
# payload, and this ratchet's whole job is to gate what actually gets merged.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# gh-1731 (COST GATE): dedupe repeat-push churn on open PRs -- this check
# re-evaluates from scratch each run, so only the newest push's verdict is
# useful. Cancelling a still-running run for the same PR/ref is safe here
# (diff- or whole-tree-scoped, no shared fixture state) and does not change
# what this check verifies or whether it reports on the final commit --
# same pattern already applied to e2e-tests.yml/schema-lint.yml/
# react-app-tests.yml/codeql.yml/credential-sweep.yml (PR #1740).
# Measured net effect: ~$0 direct minute savings -- every job in this
# workflow already sits on GitHub's 1-minute billing floor, so a
# cancelled job bills the same minute a completed one does (PR #1740
# measured this directly). This is queue-depth and merge-latency only,
# per #1731's own "wall-clock is the half that costs throughput" framing,
# never applied to a merge_group-triggered required check.
concurrency:
  group: permissions-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  permissions-ratchet:
    name: No new GRANT to anon/PUBLIC/authenticated
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history -- the script diffs base...head itself

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # BUILD-FAILING. Proves the ratchet's own rule logic before trusting
      # its verdict on this PR's actual diff below -- same self-test-before
      # -real-check pattern as migrations-reconciliation-ratchet.yml and
      # detector-negative-control.yml. Every rule has a fixture observed
      # failing on the bad shape and passing on the safe shape (see
      # scripts/permissions-ratchet-fixtures/ and --self-test).
      - name: Self-test the ratchet's own rules
        run: python scripts/permissions-ratchet.py --self-test

      # BUILD-FAILING. gh-1438 CTO RUN 43 follow-up (review comment
      # 5856302490): scripts/permissions-ratchet.test.py existed but was
      # never actually run in this workflow -- only its own `--self-test`
      # (the fixture suite) was wired in above. This exercises the rename-
      # awareness / version-safety logic directly (Layer 3 / Layer 3b),
      # which the fixtures directory does not cover, same convention as
      # new-table-service-role-grant.yml's "Run the detector's own test.py"
      # step.
      - name: Run the ratchet's own test.py
        run: python scripts/permissions-ratchet.test.py

      - name: Guard - GRANT gates must not use the stale event base sha
        run: python scripts/grant-gates-dynamic-base.test.py

      # Stale-base trap fix (gh-1438, Marty A 5896036859): the event payload's
      # base.sha is not the current tip of main, so `base...head` spanned every
      # main commit merged into the PR since and read already-live GRANT lines
      # as new. Resolve the base from the checked-out ref instead: for a
      # pull_request event actions/checkout checks out the PR MERGE ref
      # (refs/pull/N/merge, fetch-depth 0), whose first parent HEAD^1 is the
      # current tip of the target branch. Fallbacks: merge_group -> its own
      # base_sha; anything else (or a checkout that is not a merge commit) ->
      # the target branch's remote tip, else fail loudly rather than guess.
      - name: Resolve base sha from the checked-out merge ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            base="$MERGE_GROUP_BASE"
          elif [ "$EVENT_NAME" = "pull_request" ] \
               && [ "$(git rev-parse --verify -q 'HEAD^2' || true)" = "$PR_HEAD" ]; then
            base="$(git rev-parse HEAD^1)"
          else
            base="$(git rev-parse --verify -q "origin/${BASE_REF}" || true)"
          fi
          if [ -z "$base" ]; then
            echo "::error::could not resolve a base sha (event=$EVENT_NAME)" >&2
            exit 1
          fi
          echo "Resolved base: $base"
          echo "RESOLVED_BASE_SHA=$base" >> "$GITHUB_ENV"

      # BUILD-FAILING. Diff-scoped to supabase/migrations/**/*.sql lines
      # THIS PR adds (base = the PR's target-branch sha, head = the PR's own
      # tip; the script diffs with `git diff base...head`, i.e. against
      # their merge-base, so it never sees unrelated commits landed on main
      # after this PR branched). A bypass must "print loudly that it was
      # used" (work order) -- `--labels` is read directly from the
      # pull_request event's own label list via the `join()` expression
      # below, never re-derived from any other source. Comma-joined so a
      # label containing no comma (this repo's convention:
      # "permissions-ratchet: reviewed") survives the script's own
      # --labels split intact.
      - name: Run permissions ratchet against this PR's diff
        id: ratchet
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python scripts/permissions-ratchet.py \
            --root . \
            --base "$RESOLVED_BASE_SHA" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --labels "$PR_LABELS"

      - name: Publish report to the job summary
        if: always()
        run: |
          {
            echo "# Permissions Ratchet (gh-1767)"
            echo
            echo "Base: \`$RESOLVED_BASE_SHA\`  Head: \`${{ github.event.pull_request.head.sha }}\`"
            echo "Labels seen: \`$PR_LABELS\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
