name: R-120 verifier tests

# gh-1768: scripts/r120/verify.test.mjs is the only automated thing that
# holds R-120's predicate honest, and until now nothing ran it in CI — it was
# a local-only, run-it-if-you-remember suite since gh-1650.
#
# Runs every *.test.mjs file under scripts/r120/ via a glob rather than a
# hardcoded file list. At the time this was wired, scripts/r120/ contains
# only verify.test.mjs (29 tests) — gh-1701's predicate-scope PR (#1769) adds
# a second file, verify.scope.test.mjs, plus COPY_GUARD_FILES to verify.mjs,
# but that PR is still open (a GATE_FILE change, blocked on Dustin's R-120
# signature) as of this workflow landing. The glob means this job picks up
# verify.scope.test.mjs automatically the moment #1769 merges — no follow-up
# CI-wiring edit required, and no risk of silently referencing a test file
# that does not exist yet on main.
#
# Deliberately narrow triggers (gh-1731: PR-churn CI cost): only the verifier
# itself and the two trees the scope ratchet (once merged) walks.
#
# NOTE: this is NOT the gate. The gate is "R-120 signed review"
# (.github/workflows/r120-signed-review.yml), which runs from the BASE branch on
# pull_request_target and is the required check. This job runs PR code and is
# advisory by design — it must never be made a required substitute for a signature.

on:
  pull_request:
    paths:
      - 'scripts/r120/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/r120-verifier-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/r120/**'
      - 'scripts/**'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: r120-verifier-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verifier-tests:
    name: R-120 verifier tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --test scripts/r120/*.test.mjs
        run: node --test scripts/r120/*.test.mjs
