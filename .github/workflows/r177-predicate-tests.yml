name: R-177 predicate tests

# gh-1768 (as "R-120 verifier tests"), renamed by R-177 (2026-09-07).
#
# scripts/r177/predicate.test.mjs and predicate.scope.test.mjs are the only
# automated thing holding the legal/money predicate honest. The predicate is now
# a LABELLER, not a gate ("R-177 legal-read labeller (informational, always green)",
# .github/workflows/r177-legal-read.yml, which always exits 0), so this suite is
# the only place a scope regression is caught at all — the COPY_GUARD_FILES
# ratchet in predicate.scope.test.mjs walks scripts/ and tools/ and fails,
# naming the file, when something carrying customer copy vocabulary drops out of
# the predicate's view.
#
# Runs every *.test.mjs under scripts/r177/ via a glob rather than a hardcoded
# list, so a new control file is picked up with no CI-wiring edit.
#
# gh-1855: the `pull_request` trigger used to be path-filtered the same as the
# `push` trigger below (gh-1731: PR-churn CI cost). That is a correctness bug,
# not just a cost optimization, for the one thing this issue is actually about:
# a workflow whose `pull_request` trigger is path-filtered can NEVER be safely
# named as a GitHub branch-protection required status check, because a PR that
# does not touch the filtered paths never causes the job to run at all -- the
# named context is left "Expected", GitHub blocks the merge waiting for a
# status that will never be reported, and every unrelated PR is frozen. That is
# almost certainly *why* this check has never been made required (root-caused
# on gh-1855: PR #1836 merged to `main` with this check red, because nothing
# blocked it, and five sibling PR branches inherited the red state within 90
# minutes -- the incident this issue tracks).
#
# So `pull_request` is now UNCONDITIONAL: this job runs, and reports a status,
# on every PR regardless of what it touches -- the precondition for someone
# (Dustin/CTO; a repo-settings change, not this workflow file) to add
# "R-177 predicate tests" to `required_status_checks.contexts` on `main`
# without freezing the rest of the queue. Cost (#1731): this suite is 53 tiny
# `node --test` assertions with no I/O, ~0.2-0.5s of actual test time measured
# locally (plus ~10-20s of checkout/setup-node fixed overhead) -- not in the
# same class as the E2E/Playwright suites #1731 was written against, so paying
# it on every PR is the cheap side of this tradeoff, not the expensive one.
# `push` to `main` stays path-filtered below: that trigger does not gate PR
# merges, and there is no correctness reason to widen it.
#
# Advisory by design (this workflow, still): being made a REQUIRED status
# check is a branch-protection change owned by Dustin/CTO, not shipped by this
# file. Until that repo-settings step happens, this job is still informational
# — it runs and reports, but nothing blocks on it. See Docs/r177-legal-read.md.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/r177/**'
      - 'scripts/**'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: r177-predicate-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  predicate-tests:
    name: R-177 predicate tests
    runs-on: ubuntu-latest
    # gh-1731: explicit timeout. 0 minutes saved on a healthy run; caps a hung
    # job at 10 minutes instead of GitHub's 6-hour default (360 billable min).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard against an empty test glob (gh-1885)
        run: |
          shopt -s nullglob
          files=(scripts/r177/*.test.mjs)
          echo "Matched ${#files[@]} test file(s): ${files[*]}"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::scripts/r177/*.test.mjs matched 0 files -- the R-177 predicate test suite is missing, not passing. A PR that deletes or renames it must not turn this job green (gh-1885)." >&2
            exit 1
          fi
      - name: node --test scripts/r177/*.test.mjs
        run: node --test scripts/r177/*.test.mjs
