[functions.submit-partner-w9]
# verify_jwt=false: auth performed in-handler via user-scoped client (auth.getUser).
# Preserves existing behavior; bucket changed to partner-w9 (86e1v6nnh Item 4).
verify_jwt = false

[functions.create-payment-intent]
# Auth enforced inside handler: user JWT → claim ownership + server-side amount; service-role → platform_fee only (86e1v6nnh).
verify_jwt = true

[functions.create-docusign-envelope]
# Auth enforced inside handler: caller must be a party to the claim (86e1v6nnh).
verify_jwt = true

[functions.hover-oauth-callback]
# OAuth redirect URI — Hover redirects the browser here with no JWT. CSRF-state enforced inside handler (86e1v6nnh).
verify_jwt = false

[functions.send-incomplete-onboarding-reminders]
# Cron-exception: JWT verification disabled; access is gated by CRON_SECRET header check inside the function.
verify_jwt = false

[functions.process-payout-reminders]
# Cron-exception: JWT verification disabled; access is gated by CRON_SECRET header check inside the function.
verify_jwt = false

[functions.notify-payout-pending]
# DB-trigger-exception: called by apply_referral_commission() trigger via pg_net with service role bearer.
# JWT verification disabled; rate-limited + idempotent (notification_sent_at stamp). CRON_SECRET gate
# deferred — requires Tier 3 SQL migration to update pg_net call in apply_referral_commission trigger.
verify_jwt = false

[functions.parse-loss-sheet]
# Frontend + EF-called: called with user JWT from bids.html loss-sheet upload and from other EFs.
# JWT verification disabled to allow service-role callers; rate-limited (10/day, 50/month per claim).
verify_jwt = false

[functions.get-contractor-info]
# Auth enforced inside handler: homeowner JWT + claim ownership + contractor link check (86e1v6nnh).
verify_jwt = true

[functions.record-attestation]
# Auth enforced inside handler: caller must present a verified JWT (auth.getUser) and own the
# contractor record being attested for (D-220 Phase 16; prior --no-verify-jwt bypass closed).
verify_jwt = true

[functions.send-welcome-email]
# Auth enforced at gateway + in-handler: contractor presents a verified JWT (auth.getUser) and must
# own the contractor record being welcomed (D-220 Phase 16 Unit 1b). Recipient is server-derived from
# contractors.email — replaces the former send-support-email open-relay welcome path.
verify_jwt = true

# ── D-211 Phase 16: pin verify_jwt for every EF touched this phase ──────────────
# These match the live deployed state. Pinned so a future flagless `functions deploy`
# (CLI default verify_jwt=true) can't silently flip them. No behavior change.

[functions.process-auto-bids]
# D-093 cron — auth gated in-handler (X-Cron-Secret/CRON_SECRET or service-role Bearer). Pin false so
# a flagless redeploy can't JWT-protect the 5-min cron processor (D-211 Phase 16 Unit 0).
verify_jwt = false

[functions.send-support-email]
# Public support form — emails the hardcoded admin + inserts a ticket; the to_email open-relay branch
# was removed (D-211 Phase 16 Unit 1b). Pin false so the public form keeps working.
verify_jwt = false

[functions.get-hover-pdf]
# Auth + claim-association enforced in-handler (D-211 Phase 16 Unit 2 IDOR fix). Pin false.
verify_jwt = false

[functions.get-hover-siding-data]
# Auth + claim-association enforced in-handler (D-211 Phase 16 Unit 2 IDOR fix). Pin false.
verify_jwt = false

[functions.scrape-manufacturer-certs]
# Cron/manual — CRON_SECRET / service-role gate in-handler (D-211 Phase 16 Unit 4). Pin false.
verify_jwt = false

[functions.validate-contract-template]
# Auth + ownership/admin-role enforced in-handler (D-211 Phase 16 Unit 4). Pin false.
verify_jwt = false

[functions.rescind-bid]
# Auth enforced at gateway + in-handler (verified JWT + contractor ownership; D-211 Phase 16 Unit 3).
verify_jwt = true

