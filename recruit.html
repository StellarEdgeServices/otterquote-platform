<script>
  Sentry.onLoad(function() {
    Sentry.init({
      environment: window.location.hostname.includes("staging") ? "staging" : "production",
      // gh-439: drop phantom events from non-http(s) preview contexts (data:/file:/blob:
      // URLs -- e.g. Claude's HTML preview renders pages via data: URIs; relative scripts
      // like js/auth.js then fail and report noise such as "Auth is not defined").
      denyUrls: [/^data:/, /^file:/, /^blob:/, /data:text\/html/],
      beforeSend: function (event) {
        var proto = window.location.protocol;
        if (proto !== "http:" && proto !== "https:") return null;
        var req = event.request && event.request.url;
        if (req && /^(data|file|blob):/.test(req)) return null;
        return event;
      }
    });
  });
</script>

<script>
/**
 * recruit.html &mdash; Recruit Link Router
 *
 * Flow:
 *  1. Read ?code= from URL (format: r-XXXXXX)
 *  2. Store the code in localStorage as cs_recruit_code so the downstream
 *     partner signup page can pick it up after redirect.
 *  3. Look up the recruiter in referral_agents by recruit_code to pick a
 *     sensible LANDING PAGE for this recruit (recruiter's type is a
 *     reasonable proxy &mdash; a real-estate agent tends to recruit other RE
 *     agents, etc.). This only pre-selects that page's default; it is not
 *     the value written to the database (see gh-865 below).
 *  4. Redirect &mdash; or, if the recruiter can't be resolved at all (no code,
 *     unknown code, or a lookup error), show an explicit type-chooser
 *     instead of guessing.
 *
 * gh-865: this router used to fall back to partner-inspectors.html
 * (DEFAULT_DESTINATION) whenever the code was missing or the lookup failed,
 * which silently and permanently mis-typed every one of those visitors as
 * home_inspector on signup. It also routed a legitimate cross-recruit (e.g.
 * an inspector recruiting a realtor) to the recruiter's own signup page,
 * which had the same effect. Two changes fix this:
 *   1. There is no more silent default here &mdash; an unresolved recruiter
 *      gets an explicit "What kind of partner are you?" chooser.
 *   2. Recruiter type is now ONLY a landing-page hint. Every signup page
 *      (partner-re / partner-insurance / partner-inspectors / partner-
 *      adjusters / partner-other / inspector-landing) makes the visitor
 *      confirm their own type before the account is created, and that
 *      confirmed value &mdash; not the landing page's default &mdash; is what gets
 *      written to referral_agents.agent_type. Recruiter attribution
 *      (recruit_code) and the recruit's own type are fully decoupled.
 */

const DESTINATIONS = {
    home_inspector:  'partner-inspectors.html',
    re_agent:        'partner-re.html',
    insurance_agent: 'partner-insurance.html',
    customer:        'refer-a-friend.html',
    adjuster:        'partner-adjusters.html',
    other:           'partner-other.html',
};

// gh-914 single source (js/agent-types.js): the 5 shared keys read from
// AgentTypes.CHOOSER_LABELS; 'customer' stays local -- its value is a
// full-sentence chooser prompt, not a short label, and has no duplicate
// anywhere else in the system.
const CHOOSER_OPTIONS = [
    ['re_agent',        AgentTypes.CHOOSER_LABELS.re_agent],
    ['insurance_agent', AgentTypes.CHOOSER_LABELS.insurance_agent],
    ['home_inspector',  AgentTypes.CHOOSER_LABELS.home_inspector],
    ['adjuster',        AgentTypes.CHOOSER_LABELS.adjuster],
    ['customer',        "I'm a homeowner &mdash; I was referred for my own project"],
    ['other',           AgentTypes.CHOOSER_LABELS.other],
];

function showChooser(code) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('message').textContent = 'What kind of partner are you?';

    const optionsEl = document.getElementById('chooserOptions');
    CHOOSER_OPTIONS.forEach(([type, label]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chooser-btn';
        btn.innerHTML = label;
        btn.addEventListener('click', () => {
            const destination = DESTINATIONS[type];
            if (typeof gtag === 'function') {
                gtag('event', 'recruit_chooser_selected', {
                    recruit_code: code || null,
                    chosen_type: type,
                    destination: destination
                });
            }
            const qs = code ? `?recruit=${encodeURIComponent(code)}` : '';
            window.location.replace(`/${destination}${qs}`);
        });
        optionsEl.appendChild(btn);
    });

    document.getElementById('chooser').style.display = 'block';
}

async function handleRecruit() {
    try {
        if (typeof initNav === 'function') initNav();
    } catch (_) { /* nav is nice-to-have, never block the redirect */ }

    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || '').trim();

    // No code &mdash; nothing to route on. Ask the visitor explicitly rather
    // than guessing (gh-865 AC1).
    if (!code) {
        showChooser('');
        return;
    }

    // Persist the code so the partner signup page can attribute this recruit.
    try {
        localStorage.setItem('cs_recruit_code', code);
    } catch (_) {
        // localStorage disabled (private browsing / storage quota) &mdash; non-fatal.
        // The signup page will still fall back to the ?recruit= URL param.
    }

    let agentType = null;
    let resolved = false;
    try {
        if (typeof sb !== 'undefined' && sb) {
            const { data: recruiter, error } = await sb
                .rpc('get_referral_agents_public')
                .select('agent_type, status')
                .eq('recruit_code', code)
                .eq('status', 'active')
                .maybeSingle();

            if (error) {
                console.warn('Recruit lookup failed:', error.message);
            } else if (recruiter) {
                agentType = recruiter.agent_type;
                resolved = !!DESTINATIONS[agentType];
            }
        } else {
            console.warn('Supabase client not initialized &mdash; skipping recruit lookup');
        }
    } catch (err) {
        console.warn('Recruit lookup threw:', err);
    }

    // Unknown code, inactive recruiter, RPC error, or an agent_type we don't
    // have a landing page for &mdash; ask explicitly rather than guessing
    // (gh-865 AC1). The code is still attributed via cs_recruit_code /
    // ?recruit= for whichever type the visitor picks.
    if (!resolved) {
        if (typeof gtag === 'function') {
            gtag('event', 'recruit_lookup_unresolved', {
                recruit_code: code,
                recruiter_type: agentType || 'unknown'
            });
        }
        showChooser(code);
        return;
    }

    // ── 2026-08-25, Dustin-directed ────────────────────────────────────────
    // This used to redirect to DESTINATIONS[agentType] — the RECRUITER's own
    // profession page. Reported symptom: "It seems like my partner link takes
    // me to the home inspector partner page." Correct, and wrong: Dustin is a
    // home_inspector, so every professional he recruited — insurance agents,
    // realtors, adjusters — landed on partner-inspectors.html and had to
    // work out that the page was not about them.
    //
    // The recruiter's type was never evidence of the RECRUIT's type. gh-865
    // already established that the two are "fully decoupled" and made the
    // UNRESOLVED path show an explicit chooser; the resolved path kept
    // guessing anyway, which is the harder bug to see because it looks like
    // it is working.
    //
    // Now every resolved recruit lands on partners.html — the profession
    // gate — and picks their own world.
    //
    // Attribution is NOT lost by adding this hop, which was Dustin's
    // question. Three independent carriers survive it:
    //   1. cs_recruit_code in localStorage, written above before any redirect;
    //   2. ?recruit= on this redirect, which partners.html reads
    //      (`params.get('recruit') || params.get('code')`) and forwards to
    //      the profession page it sends the visitor on to;
    //   3. that same value written to referral_agents.recruit_code at signup.
    // Verified against partners.html's own query-param handling and its
    // recruit_code pass-through, not assumed.
    const destination = 'partners.html';

    // Track recruit link usage
    gtag('event', 'recruit_link_used', {
      recruit_code: code,
      recruiter_type: agentType || 'unknown',
      destination: destination
    });

    // Pass ?recruit= through as a fallback in case localStorage was blocked.
    window.location.replace(`/${destination}?recruit=${encodeURIComponent(code)}`);
}

document.addEventListener('DOMContentLoaded', handleRecruit);
</script>

</body>
