<!DOCTYPE html>
<html lang="en">
<head>
<!-- Sentry Error Monitoring -->
<script
  src="https://js.sentry-cdn.com/49b5839b50adc240398d822c46d4a86e.min.js"
  crossorigin="anonymous"
></script>
<script>
  Sentry.onLoad(function() {
    Sentry.init({
      environment: window.location.hostname.includes("staging") ? "staging" : "production",
      // gh-439: drop phantom events from non-http(s) preview contexts (data:/file:/blob:
      // URLs -- e.g. Claude's HTML preview renders pages via data: URIs; relative scripts
      // like js/auth.js then fail and report noise such as "Auth is not defined").
      denyUrls: [/^data:/, /^file:/, /^blob:/, /data:text\/html/],
      beforeSend: function (event) {
        var proto = window.location.protocol;
        if (proto !== "http:" && proto !== "https:") return null;
        var req = event.request && event.request.url;
        if (req && /^(data|file|blob):/.test(req)) return null;
        return event;
      }
    });
  });
</script>
<!-- GA4 — fires auth_success engagement event before redirect so sessions aren't counted as bounces -->
<script src="/js/ga-gate.js"></script>
<script>gtag('config','G-D1Y1TLGEFY');</script>
<!-- Microsoft Clarity -->
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "wwr7qlk8g5");
</script>
<!-- D-208: Capture auth tokens before Supabase createClient() clears the URL -->
<script>window._oq_has_auth_in_url = window.location.hash.includes('access_token') || window.location.search.includes('code=');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/img/brand-assets/favicon.png">
<title>Signing In &mdash; Otter Quotes</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/cookie-storage.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Rubik', sans-serif;
    background: #f8f9fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #1a1a2e;
  }
  .callback-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 48px 40px;
    text-align: center;
    max-width: 420px;
    width: 90%;
  }
  .otter-logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 24px;
    display: block;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #e2e8f0;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 1.375rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #1a1a2e;
  }
  .subtitle {
    font-size: 0.9375rem;
    color: #64748b;
    line-height: 1.5;
  }
  .error-state { display: none; }
  .error-state .error-icon {
    font-size: 2.5rem;
    margin-bottom: 16px;
  }
  .error-state h1 { color: #dc2626; }
  .error-state .subtitle { margin-bottom: 24px; }
  .btn-retry {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
  }
  .btn-retry:hover { background: #1d4ed8; }
</style>
</head>
<body>

<div class="callback-card" id="loading-state">
  <img src="/img/otter-logo.svg" alt="Otter Quotes" class="otter-logo" onerror="this.style.display='none'">
  <div class="spinner"></div>
  <h1>Signing you in&hellip;</h1>
  <p class="subtitle">Just a moment while we verify your session.</p>
</div>

<div class="callback-card error-state" id="error-state">
  <div class="error-icon">🔒</div>
  <h1>Sign-in failed</h1>
  <p class="subtitle">Your sign-in link may have expired or already been used. Please request a new one.</p>
  <a class='btn-retry' href='/get-started'>Try again</a>
</div>

<script>
(function () {
  'use strict';

  var handled = false;

  function showError() {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
  }

  function _oqLog() {
    // Diagnostic logging for the auth flow — visible in DevTools console
    // and in Sentry breadcrumbs. Safe to keep in production: zero-cost
    // when nobody is debugging.
    try {
      var args = Array.prototype.slice.call(arguments);
      args.unshift('[auth-callback]');
      console.log.apply(console, args);
    } catch (e) {}
  }

  // Fire a GA4 engagement event before every redirect so the auth-callback
  // session is never counted as a bounce (GA4 requires at least one engagement
  // event within 10 s; the redirect fires faster than that without this).
  function _oqTrackAuth(role, destination) {
    try {
      if (typeof gtag === 'function') {
        gtag('event', 'auth_success', {
          auth_role: role || 'unknown',
          auth_destination: destination
        });
      }
    } catch (e) {}
  }

  function _oqGetIntent() {
    // URL query param wins (survives OAuth round-trip without storage).
    // localStorage is a backup for older callers that haven't been updated.
    try {
      var urlIntent = new URLSearchParams(window.location.search).get('intent');
      if (urlIntent === 'contractor' || urlIntent === 'homeowner') {
        _oqLog('intent from URL:', urlIntent);
        return urlIntent;
      }
    } catch (e) {}
    var ls = localStorage.getItem('cs_auth_role');
    _oqLog('intent from localStorage:', ls);
    return ls;
  }

  async function handle(session) {
    if (handled) return;
    handled = true;

    _oqLog('handle() called, session?', !!session, 'url:', window.location.href);

    if (!session) {
      _oqLog('no session — showing error');
      showError();
      return;
    }

    var intent = _oqGetIntent();

    var role = null;
    try { role = await Auth.getRole(); } catch (e) { role = null; }
    _oqLog('role from DB:', role, 'intent:', intent, 'user.id:', session.user && session.user.id);

    // gh-817/#643 P0: honor the surface the user signed in from. partner-login.html
    // (and future partner persona pages) sets cs_auth_role to a partnerRoles value
    // before sending the magic link — a stronger signal than getRole()'s
    // contractor-first precedence, which otherwise sends a dual-role account
    // (contractor + referral_agents, e.g. dustinstohler1@gmail.com) to
    // /contractor-dashboard.html even when the user explicitly started from the
    // partner login page. This must run before the role==='contractor' check below.
    var partnerRoles = ['re_agent', 'insurance_agent', 'home_inspector', 'adjuster', 'other'];
    if (partnerRoles.indexOf(intent) !== -1) {
      _oqLog('routing -> /partner-dashboard.html (intent says partner surface)');
      _oqTrackAuth(role || 'partner', '/partner-dashboard.html');
      window.location.href = '/partner-dashboard.html';
      return;
    }

    // gh-1476: honor admin identity before the contractor-first branch below.
    // The platform's one admin account (dustinstohler1@gmail.com) also carries
    // a leftover is_test=true contractor row ("Stohler Roofing, LLC"), so
    // role === 'contractor' is true for it too -- same "a second identity
    // outranks getRole()'s contractor-first precedence" shape as the
    // partnerRoles early-exit just above (gh-817/#643), keyed off admin
    // identity instead of signed-in-surface intent. Uses Auth._getIsAdmin(),
    // the existing shared admin check in js/auth.js (same primitive
    // admin-dashboard.html's checkAdminAndInit() and Auth.ready() already use)
    // rather than hardcoding a third copy of the admin email here.
    var isAdmin = false;
    try { isAdmin = await Auth._getIsAdmin(session.user); } catch (e) { isAdmin = false; }
    if (isAdmin) {
      _oqLog('routing -> /admin-dashboard.html (admin identity overrides contractor-first)');
      _oqTrackAuth('admin', '/admin-dashboard.html');
      window.location.href = '/admin-dashboard.html';
      return;
    }

    // Hard signal: a contractor record exists. That's the source of truth —
    // even if the user clicked the wrong login button, route them home.
    if (role === 'contractor') {
      _oqLog('routing -> /contractor-dashboard.html (DB says contractor)');
      _oqTrackAuth('contractor', '/contractor-dashboard.html');
      window.location.href = '/contractor-dashboard.html';
      return;
    }

    // User clicked Sign In on the contractor page (intent = contractor)
    // but no contractor record exists. Don't drop them into the homeowner
    // dashboard — that's how the contractor->homeowner-dashboard loop
    // started. Route them to the join page so they can apply.
    if (intent === 'contractor') {
      // D-225 fix May 13: route to /contractor-pre-approval.html, not back to
      // contractor-join.html. The pre-approval page reads cs_contractor_signup
      // from localStorage and creates the contractors row, then drops into the
      // onboarding wizard. Bouncing back to contractor-join was the magic-link
      // bounce loop ("create account, get link, back to start, repeat").
      _oqLog('routing -> /contractor-pre-approval.html (intent=contractor, no record yet)');
      localStorage.removeItem('cs_auth_role');
      _oqTrackAuth('contractor_new', '/contractor-pre-approval.html');
      window.location.href = '/contractor-pre-approval.html';
      return;
    }

    // Homeowner path — preferred when role or intent says homeowner.
    if (role === 'homeowner' || intent === 'homeowner') {
      // Returning homeowner with a claim -> dashboard. New homeowner -> intake.
      try {
        var u = session.user;
        if (u && typeof sb !== 'undefined') {
          var claimRes = await sb
            .from('claims')
            .select('id')
            .eq('user_id', u.id)
            .order('created_at', { ascending: false })
            .limit(1)
            .maybeSingle();
          _oqLog('claim lookup:', claimRes && claimRes.data ? 'has claim' : 'no claim',
                 'error:', claimRes && claimRes.error && claimRes.error.message);
          if (claimRes && claimRes.data) {
            _oqLog('routing -> /dashboard.html');
            _oqTrackAuth('homeowner', '/dashboard.html');
            window.location.href = '/dashboard.html';
            return;
          }
        }
      } catch (e) {
        _oqLog('claim check threw:', e && e.message);
      }
      _oqLog('routing -> /trade-selector.html (homeowner, no claim)');
      _oqTrackAuth('homeowner_new', '/trade-selector.html');
      window.location.href = '/trade-selector.html';
      return;
    }

    // Brand new user, no signal at all — start the homeowner intake.
    _oqLog('routing -> /trade-selector.html (no signal at all, default)');
    _oqTrackAuth('unknown_new', '/trade-selector.html');
    window.location.href = '/trade-selector.html';
  }

  // D-208 F-007d pattern: wait for PKCE exchange if code is in URL
  if (!sb) {
    showError();
    return;
  }
  sb.auth.onAuthStateChange(async function(event, session) {
    if (event === 'SIGNED_IN' && session) {
      await handle(session);
    } else if (event === 'INITIAL_SESSION') {
      if (session) {
        await handle(session);
      } else if (!window._oq_has_auth_in_url) {
        // No auth tokens in URL and no existing session — something went wrong
        await handle(null);
      }
      // else: _oq_has_auth_in_url is true, PKCE exchange in progress — wait for SIGNED_IN
    }
  });

  // Safety timeout: 30 seconds
  setTimeout(function() {
    if (!handled) {
      handle(null);
    }
  }, 30000);

})();
</script>

</body>
</html>
