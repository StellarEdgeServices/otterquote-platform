<!-- Sentry Error Monitoring -->
<!-- gh-2010: predeclare sentryOnLoad before the loader tag; the loader invokes it once the SDK is ready. -->
<!-- gh-2063 (Ben, comment 5767975097, CEO RUN 57): Sentry's loader script
     was requested via a synchronous <script src> tag, so its fetch+parse
     cost landed at parse time on every visit. Loaded lazily instead, same
     idle-or-first-interaction pattern js/ga-gate.js's and
     js/meta-pixel-gate.js's own _oqLoadOnIdleOrInteraction already use for
     gtag.js/fbevents.js (idle, capped at 1500ms via requestIdleCallback's
     own timeout, or the visitor's first pointerdown/keydown/scroll/
     touchstart, whichever comes first) -- this file keeps its own copy
     below since no js/*.js include has run yet at this point in <head>.
     No error is lost to the delay: window's error/unhandledrejection
     listeners below push every pre-load error into window._oqErrorBuffer,
     and sentryOnLoad() replays that buffer into Sentry.captureException /
     captureMessage the instant Sentry.init() returns, before clearing it. -->
<script>
  window._oqErrorBuffer = [];
  window._oqBufferError = function (e) {
    window._oqErrorBuffer.push({ type: 'error', error: e.error, message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno });
  };
  window._oqBufferRejection = function (e) {
    window._oqErrorBuffer.push({ type: 'unhandledrejection', reason: e.reason });
  };
  window.addEventListener('error', window._oqBufferError);
  window.addEventListener('unhandledrejection', window._oqBufferRejection);

  window.sentryOnLoad = function () {
    Sentry.init({
      environment: window.location.hostname.includes("staging") ? "staging" : "production",
      // gh-439: drop phantom events from non-http(s) preview contexts (data:/file:/blob:
      // URLs -- e.g. Claude's HTML preview renders pages via data: URIs; relative scripts
      // like js/auth.js then fail and report noise such as "Auth is not defined").
      denyUrls: [/^data:/, /^file:/, /^blob:/, /data:text\/html/],
      beforeSend: function (event) {
        var proto = window.location.protocol;
        if (proto !== "http:" && proto !== "https:") return null;
        var req = event.request && event.request.url;
        if (req && /^(data|file|blob):/.test(req)) return null;
        return event;
      }
    });
    // gh-2063: replay every error buffered before Sentry finished loading.
    var buffered = window._oqErrorBuffer || [];
    for (var i = 0; i < buffered.length; i++) {
      var item = buffered[i];
      try {
        if (item.type === 'error' && item.error) {
          Sentry.captureException(item.error);
        } else if (item.type === 'error') {
          Sentry.captureMessage(item.message || 'Unknown error (buffered pre-Sentry-load)');
        } else if (item.type === 'unhandledrejection') {
          if (item.reason instanceof Error) {
            Sentry.captureException(item.reason);
          } else {
            Sentry.captureMessage('Unhandled rejection (buffered pre-Sentry-load): ' + String(item.reason));
          }
        }
      } catch (replayErr) { /* replaying a buffered error must never itself throw */ }
    }
    window._oqErrorBuffer = [];
  };

  // gh-2063: local copy of js/ga-gate.js's _oqLoadOnIdleOrInteraction,
  // scoped to loading the Sentry loader script only.
  (function () {
    var fired = false;
    var idleHandle = null;
    var timeoutHandle = null;
    var EVENTS = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
    function teardown() {
      for (var i = 0; i < EVENTS.length; i++) {
        window.removeEventListener(EVENTS[i], run);
      }
      if (idleHandle !== null && window.cancelIdleCallback) { window.cancelIdleCallback(idleHandle); }
      if (timeoutHandle !== null) { clearTimeout(timeoutHandle); }
    }
    function loadSentryLoader() {
      var s = document.createElement('script');
      s.src = 'https://js.sentry-cdn.com/49b5839b50adc240398d822c46d4a86e.min.js';
      s.crossOrigin = 'anonymous';
      s.onload = function () {
        // the loader's own listeners own capture from here on (no double-report)
        window.removeEventListener('error', window._oqBufferError);
        window.removeEventListener('unhandledrejection', window._oqBufferRejection);
        // lazy loader: sentryOnLoad (and the replay) only runs once the SDK loads
        if (window._oqErrorBuffer.length && window.Sentry && typeof window.Sentry.forceLoad === 'function') {
          window.Sentry.forceLoad();
        }
      };
      document.head.appendChild(s);
    }
    function run() {
      if (fired) return;
      fired = true;
      teardown();
      loadSentryLoader();
    }
    for (var i = 0; i < EVENTS.length; i++) {
      window.addEventListener(EVENTS[i], run, { passive: true, once: true });
    }
    if (window.requestIdleCallback) {
      idleHandle = window.requestIdleCallback(run, { timeout: 1500 });
    } else {
      timeoutHandle = setTimeout(run, 1500);
    }
  })();
</script>

<!-- gh-2033: /start assigns the A/B/C variant itself, and must do it BEFORE
     any analytics call that can carry `variant` -- js/ga-gate.js's own
     gtag('js', ...) call and its Clarity vendor snippet are both downstream
     of this tag, so this has to load first or an early GA4/Clarity hit is
     unattributable for good (GA4's variant/step custom dimensions are not
     retroactive). Precedence: an explicit, validated ?v= in the URL wins;
     else a persisted per-visitor assignment (localStorage, cookie
     fallback); else uniform-random across the live set (gh-2074:
     LIVE_VARIANTS below -- today just 'c'; a syntactically-valid but
     non-live arm from ANY of those sources, e.g. a persisted 'a'/'b', is
     re-mapped to a live arm on arrival, never served/blanked/404'd).
     Persists the result to BOTH localStorage and a first-party cookie
     (oq_variant_v1, versioned so a future re-randomisation is a key bump)
     and rewrites the URL via
     history.replaceState -- never pushState -- preserving every existing
     query parameter (UTMs above all). Every storage/URL touch is its own
     try/catch: 39% of this traffic is the Facebook in-app webview, where
     localStorage access throws, and one throwing step must never break the
     page or block the others. window.__oqVariant is set before the
     replaceState call so the main IIFE further down this file (see its
     gh-2014/gh-2033 variant read) still has a source if replaceState itself
     throws. Deliberately uses /^[abc]$/.test() everywhere, never an
     object-literal lookup ({a:1,b:1,c:1}[raw]) -- that walks the prototype
     chain and lets ?v=constructor / ?v=__proto__ through (see the
     gh-2014 fix round 4 comment on the main IIFE's own variant read). -->
<script>
(function () {
  // gh-2075 (D-327) round 2, review report ceo57-review-pr2086-20260921
  // finding 1 (blocking, real-browser evidence: a visitor carrying a
  // pre-flip key persisted 'c' was served 'c' in 4/4 loads after a
  // standalone key bump): a key bump on ITS OWN, ahead of the
  // LIVE_VARIANTS flip, does NOT decouple anything -- every visitor who
  // reaches /start between THIS merge and the flip gets re-persisted 'c'
  // under the new key (since LIVE_VARIANTS is still ['c'] the moment they
  // land), and stays sticky to 'c' after the flip for the same reason
  // isLive('c') is a no-op that this file's own LIVE_VARIANTS comment
  // below already documents -- round 1 of this fix produced exactly the
  // 80/10/10 skew it claimed to prevent. KEY stays 'oq_variant_v1' here;
  // see LIVE_VARIANTS below for the single block the orchestrator edits
  // -- the key bump and the live-set flip are ONE change, not two.
  var KEY = 'oq_variant_v2'; // D-327 flip 1/2 (2026-09-22): D live

  // gh-2074 fix round 2 (PR #2079 review, item 2): KNOWN_ARMS is the
  // single source of truth for which arm letters are syntactically
  // recognised at all -- NOT which ones are currently served (see
  // LIVE_VARIANTS below for that). It already lists 'd'/'e' so shipping
  // gh-2075/gh-2076 never needs a second change here: a persisted or
  // ?v=-carried d/e always PARSES, even while LIVE_VARIANTS still keeps
  // them unreachable. Exposed as window.__oqKnownArms so the main IIFE's
  // own variant read further down this file (gh-2014/gh-2033 -- a
  // SEPARATE <script> block/closure) derives its allowlist from this
  // same list instead of a second hardcoded regex that can silently
  // drift out of sync: review caught exactly that on the first pass of
  // this fix -- an unsynced /^[abc]$/ there would read a live 'd'
  // session back as variant=null and silently render arm A, the one arm
  // this issue exists to eliminate.
  var KNOWN_ARMS = ['a', 'b', 'c', 'd', 'e'];
  window.__oqKnownArms = KNOWN_ARMS;
  var ARM_RE = new RegExp('^(' + KNOWN_ARMS.join('|') + ')$');

  // gh-2074: the LIVE set. Today only 'c' -- a and b lose 90%+ of visitors
  // at the first screen (GA4 router_step_view 7d: a 120->12, b 87->13,
  // c 59->9). Arm a/b's code stays in this file, unreachable, for d/e to
  // reuse -- nothing here is deleted.
  //
  // gh-2074 fix round 2 (PR #2079 review, item 3): flipping this constant
  // to ['c', 'd', 'e'] when d/e ship is NOT "the whole switch" and does
  // NOT give equal weights by itself -- the original comment here was
  // wrong. Every visitor assigned 'c' during this single-arm period is
  // persisted (KEY above, 180-day max-age -- see the gh-2033 comment
  // block near the top of this file) and stays sticky to 'c' on return:
  // isLive('c') is already true, so toLiveArm() is a no-op for every one
  // of those returning sessions regardless of what this constant says
  // later. Flipping it alone would therefore land roughly 80% of traffic
  // on 'c' (every persisted single-arm-period visitor, plus 1/3 of
  // brand-new ones) versus ~10% each for d/e -- not the even split
  // "equal weights" implies. Shipping d/e as a real three-way test
  // REQUIRES bumping KEY too (e.g. 'oq_variant_v2') alongside this flip,
  // so every visitor -- persisted or not -- re-randomises across the new
  // live set. Flip this constant WITHOUT the key bump only if a
  // deliberately c-weighted d/e rollout is the actual intent.
  // ══════════════════ D-327 ORCHESTRATOR FLIP BLOCK ══════════════════
  // Do NOT flip LIVE_VARIANTS without ALSO bumping KEY (above) in the
  // SAME deploy -- they are one change, not two (round-2 review finding
  // 1 on PR #2086: bumping the key early, alone, does nothing but stamp
  // every pre-flip visitor 'c' under the new key, which then persists
  // for 180 days regardless of what this constant says later). When
  // #2075 merges, in ONE commit:
  //   1. KEY becomes 'oq_variant_v2'            (start.html, above)
  //   2. LIVE_VARIANTS becomes ['c','d']          (this line)
  // and when #2076 (arm e) merges, bump again together:
  //   1. KEY becomes 'oq_variant_v3'
  //   2. LIVE_VARIANTS becomes ['c','d','e']
  // This PR (gh-2075) intentionally leaves BOTH constants unflipped, per
  // #2075's own instruction ("the PR must not change live assignment").
  // Until the flip, arm d's code below is shipped but unreachable:
  // toLiveArm() (below) remaps any non-live arm -- including an explicit
  // ?v=d -- onto the live set, so ?v=d does NOT render arm d pre-flip.
  // tests/gh2033-variant-assignment.mjs reads BOTH constants out of this
  // file itself (never a hardcoded copy) -- the flip above is genuinely
  // the only edit needed; that test needs none.
  // ═════════════════════════════════════════════════════════════════
  var LIVE_VARIANTS = ['c','d']; // D-327 flip 2/2 (2026-09-22): Variant D live beside C; E follows as v3

  // gh-2074 fix round 2 (PR #2079 review, item 4): guards a misconfigured
  // empty LIVE_VARIANTS from indexing an empty array and writing a
  // literal "v=undefined" into the URL, both stores, and every
  // downstream analytics/lead write -- falls back to SAFE_DEFAULT_ARM.
  var SAFE_DEFAULT_ARM = 'c';
  function effectiveLiveVariants() {
    return (LIVE_VARIANTS && LIVE_VARIANTS.length) ? LIVE_VARIANTS : [SAFE_DEFAULT_ARM];
  }

  function validArm(v) {
    var s = String(v == null ? '' : v).toLowerCase();
    return ARM_RE.test(s) ? s : null;
  }

  // gh-2074: is this (syntactically valid) arm one we're currently serving?
  function isLive(arm) {
    var live = effectiveLiveVariants();
    for (var i = 0; i < live.length; i++) {
      if (live[i] === arm) return true;
    }
    return false;
  }

  // gh-2074: map any syntactically-valid arm onto a live one -- a no-op for
  // an already-live arm, otherwise a uniform-random re-assignment across
  // the live set. Applied to every source below (URL, localStorage,
  // cookie, random) so a/b (or any non-live arm) can never reach
  // rendering.
  //
  // gh-2074 fix round 2 (PR #2079 review, item 1 BLOCKER): exposed as
  // window.__oqToLiveArm so the main IIFE's own variant read further
  // down this file -- a separate <script> block, so it does NOT share
  // this closure -- can apply this identical mapping to its own URL
  // fallback path, instead of trusting a stale, pre-mapped ?v= that this
  // script's own history.replaceState call (below) failed to rewrite
  // because it threw (sandboxed iframes without allow-same-origin,
  // Safari's history-mutation rate limit -- both real /start traffic).
  function toLiveArm(arm) {
    if (isLive(arm)) return arm;
    var live = effectiveLiveVariants();
    return live[Math.floor(Math.random() * live.length)];
  }
  window.__oqToLiveArm = toLiveArm;
  window.__oqLiveVariants = effectiveLiveVariants();

  function readCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  // 1. Explicit ?v= wins over anything persisted -- re-mapped to a live arm
  //    if it names a or b (gh-2074: do not 404, do not blank).
  var urlArm = null;
  try {
    urlArm = validArm(new URLSearchParams(window.location.search).get('v'));
  } catch (e) {}
  // gh-2076 (D-327) QA override: an explicit ?v=e&oq_internal=1 renders
  // that arm directly, bypassing toLiveArm()'s live-set remap, WITHOUT
  // touching LIVE_VARIANTS/KEY above and WITHOUT changing what a normal
  // visitor (no oq_internal param) ever sees -- #2076's own instruction
  // that arm e must be reachable for manual/automated QA before the flip,
  // the way arm d could not be (see PR #2086's own documented
  // contradiction: an explicit ?v=d did NOT render arm d pre-flip,
  // because toLiveArm() remaps every non-live arm unconditionally). Step
  // 4 below still persists whatever `arm` ends up being to both stores,
  // but that is harmless here: step 2's own read of a persisted arm on
  // any LATER, non-oq_internal load still runs it through toLiveArm()
  // unconditionally, so a stray persisted 'e' cannot leak into a normal
  // visitor's assignment once this override is not present on the URL.
  var oqInternalOverride = false;
  try { oqInternalOverride = new URLSearchParams(window.location.search).get('oq_internal') === '1'; } catch (e) {}
  var arm = urlArm ? (oqInternalOverride ? urlArm : toLiveArm(urlArm)) : null;

  // 2. Else a persisted assignment -- localStorage first, cookie fallback,
  //    each in its own try/catch so a throw on one still lets the other run.
  //    Also re-mapped to a live arm (gh-2074): a stale persisted a/b is
  //    reassigned here, and step 4 below overwrites both stores with the
  //    reassigned value rather than leaving the stale one in place.
  if (!arm) {
    var fromStorage = null;
    try { fromStorage = validArm(window.localStorage.getItem(KEY)); } catch (e) {}
    var fromCookie = null;
    if (!fromStorage) {
      try { fromCookie = validArm(readCookie(KEY)); } catch (e) {}
    }
    var persistedArm = fromStorage || fromCookie;
    arm = persistedArm ? toLiveArm(persistedArm) : null;
  }

  // 3. Else assign at random, uniform across the LIVE set only (gh-2074:
  //    never the full a-e set -- LIVE_VARIANTS today is just ['c']).
  //    Uses effectiveLiveVariants() (fix round 2, item 4) so a
  //    misconfigured empty LIVE_VARIANTS falls back to SAFE_DEFAULT_ARM
  //    instead of indexing an empty array.
  if (!arm) {
    var liveForRandom = effectiveLiveVariants();
    arm = liveForRandom[Math.floor(Math.random() * liveForRandom.length)];
  }

  // Expose before replaceState so a downstream throw there still leaves a
  // usable source for the main IIFE's own variant read.
  window.__oqVariant = arm;

  // 4. Persist to BOTH stores, each independently guarded.
  try { window.localStorage.setItem(KEY, arm); } catch (e) {}
  try {
    var secure = window.location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = KEY + '=' + arm + '; path=/; max-age=' + (180 * 24 * 60 * 60) +
      '; SameSite=Lax' + secure;
  } catch (e) {}

  // 5. Rewrite the URL, preserving every existing query parameter.
  try {
    var params = new URLSearchParams(window.location.search);
    params.set('v', arm);
    var newUrl = window.location.pathname + '?' + params.toString() + window.location.hash;
    history.replaceState(history.state, '', newUrl);
  } catch (e) {}
})();
</script>

     Independent review measured the opposite, one change at a time: `defer`

     small same-origin files before it can build the render tree either

     to parsing -- it does not remove them from the critical path the way
     it does for a large third-party bundle. Restored to plain synchronous
     `<script src>` tags, matching main exactly. The actual fix for the
     THIRD-PARTY vendor bundles these files inject (gtag.js, fbevents.js,

     needs to wait for a DOMContentLoaded listener either -- restored to
     main's plain inline call. -->

<script src="/js/meta-pixel-gate.js"></script>

  .router-step h1, #routerCRoot h1, #routerDRoot h1 { font-family: var(--font-heading, var(--font-body)); font-size: 1.5rem; color: var(--white); margin-bottom: var(--sp-2); line-height: 1.25; }
  .router-step p.router-sub, #routerCRoot p.router-sub, #routerDRoot p.router-sub { color: var(--slate); font-size: 0.95rem; margin-bottom: var(--sp-5); }
  .form-group { margin-bottom: var(--sp-4); }
  .form-label { display: block; font-weight: 600; color: var(--white); margin-bottom: var(--sp-1); font-size: 0.95rem; }
  .form-label.required::after { content: ' *'; color: var(--red); }
  /* gh-2042: phone is optional (Dustin, 2026-09-20). Muted, same line as the label. */
  .form-label-optional { font-weight: 400; color: var(--gray-400, #9ca3af); font-size: 0.85em; }
  .form-input { width: 100%; padding: var(--sp-3) var(--sp-4); border: 1px solid rgba(255,255,255,0.14); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 1rem; background: rgba(255,255,255,0.06); color: var(--white); }
  .form-input::placeholder { color: rgba(255,255,255,0.35); }
  .form-input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-glow); }
  .field-error { color: #FCA5A5; font-size: 0.85rem; margin-top: var(--sp-1); min-height: 1.1em; }
  .router-btn { width: 100%; padding: var(--sp-3) var(--sp-6); font-size: 1rem; margin-top: var(--sp-2); }
  .router-error { display: none; background: var(--red-light); color: #7F1D1D; border-radius: var(--radius-md); padding: var(--sp-3); margin-bottom: var(--sp-4); font-size: 0.9rem; }
  .router-error.show { display: block; }
  .role-options { display: flex; flex-direction: column; gap: var(--sp-3); }
  .role-option {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left; cursor: pointer;
    padding: var(--sp-4); border-radius: var(--radius-md);
    border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04);
    color: var(--white); font-family: var(--font-body); font-size: 1.05rem; font-weight: 600;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .role-option:hover, .role-option:focus-visible { border-color: var(--amber); background: rgba(224,123,0,0.08); }
  .role-option .role-arrow { color: var(--amber); font-size: 1.2rem; }
  .router-back { display: inline-flex; align-items: center; gap: var(--sp-1); color: var(--slate); font-size: 0.9rem; background: none; border: none; cursor: pointer; margin-bottom: var(--sp-4); padding: 0; }
  .router-back:hover { color: var(--white); }
  .router-spinner-wrap { text-align: center; padding: var(--sp-10) 0; color: var(--slate); }

  /* gh-2063: on short mobile viewports (e.g. 390x844 in the Facebook
     in-app browser, whose own chrome eats ~100px of that) the step-1 CTA
     must stay above the fold. Tightens vertical spacing only below
     700px tall -- no layout/copy change, same elements, same order. */
  @media (max-height: 700px) {
    main { padding-top: var(--sp-4); padding-bottom: var(--sp-8); }
    .router-card { padding: var(--sp-4); }
    .router-progress { margin-bottom: var(--sp-4); }
    .router-step h1, #routerCRoot h1, #routerDRoot h1 { margin-bottom: var(--sp-1); }
    .router-step p.router-sub, #routerCRoot p.router-sub, #routerDRoot p.router-sub { margin-bottom: var(--sp-3); }
    .form-group { margin-bottom: var(--sp-2); }
  }
</style>
</head>
<body>

<header id="site-header"></header>

<main>
  <div class="router-card">
    <div class="router-progress" id="routerProgress">
      <span id="progressStep1"></span>
      <span id="progressStep2"></span>
      <span id="progressStep3"></span>
    </div>

    <div class="router-error" id="routerError" role="alert"></div>

    <!-- ═══════════ Step 1 — contact info ═══════════ -->
    <section class="router-step active" id="step1" data-step="1">
      <h1>Let's get you started</h1>
      <p class="router-sub">Tell us how to reach you. Takes about 30 seconds.</p>

      <!-- gh-1994 fix round 3 (non-blocking N4): maxlength on each input
           matches the DB-layer CHECK constraints (leads_name_length_check
           /leads_email_length_check/leads_phone_length_check, migration
           20260916132127_gh1994_router_leads_columns.sql) so a visitor who
           pastes an over-length value is stopped by the browser before
           submit rather than hitting a generic "something went wrong"
           error from a server-side constraint violation on insert. -->
      <form id="step1Form" novalidate>
        <div class="form-group">
          <label for="routerName" class="form-label required">Full Name</label>
          <input type="text" id="routerName" name="name" class="form-input" autocomplete="name" placeholder="Jane Smith" required maxlength="200" aria-describedby="routerNameError">
          <div class="field-error" id="routerNameError"></div>
        </div>

        <div class="form-group">
          <label for="routerEmail" class="form-label required">Email</label>
          <input type="email" id="routerEmail" name="email" class="form-input" autocomplete="email" inputmode="email" placeholder="jane@example.com" required maxlength="320" aria-describedby="routerEmailError">
          <div class="field-error" id="routerEmailError"></div>
        </div>

        <div class="form-group">
          <label for="routerPhone" class="form-label">Phone Number <span class="form-label-optional">(optional)</span></label>
          <input type="tel" id="routerPhone" name="phone" class="form-input" autocomplete="tel" inputmode="tel" placeholder="(555) 123-4567" maxlength="20" aria-describedby="routerPhoneError">
          <div class="field-error" id="routerPhoneError"></div>
        </div>

        <button type="submit" id="step1Submit" class="btn btn-primary router-btn">Continue</button>
      </form>
    </section>

    <!-- ═══════════ Step 2 — "I am a" ═══════════ -->
    <section class="router-step" id="step2" data-step="2">
      <button type="button" class="router-back" id="backTo1">&larr; Back</button>
      <h1>I am a&hellip;</h1>
      <div class="role-options">
        <button type="button" class="role-option" data-router-role="homeowner">Homeowner <span class="role-arrow">&rarr;</span></button>
        <button type="button" class="role-option" data-router-role="contractor">Contractor <span class="role-arrow">&rarr;</span></button>
        <button type="button" class="role-option" data-router-role="referral_partner">Referral Partner <span class="role-arrow">&rarr;</span></button>
      </div>
    </section>

    <!-- ═══════════ Step 2a — partner industry ═══════════ -->
    <!-- Industry set is loaded from js/agent-types.js (AgentTypes.CHOOSER_LABELS,
         gh-914 single source for the partner-page industry set) at runtime by
         renderPartnerIndustries() below -- never hand-copied here, per that
         file's own CI check (tools/agent_type_labels_check.py). -->
    <section class="router-step" id="step2a" data-step="2a">
      <button type="button" class="router-back" id="backTo2">&larr; Back</button>
      <h1>What industry are you in?</h1>
      <p class="router-sub">This tells us which partner program fits you.</p>
      <div class="role-options" id="partnerIndustryOptions"></div>
    </section>

    <!-- ═══════════ Step 3 — redirecting ═══════════ -->
    <section class="router-step" id="step3" data-step="3">
      <div class="router-spinner-wrap">
        <p>Taking you to the right place&hellip;</p>
      </div>
    </section>

    <!-- ═══════════ Variant C — discovery engine mount (gh-2017) ═══════════ -->
    <!-- Empty by design: js/router-discovery.js owns all rendering inside
         this element once loaded. Hidden by default so it has zero effect
         on arms A/B; unhidden only inside this file's own variant === 'c'
         branch below, at the same point that branch hides #step1/#step2/
         #step2a/#step3. -->
    <div id="routerCRoot" hidden></div>

    <!-- ═══════════ Variant D — role tap / one email / everything else after
         (gh-2075, D-327) ═══════════ -->
    <!-- Empty by design, same convention as #routerCRoot above:
         js/router-variant-d.js owns all rendering inside this element once
         loaded. Hidden by default (zero effect on every other arm); unhidden
         only inside this file's own variant === 'd' branch, same point that
         branch hides #step1/#step2/#step2a/#step3/#routerProgress. -->
    <div id="routerDRoot" hidden></div>

    <!-- ═══════════ Variant E — role-first, homeowner path led by
         exposition (gh-2076, D-327) ═══════════ -->
    <!-- Empty by design, same convention as #routerCRoot/#routerDRoot
         above: js/router-variant-e.js owns all rendering inside this
         element once loaded. Hidden by default; unhidden only inside
         this file's own variant === 'e' branch, same point that branch
         hides #step1/#step2/#step2a/#step3/#routerProgress. -->
    <div id="routerERoot" hidden></div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/cookie-storage.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/agent-types.js"></script>

<script>
(function () {
  'use strict';

  // gh-1994: this page owns its own Supabase client rather than depending on
  // js/supabase-client.js (not included on most static marketing pages
  // today -- see js/auth.js:1443-1447's own count of "9 of 11" pages that
  // lack it). Pattern below matches contractor-join.html's own working
  // `const sb = supabase.createClient(...)` local-client declaration. (Fix
  // round 3: removed this comment's own stale claim that partner-re.html
  // reads an unbound bare `sb` -- withdrawn back in fix round 1's PR body
  // once `js/config.js` was confirmed to declare `sb` as a page-level
  // global; this file's own copy of that same claim was missed until the
  // fix round 3 REVIEW pass caught it.)
  // gh-2063 (Ben, comment 5767975097): the Supabase UMD script above now
  // loads `defer` so it no longer blocks parsing -- but a deferred script
  // has NOT run yet at the moment this synchronous inline script executes
  // (deferred scripts run after parsing completes, in document order,
  // before DOMContentLoaded), so `typeof supabase` is 'undefined' right
  // here every time, the same way it always is. Round 2 of this issue
  // learned that the hard way: it added `defer` here without this change
  // and left `sb` permanently null. The fix is this lazy accessor --
  // `ensureSb()` creates the client on FIRST USE (step 1's submit
  // handler, well after `defer` has had time to run) and caches it, never
  // at parse time. Every `sb.*` call site below goes through it.
  var sb = null;
  function ensureSb() {
    if (sb) return sb;
    try {
      if (typeof supabase !== 'undefined' && typeof CONFIG !== 'undefined') {
        sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON, {
          auth: { storage: window.OtterQuoteCookieStorage, storageKey: window.OTTERQUOTE_AUTH_STORAGE_KEY || 'sb-otterquote-auth' }
        });
      }
    } catch (e) { /* handled by the null-check on every use below */ }
    return sb;
  }

  // ── Elements ──
  var progressEls = { 1: document.getElementById('progressStep1'), 2: document.getElementById('progressStep2'), 3: document.getElementById('progressStep3') };
  var steps = { 1: document.getElementById('step1'), 2: document.getElementById('step2'), '2a': document.getElementById('step2a'), 3: document.getElementById('step3') };
  var routerError = document.getElementById('routerError');

  function renderStep(key) {
    // gh-2017: arm C's own screen container is what renders for the whole
    // of that session; this function's DOM toggling and view-tracking are
    // for the shared #step1/#step2/#step2a/#step3 sections only, which
    // stay hidden the entire time, including the one indirect path here --
    // redirectTo() below calls renderStep(3), and the module calls
    // redirectTo() by reference per the bridge contract.
    if (ARM_C || ARM_D || ARM_E) return;
    Object.keys(steps).forEach(function (k) { steps[k].classList.toggle('active', k === String(key)); });
    // gh-2016: the 3-segment progress bar is hardcoded to A's screen ORDER,
    // not just its key names -- on arm B, contact (1) is the middle screen
    // and role (2) is the first, so A's derivation reads exactly backwards.
    // Same shape, B's order: first screen 0 done, the two middle screens 1,
    // the redirect 2.
    var doneCount = ARM_B
      ? (key === 2 ? 0 : (key === '2a' || key === 1) ? 1 : 2)
      : (key === 1 ? 0 : (key === 2 || key === '2a') ? 1 : 2);
    // gh-2016: swap in B's delivery-framed contact heading as that screen
    // renders -- it depends on bRole, which is not known at page load.
    if (ARM_B && String(key) === '1') {
      var bHeadingEl = steps[1].querySelector('h1');
      if (bHeadingEl) {
        bHeadingEl.textContent = (bRole === 'homeowner')
          ? B_CONTACT_HEADINGS.homeowner
          : B_CONTACT_HEADINGS.other;
      }
    }
    [1, 2, 3].forEach(function (n) { progressEls[n].classList.toggle('done', n <= doneCount); });
    routerError.classList.remove('show');
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    // gh-2014: fires here (not in goToStep) so a popstate/Back re-render
    // through this same function -- see the ── History: ── block below --
    // counts as a view too, matching back-then-forward funnel semantics.
    trackRouter('router_step_view', { step: stepToken(key) });
  }

  function showError(msg) {
    routerError.textContent = msg;
    routerError.classList.add('show');
  }

  function fieldError(id, msg) {
    var el = document.getElementById(id);
    if (el) el.textContent = msg || '';
    // gh-1994 fix round 1 (REVIEW): keep aria-invalid in sync with the
    // visible error text on the input the error div describes (id minus
    // its "Error" suffix -- routerNameError -> routerName, etc).
    var inputId = id.replace(/Error$/, '');
    var input = document.getElementById(inputId);
    if (input) {
      if (msg) input.setAttribute('aria-invalid', 'true');
      else input.removeAttribute('aria-invalid');
    }
  }

  // ── Attribution: current-URL params first, oq_ft cookie (gh-1983) as
  // fallback for any key the current URL didn't carry (e.g. a visitor who
  // arrived on an earlier tagged page and clicked through to /start.html
  // with a clean URL). Mirrors attribution-core.ts's own sanitising
  // (printable-only, trimmed, length-capped) without importing that TS
  // module into a plain script tag. ──
  var ATTR_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid', 'gclid', 'v'];
  var CLICK_ID_KEYS = { fbclid: true, gclid: true };

  // ── gh-2014: A/B/C front-door variant, read once at page load into a
  // closed-over var. Sanitized against a fixed allowlist BEFORE any use --
  // an unrecognised value becomes null rather than reaching a downstream
  // write, since a future CHECK constraint on leads.variant would turn a
  // bad value into a destroyed lead (anon has INSERT but no UPDATE policy
  // on leads). Variants B/C route entirely client-side through
  // renderStep/goToStep within this one document, so a single page-load
  // read is sufficient for the whole session.
  // gh-2014 fix round 4: deliberately NOT an object-literal lookup
  // (`{a:1,b:1,c:1}[rawVariant]`) -- that walks the prototype chain, so
  // ?v=constructor and ?v=__proto__ both read as truthy own-property-less
  // hits and bypass the allowlist entirely (reproduced: VARIANT_VALUES
  // ={a:1,b:1,c:1}; VARIANT_VALUES['constructor'] and
  // VARIANT_VALUES['__proto__'] are both truthy Object.prototype members).
  // A regex test never consults the prototype chain, so this is not
  // vulnerable to the same class of bypass. ──
  // gh-2074 fix round 2 (PR #2079 review, item 1 BLOCKER): window.__oqVariant
  // -- set by the head-inline assignment script above, already sanitised
  // AND re-mapped to a live arm -- is now read FIRST, not as a fallback.
  // Before this fix the URL's own ?v= was consulted first and
  // window.__oqVariant only when the URL failed the allowlist; that order
  // was correct pre-gh-2074 but became a live split-brain bug once a/b
  // started being re-mapped to a live arm on arrival: the ONLY place that
  // rewrites ?v= to the re-mapped arm is that same head script's
  // history.replaceState call, which is wrapped in a swallowing try/catch
  // and does throw in real /start traffic (sandboxed iframes without
  // allow-same-origin -- ad-platform/CMS landing-page previews and
  // embeds -- plus Safari's history-mutation rate limit). When it throws,
  // the pre-mapped ?v=a/?v=b survives in the URL, and reading the URL
  // first served arm a/b anyway with the correct, already-live
  // window.__oqVariant sitting right there unused -- GA4/Clarity tagged
  // variant=a/b and leads.variant written a/b, while both persisted
  // stores already said 'c'. The URL is read here only as a fallback for
  // the case window.__oqVariant is itself unset (the head script threw
  // before reaching that assignment) -- and even then it is run through
  // window.__oqToLiveArm, the SAME live-mapping function the head script
  // itself uses, so a/b still cannot win from this path either.
  //
  // gh-2074 fix round 2 (PR #2079 review, item 2): the allowlist is no
  // longer a second hardcoded /^[abc]$/ -- it is built from
  // window.__oqKnownArms, the same KNOWN_ARMS constant the head script
  // uses (falling back to a local literal only if that script somehow
  // never ran). KNOWN_ARMS already includes 'd'/'e', so this read stays
  // correct across the gh-2075/gh-2076 ship without a second edit here.
  // Still a regex test, never an object-literal lookup, for the same
  // prototype-chain-bypass reason as the fix-round-4 comment above.
  var KNOWN_ARMS = window.__oqKnownArms || ['a', 'b', 'c', 'd', 'e'];
  var KNOWN_ARM_RE = new RegExp('^(' + KNOWN_ARMS.join('|') + ')$');
  var oqVariantArm = KNOWN_ARM_RE.test(String(window.__oqVariant || ''))
    ? String(window.__oqVariant)
    : null;
  var rawVariant = (new URLSearchParams(window.location.search).get('v') || '').toLowerCase();
  var toLiveArmFallback = window.__oqToLiveArm || function (a) { return a; };
  var urlFallbackArm = (!oqVariantArm && KNOWN_ARM_RE.test(rawVariant))
    ? toLiveArmFallback(rawVariant)
    : null;
  var variant = oqVariantArm || urlFallbackArm;
  // gh-2014: js/ga-gate.js's CLARITY_ALLOWED_PATHS now carries '/start', so
  // this call is live rather than a no-op against a closed gate. Guarded on
  // both a recognised variant and window.clarity actually having loaded
  // (Clarity is still behind its own host/consent gate upstream of the
  // path allowlist).
  // gh-2063 fix round 2 (PR #2065 review, blocker 3): this used to run here,
  // at parse time, while the page's <script defer src="js/ga-gate.js"> --
  // the only place window.clarity is created -- had not executed yet.
  // window.clarity was always undefined at this point once ga-gate.js
  // stopped being a synchronous head script, so the guard above was always
  // false and the call silently never ran: every session on every /start
  // variant recorded in Clarity with no 'variant' tag. Deferred scripts run
  // in document order, strictly before DOMContentLoaded fires, so moving
  // this call into a DOMContentLoaded listener guarantees ga-gate.js (and
  // therefore window.clarity, when the host/path gates allow it) has
  // already run by the time this fires -- with no change to the guard logic
  // or to what gets sent.
  document.addEventListener('DOMContentLoaded', function () {
    try { if (variant && window.clarity) { clarity('set', 'variant', variant); } } catch (e) {}
  });

  // ── gh-2016: arm B (contact-last). B asks #2011's IDENTICAL questions in
  // inverted order -- role, then industry if referral_partner, then
  // name/email/phone on the LAST screen, framed as delivery. It is a
  // REORDER of this same file's four screens, not a second page and not a
  // second set of components: B renders the very same #step2 / #step2a /
  // #step1 / #step3 sections A does, in a different sequence. That is
  // deliberate -- this file's three "fix round" comment blocks record
  // hard-won fixes (the double-submit guards, the pageshow/e.persisted
  // bfcache reset, the stale-lead fallback) that a forked copy would drift
  // away from on the next one. ──
  var ARM_B = variant === 'b';

  // gh-2017: arm C (the Sandler discovery engine) does not reuse this
  // file's steps/renderStep/trackStepComplete machinery at all --
  // js/router-discovery.js owns its own ordered-array sequencer and its
  // own rendering, reached through the bridge assembled near the end of
  // this IIFE. ARM_C exists so the few machinery functions this file still
  // runs on every variant unconditionally -- the load-time view emission
  // below, renderStep(), trackStepComplete() -- can no-op instead of
  // emitting an arm-A-shaped event or showing an arm-A section on top of
  // arm C's own screen. redirectTo() (below) is called BY the module
  // itself, so its two calls into the now-guarded functions matter here.
  var ARM_C = variant === 'c';

  // gh-2075 (D-327): arm D (role tap first, one email field, everything
  // else after). Same reasoning as ARM_C immediately above -- js/router-
  // variant-d.js owns its own sequencer/rendering entirely, reached
  // through its own bridge assembled near the end of this IIFE. Also
  // unreachable pre-flip: LIVE_VARIANTS above is still ['c'], and
  // toLiveArm() remaps any non-live arm before `variant` is ever set, so
  // `variant === 'd'` cannot be true today -- this flag and the file it
  // gates ship dormant, exactly like arm A/B's own code already does.
  var ARM_D = variant === 'd';

  // gh-2076 (D-327): arm E (role-first, arm C's own screens, with the
  // homeowner path led by exposition -- see js/router-variant-e.js's own
  // top-of-file comment). Same reasoning as ARM_C/ARM_D immediately
  // above -- js/router-variant-e.js owns its own sequencer/rendering
  // entirely, reached through its own bridge assembled near the end of
  // this IIFE. Unreachable pre-flip the same way ARM_D is, EXCEPT
  // through the ?v=e&oq_internal=1 QA override this file's own head
  // script adds (see that script's own comment) -- LIVE_VARIANTS above
  // is still ['c','d'], so `variant === 'e'` is false for every visitor
  // who does not carry that override.
  var ARM_E = variant === 'e';

  // B's step vocabulary, deliberately non-colliding with A's 1/2/2a/3
  // (#2016 control 4). The arms ask DIFFERENT questions at the same
  // ordinal, so a shared token would produce a funnel where arm A's step 2
  // and arm B's step 2 are the same column -- unreadable for both arms, not
  // just one. Keyed by the DOM step this file already uses, so the mapping
  // stays in one place instead of at each emit site.
  var B_STEP_TOKENS = { 2: 'b-role', '2a': 'b-industry', 1: 'b-contact', 3: 'b-redirect' };
  function stepToken(key) {
    return ARM_B ? (B_STEP_TOKENS[key] || key) : key;
  }

  // The screen a fresh session starts on, AND the screen every reset lands
  // on (the popstate stranded-guard and the bfcache restore below both
  // hardcoded 1). A enters on contact (1); B enters on role (2). A literal
  // 1 in either of those places would, on arm B, throw the visitor FORWARD
  // onto the contact screen rather than back to the start.
  var ENTRY_STEP = ARM_B ? 2 : 1;

  // gh-2016: arm B's contact screen is the last screen and is framed as
  // delivery, so A's entry-screen heading ("Let's get you started") does
  // not work in that position. Role-aware because by the time this renders
  // the role is already known, and only a homeowner is receiving quotes --
  // a contractor or referral partner is not. Both strings are APPROVED
  // (Ben, CEO, exec:cro authority, Tier B -- #2016 comment 5729566117).
  // Do not reword either without a fresh approval.
  var B_CONTACT_HEADINGS = {
    homeowner: 'Where should we send your quotes?',
    other: 'Last step — how do we reach you?'
  };

  // gh-2016: on arm B the role and industry screens run BEFORE any lead row
  // exists, so the answers are held here and written by the set_lead_role
  // call that follows the contact-screen insert. Arm A never sets either.
  var bRole = null;
  var bIndustry = null;

  function cleanAttrValue(raw, max) {
    if (typeof raw !== 'string') return null;
    var v = raw.replace(/[^\x20-\x7E]/g, '').trim().slice(0, max || 200);
    return v || null;
  }

  function readOqFtCookie() {
    try {
      var m = document.cookie.match(/(?:^|; )oq_ft=([^;]*)/);

  // the homeowner destination was the React get-started page
  // (react-app/app/get-started/page.tsx), which that PR was explicitly
  // barred from touching -- it did not strip `lead` from the URL or use
  // it for anything, so a ?lead=<uuid> sent there would have landed in
  // that origin's GA4/Meta/Clarity/Sentry beacons AND stayed live for the
  // full 30-minute prefill-read/overwrite window for anyone who captured
  // the URL. DECIDED cure at the time (Ben): homeowners got NO lead param
  // at all, only attribution (utm_*/fbclid/gclid, never PII) -- the lead
  // row and role=homeowner were already saved server-side by that point
  // in the flow, so nothing was lost by not round-tripping the id.
  //
  // gh-2046 (phase 2, SHIPPED): the React page now carries its own
  // beforeInteractive strip+prefill, mirroring this file's own
  // early-strip head script exactly (see app/layout.tsx's
  // LEAD_STRIP_SCRIPT and app/get-started/page.tsx's prefill effect) --
  // `lead` is captured into window.__oqRouterLeadId and removed from the
  // visible URL via history.replaceState before hydration, which is
  // before GA4Gate/MetaPixelGate/SentryInitializer's own effects can
  // possibly run, so no beacon on that origin ever sees it. Prefill
  // itself goes through the same get_lead_prefill RPC every other
  // destination already uses -- unmodified 30-minute window and
  // prefill_used_at single-use semantics, honored server-side. The cure
  // above is no longer needed for the reason it existed: homeowners now
  // get ?lead=<uuid> like every other destination, so
  // NO_LEAD_ID_DESTINATIONS is empty. Contractor and referral-partner
  // destinations are this repo's own static pages (contractor-join.html,
  // partner-*.html), which strip+prefill via the early-strip head script
  // added in fix round 1 -- unaffected, still get ?lead=<uuid>, same as
  // before.
  var NO_LEAD_ID_DESTINATIONS = {};

  function appendParams(baseUrl, obj) {
    var parts = [];
    Object.keys(obj).forEach(function (k) {
      if (obj[k]) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]));
    });
    if (!parts.length) return baseUrl;
    var sep = baseUrl.indexOf('?') === -1 ? '?' : '&';
    return baseUrl + sep + parts.join('&');
  }

  // gh-1994 fix round 3 (Ben, REVIEW 5702597120 finding B1, blocking):
  // shared fallback for both Step 2's role click and Step 2a's industry
  // click. set_lead_role now RETURNS boolean and `false` is a real,
  // non-error refusal (prefill_used_at already set, or past its 30-minute
  // window) -- fix round 2 only checked `res.error` here, so that refusal
  // was invisible and a Back-from-a-destination visitor's new role choice
  // was silently discarded, leaving the original (now-stale) lead's role
  // unchanged with no error anywhere in the chain (Ben's traced B1 flow).
  // On `false` or a thrown error, this re-reads the CURRENT Step 1 field
  // values (those inputs are hidden, not removed, once a later step is
  // active, so `.value` still reflects whatever the visitor last typed),
  // inserts a fresh lead with them via insertFreshLead, and retries
  // set_lead_role against the new id. Never rejects -- even a failure
  // after the fallback still proceeds to the destination, per the
  // pre-existing "the role write failing must never strand a visitor on
  // the router" rule (closes-on control (c)); it is logged instead.
  function setRoleWithFallback(role, industry, opts) {
    var payload = { p_lead_id: leadId, p_role: role };
    if (industry) payload.p_partner_industry = industry;
    // gh-2016 (CEO RUN 56, comment 5751788737, "Third finding"): arm B's
    // contact-last screen calls this function IMMEDIATELY after the same
    // request chain either inserted this exact lead (insertFreshLead) or
    // successfully updated it (update_lead_contact returning true) --
    // prefill_used_at cannot already be set and the 30-minute window
    // cannot have elapsed on a row this call chain just touched
    // successfully. So a no-op/error on THIS call is a transient RPC
    // failure, never a legitimate staleness case, and answering it with
    // insertFreshLead()'s "abandon this row, make a new one" recovery
    // would silently write a SECOND leads row with variant='b' for one
    // visitor -- the exact defect the CEO's review caught (six variant='b'
    // rows in production against an "exactly ONE row" requirement).
    // Callers in that position pass skipFreshInsertOnFailure so the
    // fallback below retries set_lead_role against the SAME row instead
    // of ever inserting another one. Arm A's Step 2 / Step 2a role clicks
    // (the pre-existing callers) do NOT pass this -- there, leadId can be
    // a genuinely stale/prefilled/expired row from an earlier visit, and
    // insertFreshLead's stale-lead-recovery fallback is still correct and
    // is left unchanged.
    var skipFreshInsert = !!(opts && opts.skipFreshInsertOnFailure);

    function fallback() {
      if (skipFreshInsert) {
        return ensureSb().rpc('set_lead_role', payload).then(function (res) {
          if (res && res.error) throw res.error;
          if (!(res && res.data === true)) {
            console.error('[router] set_lead_role retry still refused on the just-written lead (' + leadId + ') -- proceeding to the destination anyway, no duplicate row created');
          }
        }).catch(function (err) {
          console.error('[router] set_lead_role retry failed -- proceeding to the destination anyway, no duplicate row created:', err);
        });
      }
      var freshName = document.getElementById('routerName').value.trim();
      var freshEmail = document.getElementById('routerEmail').value.trim();
      var freshPhoneRaw = document.getElementById('routerPhone').value.trim();
      var freshPhone = freshPhoneRaw ? normalizePhone(freshPhoneRaw) : null; // gh-2042
      return insertFreshLead(freshName, freshEmail, freshPhone).then(function (newId) {
        leadId = newId;
        var retryPayload = { p_lead_id: newId, p_role: role };
        if (industry) retryPayload.p_partner_industry = industry;
        return ensureSb().rpc('set_lead_role', retryPayload).then(function (res) {
          if (res && res.error) throw res.error;
          if (!(res && res.data === true)) {
            console.error('[router] set_lead_role still refused on a brand-new lead (' + newId + ') -- proceeding to the destination anyway');
          }
        });
      }).catch(function (err) {
        console.error('[router] fresh-lead fallback failed -- proceeding to the destination anyway:', err);
      });
    }

    return ensureSb().rpc('set_lead_role', payload).then(function (res) {
      if (res && res.error) throw res.error;
      if (res && res.data === true) return;
      console.warn('[router] set_lead_role no-op (stale/prefilled/expired lead) -- inserting a fresh lead and retrying');
      return fallback();
    }).catch(function (err) {
      console.warn('[router] set_lead_role failed -- inserting a fresh lead and retrying:', err);
      return fallback();
    });
  }

  var roleButtons = document.querySelectorAll('#step2 .role-option');
  // gh-1994 fix round 2 (Ben, non-blocking item): disable the role buttons
  // while their set_lead_role request is in flight, so a fast double-click
  // cannot fire two RPC calls (and, worse, race two different roles onto
  // the same lead). Re-enabled once the request settles (success or
  // error) rather than left disabled, because on error the visitor stays
  // on Step 2 (see the catch handler below) and must be able to try again
  // or pick a different role.
  function setRoleButtonsDisabled(disabled) {
    roleButtons.forEach(function (b) { b.disabled = disabled; });
  }

  roleButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      var role = btn.getAttribute('data-router-role');
      if (!ensureSb()) { showError('Something went wrong. Please refresh and start over.'); return; }
      // gh-2016: arm B has no lead row yet by design -- leads.email is NOT
      // NULL at the column level (the CHECK constraint's `email IS NULL OR
      // ...` is not the authority here), so a contact-NULL row cannot be
      // inserted on the role screen at all. Hold the answer instead. A
      // session abandoned here leaves NO row, which is correct: #2011 reads
      // this test on session replays and gross drop-off, never a p-value,
      // and drop-off comes from the router_step_view events and Clarity,
      // neither of which needs a database row. Do NOT "fix" this with a
      // placeholder email -- a synthetic address would corrupt the same
      // table the real funnel reports from.
      if (ARM_B) {
        bRole = role;
        trackRouter('router_role_selected', { role: role });
        goToStep(role === 'referral_partner' ? '2a' : 1);
        return;
      }
      if (!leadId) { showError('Something went wrong. Please refresh and start over.'); return; }

      setRoleButtonsDisabled(true);

      function proceed() {
        setRoleButtonsDisabled(false);
        trackRouter('router_role_selected', { role: role });
        if (role === 'referral_partner') {
          goToStep('2a');
          return;
        }
        if (NO_LEAD_ID_DESTINATIONS[role]) {
          redirectTo(appendParams(ROLE_DESTINATIONS[role], collectAttribution()), true);
        } else {
          redirectTo(ROLE_DESTINATIONS[role]);
        }
      }

      setRoleWithFallback(role, null).then(proceed).catch(proceed);
    });
  });

  document.getElementById('backTo1').addEventListener('click', function () { history.back(); });
  document.getElementById('backTo2').addEventListener('click', function () { history.back(); });

  // ── Step 2a: partner industry — labels from js/agent-types.js
  // (AgentTypes.CHOOSER_LABELS), destinations are this router's own map
  // (not a duplicate label map, so tools/agent_type_labels_check.py's CI
  // check is unaffected). ──
  var PARTNER_INDUSTRY_DESTINATIONS = {
    re_agent: 'partner-re.html',
    insurance_agent: 'partner-insurance.html',
    home_inspector: 'partner-inspectors.html',
    adjuster: 'partner-adjusters.html',
    other: 'partner-other.html'
  };
  var PARTNER_INDUSTRY_ORDER = ['re_agent', 'insurance_agent', 'home_inspector', 'adjuster', 'other'];

  var industryButtons = []; // populated below once rendered

  (function renderPartnerIndustries() {
    var wrap = document.getElementById('partnerIndustryOptions');
    var labels = (window.AgentTypes && window.AgentTypes.CHOOSER_LABELS) || {};
    PARTNER_INDUSTRY_ORDER.forEach(function (code) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'role-option';
      btn.setAttribute('data-industry', code);
      btn.innerHTML = (labels[code] || code) + ' <span class="role-arrow">→</span>';
      btn.addEventListener('click', function () { selectPartnerIndustry(code, btn); });
      wrap.appendChild(btn);
      industryButtons.push(btn);
    });
  })();

  // gh-1994 fix round 2 (Ben, non-blocking item): same double-submit guard
  // as the Step 2 role buttons -- disable every industry button while a
  // click's set_lead_role request is in flight.
  function setIndustryButtonsDisabled(disabled) {
    industryButtons.forEach(function (b) { b.disabled = disabled; });
  }

  function selectPartnerIndustry(industry, btn) {
    if (btn && btn.disabled) return;
    if (!ensureSb()) { showError('Something went wrong. Please refresh and start over.'); return; }
    // gh-2016: held, not written -- same reason as the role buttons above.
    if (ARM_B) {
      bIndustry = industry;
      trackRouter('router_partner_industry', { industry: industry });
      goToStep(1);
      return;
    }
    if (!leadId) { showError('Something went wrong. Please refresh and start over.'); return; }
    setIndustryButtonsDisabled(true);

    function proceed() {
      setIndustryButtonsDisabled(false);
      trackRouter('router_partner_industry', { industry: industry });
      redirectTo(PARTNER_INDUSTRY_DESTINATIONS[industry]);
    }

    setRoleWithFallback('referral_partner', industry).then(proceed).catch(proceed);
  }

  // ── Step 3: redirect. `preBuilt` (fix round 2) means `dest` is already a
  // complete, final URL (e.g. the homeowner path's attribution-only URL
  // built by appendParams above) that must NOT have `?lead=<uuid>`
  // appended on top of it -- every other destination keeps the original
  // behavior of appending ?lead=<uuid>, no email/phone/name in the query
  // string (closes-on control (b)). gh-1994 phase 2: also carries
  // utm_*/fbclid/gclid (never PII) onto the contractor/partner
  // destinations, same allow-list as collectAttribution() above -- the
  // homeowner path already gets these via appendParams(...,
  // collectAttribution()) before it ever reaches here. The six static
  // destination pages' head-first strip only ever deletes `lead`, so these
  // survive the strip and reach the destination's own attribution capture
  // (e.g. the oq_ft cookie / record_first_touch_attribution path), same as
  // if the visitor had landed there directly with a tagged URL. ──
  function redirectTo(dest, preBuilt) {
    // gh-2014 fix round 2: see trackStepComplete's own comment -- this is
    // the call that was missing. Safe against double-emission: every
    // redirectTo() call site (Step 2's two role branches, Step 2a's
    // industry branch) is reached directly from a button click, never
    // after a goToStep() call in the same handler, and this call runs
    // BEFORE the renderStep(3) just below it -- so the section still
    // carrying `active` is the step actually being left here.
    // gh-2016: was "history.state.step has not yet been advanced"; the
    // step is now read off the DOM, so the ordering that matters is this
    // call's position ahead of renderStep(3), not ahead of a pushState.
    trackStepComplete();
    renderStep(3);
    if (!preBuilt) {
      var sep = dest.indexOf('?') === -1 ? '?' : '&';
      dest = dest + sep + 'lead=' + encodeURIComponent(leadId);
      dest = appendParams(dest, collectAttribution());
    }
    window.location.href = dest;
  }

  // gh-1994 fix round 2 (Ben, non-blocking item), corrected in fix round 3
  // (Ben, REVIEW 5702597120 finding B1, blocking -- this comment's own
  // "safe regardless" claim was the CONTRADICTION the reviewer quoted
  // verbatim: measured behavior was a silent no-op, not a safe update): a
  // bfcache restore (e.g. Android/iOS back-gesture from
  // app.otterquote.com/get-started or from contractor-join.html/
  // partner-*.html back to this page) resurrects the router's in-memory JS
  // exactly as it was mid-flow -- still on Step 2/2a/3 with a `leadId`
  // that has, in the realistic case (the visitor actually reached a
  // destination page, whose own prefill script already called
  // get_lead_prefill on load), its prefill_used_at already stamped.
  // Resetting to Step 1 alone was NOT sufficient fix round 2 believed it
  // to be: a resubmit would still try update_lead_contact against that
  // same now-prefilled id, get back `false` (fix round 3's new return
  // value), and -- as of this same fix round -- fall back to
  // insertFreshLead rather than silently discard the correction (see that
  // fallback above). Clearing BOTH the in-memory `leadId` and the
  // sessionStorage id here (B1 cure item c) is a cheap belt-and-suspenders
  // on top of that fallback: it means a post-bfcache resubmit takes the
  // plain fresh-insert branch directly, without needing the
  // update_lead_contact round-trip and its fallback at all.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) {
      try { history.replaceState({ step: ENTRY_STEP }, '', location.pathname + location.search); } catch (e2) {}
      renderStep(ENTRY_STEP);
      leadId = null;
      try { sessionStorage.removeItem(LEAD_ID_STORAGE_KEY); } catch (e3) {}
    }
  });

  // gh-2017: arm C's bridge, assembled LAST -- every var it reads below
  // (ROLE_DESTINATIONS, NO_LEAD_ID_DESTINATIONS, PARTNER_INDUSTRY_
  // DESTINATIONS) is a `var X = {...}` assignment further up this same
  // IIFE, not a hoisted `function` declaration, so building this object
  // any earlier would capture `undefined` for each of them. trackRouter,
  // collectAttribution, insertFreshLead, appendParams, redirectTo and
  // showError are all `function` declarations and would be safe earlier,
  // but there is no reason to split the object in two. `sb` below is a
  // live getter (gh-2063), not a captured value, so it is immune to this
  // problem regardless of where the object is built -- see ensureSb().
  // js/router-discovery.js is loaded by injecting a <script> element --
  // never a static <script src> tag in this document -- so arms A and B
  // never fetch or execute it at all (#2015: /start?v=a must render
  // exactly what /start renders).
  if (ARM_C) {
    var routerCBridge = {
      get sb() { return ensureSb(); },
      trackRouter: trackRouter,
      collectAttribution: collectAttribution,
      insertFreshLead: insertFreshLead,
      appendParams: appendParams,
      redirectTo: redirectTo,
      showError: showError,
      ROLE_DESTINATIONS: ROLE_DESTINATIONS,
      PARTNER_INDUSTRY_DESTINATIONS: PARTNER_INDUSTRY_DESTINATIONS,
      NO_LEAD_ID_DESTINATIONS: NO_LEAD_ID_DESTINATIONS
    };
    var routerCScript = document.createElement('script');
    routerCScript.src = 'js/router-discovery.js';
    routerCScript.onload = function () {
      if (window.RouterDiscovery && typeof window.RouterDiscovery.init === 'function') {
        window.RouterDiscovery.init(routerCBridge, routerCRoot);
      } else {
        showError('Something went wrong loading this page. Please refresh and try again.');
      }
    };
    routerCScript.onerror = function () {
      showError('Something went wrong loading this page. Please refresh and try again.');
    };
    document.body.appendChild(routerCScript);
  }

  // gh-2075 (D-327): arm D's bridge -- same shape as arm C's immediately
  // above, same reasoning (built last so every plain `var` it reads has
  // already been assigned in this same IIFE; `sb` is a live getter so it
  // is immune regardless). js/router-variant-d.js is loaded directly (not
  // chained after router-discovery.js) so D's first screen -- the role
  // tap, this arm's whole reason for existing -- paints and is tappable
  // without waiting on a second file fetch; router-variant-d.js lazy-loads
  // js/router-discovery.js itself, on demand, only once a visitor has
  // cleared d-email/d-name/d-phone and is about to reach the first
  // question screen it reuses copy/components from (see that file's own
  // comment) -- matching this page's established lazy-load idiom
  // (ensureSb() above, the deferred Supabase UMD script).
  if (ARM_D) {
    var routerDBridge = {
      get sb() { return ensureSb(); },
      trackRouter: trackRouter,
      collectAttribution: collectAttribution,
      insertFreshLead: insertFreshLead,
      appendParams: appendParams,
      redirectTo: redirectTo,
      showError: showError,
      ROLE_DESTINATIONS: ROLE_DESTINATIONS,
      PARTNER_INDUSTRY_DESTINATIONS: PARTNER_INDUSTRY_DESTINATIONS,
      NO_LEAD_ID_DESTINATIONS: NO_LEAD_ID_DESTINATIONS
    };
    var routerDScript = document.createElement('script');
    routerDScript.src = 'js/router-variant-d.js';
    routerDScript.onload = function () {
      if (window.RouterVariantD && typeof window.RouterVariantD.init === 'function') {
        window.RouterVariantD.init(routerDBridge, routerDRoot);
      } else {
        showError('Something went wrong loading this page. Please refresh and try again.');
      }
    };
    routerDScript.onerror = function () {
      showError('Something went wrong loading this page. Please refresh and try again.');
    };
    document.body.appendChild(routerDScript);
  }

  // gh-2076 (D-327): arm E's bridge -- same shape/reasoning as arms C/D
  // immediately above. js/router-variant-e.js is loaded directly (same
  // wiring as js/router-variant-d.js) -- it lazy-loads js/router-
  // discovery.js itself, on demand, at its own init() (see that file's
  // own comment for why it cannot defer that fetch past its first screen
  // the way arm D does: arm E's own first screen IS arm C's role screen).
  if (ARM_E) {
    var routerEBridge = {
      get sb() { return ensureSb(); },
      trackRouter: trackRouter,
      collectAttribution: collectAttribution,
      insertFreshLead: insertFreshLead,
      appendParams: appendParams,
      redirectTo: redirectTo,
      showError: showError,
      ROLE_DESTINATIONS: ROLE_DESTINATIONS,
      PARTNER_INDUSTRY_DESTINATIONS: PARTNER_INDUSTRY_DESTINATIONS,
      NO_LEAD_ID_DESTINATIONS: NO_LEAD_ID_DESTINATIONS
    };
    var routerEScript = document.createElement('script');
    routerEScript.src = 'js/router-variant-e.js';
    routerEScript.onload = function () {
      if (window.RouterVariantE && typeof window.RouterVariantE.init === 'function') {
        window.RouterVariantE.init(routerEBridge, routerERoot);
      } else {
        showError('Something went wrong loading this page. Please refresh and try again.');
      }
    };
    routerEScript.onerror = function () {
      showError('Something went wrong loading this page. Please refresh and try again.');
    };
    document.body.appendChild(routerEScript);
  }
})();
</script>
