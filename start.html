<!-- Sentry Error Monitoring -->
<!-- gh-2010: predeclare sentryOnLoad before the loader tag; the loader invokes it once the SDK is ready. -->
<!-- gh-2063 (Ben, comment 5767975097, CEO RUN 57): Sentry's loader script
     was requested via a synchronous <script src> tag, so its fetch+parse
     cost landed at parse time on every visit. Loaded lazily instead, same
     idle-or-first-interaction pattern js/ga-gate.js's and
     js/meta-pixel-gate.js's own _oqLoadOnIdleOrInteraction already use for
     gtag.js/fbevents.js (idle, capped at 1500ms via requestIdleCallback's
     own timeout, or the visitor's first pointerdown/keydown/scroll/
     touchstart, whichever comes first) -- this file keeps its own copy
     below since no js/*.js include has run yet at this point in <head>.
     No error is lost to the delay: window's error/unhandledrejection
     listeners below push every pre-load error into window._oqErrorBuffer,
     and sentryOnLoad() replays that buffer into Sentry.captureException /
     captureMessage the instant Sentry.init() returns, before clearing it. -->
<script>
  window._oqErrorBuffer = [];
  window._oqBufferError = function (e) {
    window._oqErrorBuffer.push({ type: 'error', error: e.error, message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno });
  };
  window._oqBufferRejection = function (e) {
    window._oqErrorBuffer.push({ type: 'unhandledrejection', reason: e.reason });
  };
  window.addEventListener('error', window._oqBufferError);
  window.addEventListener('unhandledrejection', window._oqBufferRejection);

  window.sentryOnLoad = function () {
    Sentry.init({
      environment: window.location.hostname.includes("staging") ? "staging" : "production",
      // gh-439: drop phantom events from non-http(s) preview contexts (data:/file:/blob:
      // URLs -- e.g. Claude's HTML preview renders pages via data: URIs; relative scripts
      // like js/auth.js then fail and report noise such as "Auth is not defined").
      denyUrls: [/^data:/, /^file:/, /^blob:/, /data:text\/html/],
      beforeSend: function (event) {
        var proto = window.location.protocol;
        if (proto !== "http:" && proto !== "https:") return null;
        var req = event.request && event.request.url;
        if (req && /^(data|file|blob):/.test(req)) return null;
        return event;
      }
    });
    // gh-2063: replay every error buffered before Sentry finished loading.
    var buffered = window._oqErrorBuffer || [];
    for (var i = 0; i < buffered.length; i++) {
      var item = buffered[i];
      try {
        if (item.type === 'error' && item.error) {
          Sentry.captureException(item.error);
        } else if (item.type === 'error') {
          Sentry.captureMessage(item.message || 'Unknown error (buffered pre-Sentry-load)');
        } else if (item.type === 'unhandledrejection') {
          if (item.reason instanceof Error) {
            Sentry.captureException(item.reason);
          } else {
            Sentry.captureMessage('Unhandled rejection (buffered pre-Sentry-load): ' + String(item.reason));
          }
        }
      } catch (replayErr) { /* replaying a buffered error must never itself throw */ }
    }
    window._oqErrorBuffer = [];
  };

  // gh-2063: local copy of js/ga-gate.js's _oqLoadOnIdleOrInteraction,
  // scoped to loading the Sentry loader script only.
  (function () {
    var fired = false;
    var idleHandle = null;
    var timeoutHandle = null;
    var EVENTS = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
    function teardown() {
      for (var i = 0; i < EVENTS.length; i++) {
        window.removeEventListener(EVENTS[i], run);
      }
      if (idleHandle !== null && window.cancelIdleCallback) { window.cancelIdleCallback(idleHandle); }
      if (timeoutHandle !== null) { clearTimeout(timeoutHandle); }
    }
    function loadSentryLoader() {
      var s = document.createElement('script');
      s.src = 'https://js.sentry-cdn.com/49b5839b50adc240398d822c46d4a86e.min.js';
      s.crossOrigin = 'anonymous';
      s.onload = function () {
        // the loader's own listeners own capture from here on (no double-report)
        window.removeEventListener('error', window._oqBufferError);
        window.removeEventListener('unhandledrejection', window._oqBufferRejection);
        // lazy loader: sentryOnLoad (and the replay) only runs once the SDK loads
        if (window._oqErrorBuffer.length && window.Sentry && typeof window.Sentry.forceLoad === 'function') {
          window.Sentry.forceLoad();
        }
      };
      document.head.appendChild(s);
    }
    function run() {
      if (fired) return;
      fired = true;
      teardown();
      loadSentryLoader();
    }
    for (var i = 0; i < EVENTS.length; i++) {
      window.addEventListener(EVENTS[i], run, { passive: true, once: true });
    }
    if (window.requestIdleCallback) {
      idleHandle = window.requestIdleCallback(run, { timeout: 1500 });
    } else {
      timeoutHandle = setTimeout(run, 1500);
    }
  })();
</script>

<!-- gh-2033: /start assigns the A/B/C variant itself, and must do it BEFORE
     any analytics call that can carry `variant` -- js/ga-gate.js's own
     gtag('js', ...) call and its Clarity vendor snippet are both downstream
     of this tag, so this has to load first or an early GA4/Clarity hit is
     unattributable for good (GA4's variant/step custom dimensions are not
     retroactive). Precedence: an explicit, validated ?v= in the URL wins;
     else a persisted per-visitor assignment (localStorage, cookie
     fallback); else uniform-random across the live set (gh-2074:
     LIVE_VARIANTS below -- today just 'c'; a syntactically-valid but
     non-live arm from ANY of those sources, e.g. a persisted 'a'/'b', is
     re-mapped to a live arm on arrival, never served/blanked/404'd).
     Persists the result to BOTH localStorage and a first-party cookie
     (oq_variant_v1, versioned so a future re-randomisation is a key bump)
     and rewrites the URL via
     history.replaceState -- never pushState -- preserving every existing
     query parameter (UTMs above all). Every storage/URL touch is its own
     try/catch: 39% of this traffic is the Facebook in-app webview, where
     localStorage access throws, and one throwing step must never break the
     page or block the others. window.__oqVariant is set before the
     replaceState call so the main IIFE further down this file (see its
     gh-2014/gh-2033 variant read) still has a source if replaceState itself
     throws. Deliberately uses /^[abc]$/.test() everywhere, never an
     object-literal lookup ({a:1,b:1,c:1}[raw]) -- that walks the prototype
     chain and lets ?v=constructor / ?v=__proto__ through (see the
     gh-2014 fix round 4 comment on the main IIFE's own variant read). -->
<script>
(function () {
  // gh-2075 (D-327) round 2, review report ceo57-review-pr2086-20260921
  // finding 1 (blocking, real-browser evidence: a visitor carrying a
  // pre-flip key persisted 'c' was served 'c' in 4/4 loads after a
  // standalone key bump): a key bump on ITS OWN, ahead of the
  // LIVE_VARIANTS flip, does NOT decouple anything -- every visitor who
  // reaches /start between THIS merge and the flip gets re-persisted 'c'
  // under the new key (since LIVE_VARIANTS is still ['c'] the moment they
  // land), and stays sticky to 'c' after the flip for the same reason
  // isLive('c') is a no-op that this file's own LIVE_VARIANTS comment
  // below already documents -- round 1 of this fix produced exactly the
  // 80/10/10 skew it claimed to prevent. KEY stays 'oq_variant_v1' here;
  // see LIVE_VARIANTS below for the single block the orchestrator edits
  // -- the key bump and the live-set flip are ONE change, not two.
  var KEY = 'oq_variant_v3'; // D-327 flip 1/2 (2026-09-22): D+E live

  // gh-2074 fix round 2 (PR #2079 review, item 2): KNOWN_ARMS is the
  // single source of truth for which arm letters are syntactically
  // recognised at all -- NOT which ones are currently served (see
  // LIVE_VARIANTS below for that). It already lists 'd'/'e' so shipping
  // gh-2075/gh-2076 never needs a second change here: a persisted or
  // ?v=-carried d/e always PARSES, even while LIVE_VARIANTS still keeps
  // them unreachable. Exposed as window.__oqKnownArms so the main IIFE's
  // own variant read further down this file (gh-2014/gh-2033 -- a
  // SEPARATE <script> block/closure) derives its allowlist from this
  // same list instead of a second hardcoded regex that can silently
  // drift out of sync: review caught exactly that on the first pass of
  // this fix -- an unsynced /^[abc]$/ there would read a live 'd'
  // session back as variant=null and silently render arm A, the one arm
  // this issue exists to eliminate.
  var KNOWN_ARMS = ['a', 'b', 'c', 'd', 'e', 'f'];
  window.__oqKnownArms = KNOWN_ARMS;
  // gh-2122 (Arm F, D-332): arms reachable ONLY by an explicit ?v= in the URL.
  // They are recognised (KNOWN_ARMS) but are never in LIVE_VARIANTS, so they
  // are not in the random split until Sloane says so on #2122 -- and unlike
  // every other non-live arm, an explicit ?v=f is NOT remapped onto the live
  // set by toLiveArm(), because a paid-ad landing on /start?v=f is the whole
  // point of the arm. A direct-only arm is also never persisted to
  // localStorage/cookie (step 4 below), so it cannot stick to a browser and a
  // later visit without ?v= still gets a live arm. Exposed on window so the
  // main IIFE's own variant read (a separate <script>) applies the same rule.
  var DIRECT_ONLY_ARMS = ['f'];
  window.__oqDirectOnlyArms = DIRECT_ONLY_ARMS;
  function isDirectOnly(arm) { return DIRECT_ONLY_ARMS.indexOf(arm) !== -1; }
  var ARM_RE = new RegExp('^(' + KNOWN_ARMS.join('|') + ')$');

  // gh-2074: the LIVE set. Today only 'c' -- a and b lose 90%+ of visitors
  // at the first screen (GA4 router_step_view 7d: a 120->12, b 87->13,
  // c 59->9). Arm a/b's code stays in this file, unreachable, for d/e to
  // reuse -- nothing here is deleted.
  //
  // gh-2074 fix round 2 (PR #2079 review, item 3): flipping this constant
  // to ['c', 'd', 'e'] when d/e ship is NOT "the whole switch" and does
  // NOT give equal weights by itself -- the original comment here was
  // wrong. Every visitor assigned 'c' during this single-arm period is
  // persisted (KEY above, 180-day max-age -- see the gh-2033 comment
  // block near the top of this file) and stays sticky to 'c' on return:
  // isLive('c') is already true, so toLiveArm() is a no-op for every one
  // of those returning sessions regardless of what this constant says
  // later. Flipping it alone would therefore land roughly 80% of traffic
  // on 'c' (every persisted single-arm-period visitor, plus 1/3 of
  // brand-new ones) versus ~10% each for d/e -- not the even split
  // "equal weights" implies. Shipping d/e as a real three-way test
  // REQUIRES bumping KEY too (e.g. 'oq_variant_v2') alongside this flip,
  // so every visitor -- persisted or not -- re-randomises across the new
  // live set. Flip this constant WITHOUT the key bump only if a
  // deliberately c-weighted d/e rollout is the actual intent.
  // ══════════════════ D-327 ORCHESTRATOR FLIP BLOCK ══════════════════
  // Do NOT flip LIVE_VARIANTS without ALSO bumping KEY (above) in the
  // SAME deploy -- they are one change, not two (round-2 review finding
  // 1 on PR #2086: bumping the key early, alone, does nothing but stamp
  // every pre-flip visitor 'c' under the new key, which then persists
  // for 180 days regardless of what this constant says later). When
  // #2075 merges, in ONE commit:
  //   1. KEY becomes 'oq_variant_v2'            (start.html, above)
  //   2. LIVE_VARIANTS becomes ['c','d']          (this line)
  // and when #2076 (arm e) merges, bump again together:
  //   1. KEY becomes 'oq_variant_v3'
  //   2. LIVE_VARIANTS becomes ['c','d','e']
  // This PR (gh-2075) intentionally leaves BOTH constants unflipped, per
  // #2075's own instruction ("the PR must not change live assignment").
  // Until the flip, arm d's code below is shipped but unreachable:
  // toLiveArm() (below) remaps any non-live arm -- including an explicit
  // ?v=d -- onto the live set, so ?v=d does NOT render arm d pre-flip.
  // tests/gh2033-variant-assignment.mjs reads BOTH constants out of this
  // file itself (never a hardcoded copy) -- the flip above is genuinely
  // the only edit needed; that test needs none.
  // ═════════════════════════════════════════════════════════════════
  var LIVE_VARIANTS = ['c','d','e']; // D-327 flip 2/2 (2026-09-22): Variants D and E live beside C

  // gh-2074 fix round 2 (PR #2079 review, item 4): guards a misconfigured
  // empty LIVE_VARIANTS from indexing an empty array and writing a
  // literal "v=undefined" into the URL, both stores, and every
  // downstream analytics/lead write -- falls back to SAFE_DEFAULT_ARM.
  var SAFE_DEFAULT_ARM = 'c';
  function effectiveLiveVariants() {
    return (LIVE_VARIANTS && LIVE_VARIANTS.length) ? LIVE_VARIANTS : [SAFE_DEFAULT_ARM];
  }

  function validArm(v) {
    var s = String(v == null ? '' : v).toLowerCase();
    return ARM_RE.test(s) ? s : null;
  }

  // gh-2074: is this (syntactically valid) arm one we're currently serving?
  function isLive(arm) {
    var live = effectiveLiveVariants();
    for (var i = 0; i < live.length; i++) {
      if (live[i] === arm) return true;
    }
    return false;
  }

  // gh-2074: map any syntactically-valid arm onto a live one -- a no-op for
  // an already-live arm, otherwise a uniform-random re-assignment across
  // the live set. Applied to every source below (URL, localStorage,
  // cookie, random) so a/b (or any non-live arm) can never reach
  // rendering.
  //
  // gh-2074 fix round 2 (PR #2079 review, item 1 BLOCKER): exposed as
  // window.__oqToLiveArm so the main IIFE's own variant read further
  // down this file -- a separate <script> block, so it does NOT share
  // this closure -- can apply this identical mapping to its own URL
  // fallback path, instead of trusting a stale, pre-mapped ?v= that this
  // script's own history.replaceState call (below) failed to rewrite
  // because it threw (sandboxed iframes without allow-same-origin,
  // Safari's history-mutation rate limit -- both real /start traffic).
  function toLiveArm(arm) {
    if (isLive(arm)) return arm;
    var live = effectiveLiveVariants();
    return live[Math.floor(Math.random() * live.length)];
  }
  window.__oqToLiveArm = toLiveArm;
  window.__oqLiveVariants = effectiveLiveVariants();

  function readCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  // 1. Explicit ?v= wins over anything persisted -- re-mapped to a live arm
  //    if it names a or b (gh-2074: do not 404, do not blank).
  var urlArm = null;
  try {
    urlArm = validArm(new URLSearchParams(window.location.search).get('v'));
  } catch (e) {}
  // gh-2076 (D-327) QA override: an explicit ?v=e&oq_internal=1 renders
  // that arm directly, bypassing toLiveArm()'s live-set remap, WITHOUT
  // touching LIVE_VARIANTS/KEY above and WITHOUT changing what a normal
  // visitor (no oq_internal param) ever sees -- #2076's own instruction
  // that arm e must be reachable for manual/automated QA before the flip,
  // the way arm d could not be (see PR #2086's own documented
  // contradiction: an explicit ?v=d did NOT render arm d pre-flip,
  // because toLiveArm() remaps every non-live arm unconditionally). Step
  // 4 below still persists whatever `arm` ends up being to both stores,
  // but that is harmless here: step 2's own read of a persisted arm on
  // any LATER, non-oq_internal load still runs it through toLiveArm()
  // unconditionally, so a stray persisted 'e' cannot leak into a normal
  // visitor's assignment once this override is not present on the URL.
  var oqInternalOverride = false;
  try {
    // #2088 round 1 item 2: the override is scoped to EXACTLY urlArm ===
    // 'e' -- not "any urlArm while oq_internal=1" as fix round 1 had it,
    // which let ?v=a&oq_internal=1 / ?v=b&oq_internal=1 also bypass
    // toLiveArm() and briefly render A/B outside their own kill-switch,
    // and which also changed ?v=d's own pre-flip behaviour (documented in
    // PR #2086 as intentionally NOT bypassing toLiveArm()) whenever a
    // visitor happened to also carry oq_internal=1. Only 'e' gets the
    // bypass; every other urlArm (including 'd') still runs through
    // toLiveArm() exactly as before this PR.
    oqInternalOverride = urlArm === 'e' && new URLSearchParams(window.location.search).get('oq_internal') === '1';
  } catch (e) {}
  // #2088 round 1 item 3: read by insertFreshLead below (via
  // window.__oqInternalOverride) and by arm E's own bridge, so a walk
  // taken under this override is written to leads.is_synthetic = true
  // instead of looking like a real visitor's lead.
  window.__oqInternalOverride = oqInternalOverride;
  // CEO run 57 post-flip walk finding (2026-09-22): oq_internal=1 walks on
  // arms C and D wrote UNFLAGGED production leads, because is_synthetic was
  // only threaded through the arm-E assignment override above. This flag is
  // separate from that override: it never changes assignment (toLiveArm()
  // still runs for every arm), it only marks any lead written during an
  // oq_internal=1 page load as synthetic. Read by insertFreshLead() below.
  var oqInternalWalk = false;
  try { oqInternalWalk = new URLSearchParams(window.location.search).get('oq_internal') === '1'; } catch (e) {}
  window.__oqInternalWalk = oqInternalWalk;
  var arm = urlArm ? ((oqInternalOverride || isDirectOnly(urlArm)) ? urlArm : toLiveArm(urlArm)) : null;

  // 2. Else a persisted assignment -- localStorage first, cookie fallback,
  //    each in its own try/catch so a throw on one still lets the other run.
  //    Also re-mapped to a live arm (gh-2074): a stale persisted a/b is
  //    reassigned here, and step 4 below overwrites both stores with the
  //    reassigned value rather than leaving the stale one in place.
  if (!arm) {
    var fromStorage = null;
    try { fromStorage = validArm(window.localStorage.getItem(KEY)); } catch (e) {}
    var fromCookie = null;
    if (!fromStorage) {
      try { fromCookie = validArm(readCookie(KEY)); } catch (e) {}
    }
    var persistedArm = fromStorage || fromCookie;
    arm = persistedArm ? toLiveArm(persistedArm) : null;
  }

  // 3. Else assign at random, uniform across the LIVE set only (gh-2074:
  //    never the full a-e set -- LIVE_VARIANTS today is just ['c']).
  //    Uses effectiveLiveVariants() (fix round 2, item 4) so a
  //    misconfigured empty LIVE_VARIANTS falls back to SAFE_DEFAULT_ARM
  //    instead of indexing an empty array.
  if (!arm) {
    var liveForRandom = effectiveLiveVariants();
    arm = liveForRandom[Math.floor(Math.random() * liveForRandom.length)];
  }

  // Expose before replaceState so a downstream throw there still leaves a
  // usable source for the main IIFE's own variant read.
  window.__oqVariant = arm;

  // gh-2160 review fix (comment 5818464392, must-fix 1): the header/footer
  // skip was hard-coded for every arm this page can serve (A-E and no
  // variant at all), not just F -- C/D/E's live random split lost their
  // footer Privacy Policy/Terms links along with the escape hatches. Stamp
  // the resolved arm onto <html> the instant it's known (still inside the
  // synchronous head IIFE, well before the header/footer elements below are
  // parsed) so both the CSS rule and the inline script right after the
  // footer can scope themselves to arm === 'f' only. Every other arm (and a
  // bare /start) gets no attribute here and keeps the header/footer exactly
  // as main.
  try { document.documentElement.setAttribute('data-oq-start-arm', arm || ''); } catch (e) {}

  // gh-2121 (LRS S05, ceo67 Lighthouse trace): Arm F's LCP element is the
  // step-1 <h1>, which js/router-variant-f.js renders -- and that file was
  // only ever requested at the very bottom of <body>, after design-system.css
  // /nav.css, the Supabase UMD bundle and five same-origin scripts had all
  // been given a chance to load first. lcp-breakdown-insight measured ~2.2s
  // of "element render delay" (time after first byte spent waiting, not
  // loading) almost entirely attributable to that late request. We already
  // know by this point -- before the parser has reached a single one of
  // those other resources -- whether this visit needs router-variant-f.js at
  // all (arm is direct-only for 'f': isDirectOnly('f') is true, so an
  // explicit ?v=f is never remapped away by toLiveArm() above). A preload
  // hint here starts that fetch in parallel with everything else on the
  // page; the actual <script> tag that runs it is unchanged, added later in
  // this file exactly as before -- this is additive only, a fetch that was
  // always going to happen, just requested early instead of last.
  if (arm === 'f') {
    try {
      var rfPreload = document.createElement('link');
      rfPreload.rel = 'preload';
      rfPreload.as = 'script';
      rfPreload.href = '/js/router-variant-f.js';
      document.head.appendChild(rfPreload);
    } catch (e) {}
  }

  // 4. Persist to BOTH stores, each independently guarded -- SKIPPED
  //    entirely while the #2088 round-1-item-2 QA override is active, so
  //    a ?v=e&oq_internal=1 walk can never leak arm 'e' into a normal,
  //    non-override later visit to this same browser (a stale persisted
  //    'e' would otherwise still be remapped by toLiveArm() on that later
  //    visit, per step 2 above, but skipping the write is simpler and
  //    leaves zero trace of the QA walk in either store).
  if (!oqInternalOverride && !isDirectOnly(arm)) {
    try { window.localStorage.setItem(KEY, arm); } catch (e) {}
    try {
      var secure = window.location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = KEY + '=' + arm + '; path=/; max-age=' + (180 * 24 * 60 * 60) +
        '; SameSite=Lax' + secure;
    } catch (e) {}
  }

  // 5. Rewrite the URL, preserving every existing query parameter.
  try {
    var params = new URLSearchParams(window.location.search);
    params.set('v', arm);
    var newUrl = window.location.pathname + '?' + params.toString() + window.location.hash;
    history.replaceState(history.state, '', newUrl);
  } catch (e) {}
})();
</script>
<!-- Google Analytics / Meta Pixel / Clarity — gh-1994 item 4: same two
     include files every public page loads, in the same order, no per-page
     loader (js/ga-gate.js's own module docstring: "the ONLY place gtag.js
     is requested"; js/meta-pixel-gate.js: "the ONLY place fbevents.js is
     requested"). Clarity rides the GA4 gate's own host check; js/ga-gate.js's
     CLARITY_ALLOWED_PATHS carries '/start' (gh-2014). -->
<!-- gh-2160 review fix (comment 5818464392, must-fix 2): standard
     base-code queuing stubs, defined here -- synchronous, no network,
     effectively free -- so every gtag()/fbq() call site on this page
     (trackRouter below, the two fbq('track','Lead',...) sites in this
     file and js/router-variant-f.js) keeps working immediately, even
     though js/ga-gate.js and js/meta-pixel-gate.js themselves are now
     requested later (see below). window.gtag mirrors js/ga-gate.js's own
     stub shape exactly (push arguments onto dataLayer); window.fbq is
     copied verbatim from js/meta-pixel-gate.js's fbqStub (same
     callMethod/queue/push/loaded/version shape fbevents.js's own
     callMethod hookup depends on, per that file's gh-2000 comment). Each
     gate file's own `window.dataLayer = window.dataLayer || []` /
     `if (!window.fbq)` guard is exactly what lets it ADOPT this
     already-present stub instead of clobbering it once it actually runs,
     so nothing queued here before then is lost -- only possibly delayed.
     gtag('js', ...) / gtag('config', ...) fire here, immediately, for the
     same reason: queuing them first, before any trackRouter() call can
     queue a router_step_view, is what keeps GA4's own automatic page_view
     (sent when the real library processes the queued 'config' command)
     ordered ahead of the first step_view once that library actually
     loads -- matching gtag('js', ...)'s existing unconditional call inside
     js/ga-gate.js itself. Whether the real gtag.js/fbevents.js library
     ever loads at all, and whether GA4/Meta ever actually SEE any of what
     is queued here, is still decided entirely by each gate file's own
     unchanged ALLOWED_HOSTS/oqInternal()/oqAdOptOut() checks the moment it
     runs -- queuing a call here never bypasses them; it only makes the

    // them overlap it -- net negative for Time to Interactive. A short,
    // capped requestIdleCallback (falling back to a plain timer) gets

      seconds_on_step: seconds,
      visibility_state: visibilityState,
      // GA4's recommended transport for events fired during/near unload
      // -- guarantees the beacon-safe navigator.sendBeacon transport
      // rather than a regular (cancelable-on-unload) XHR/fetch.
      transport_type: 'beacon'
    }, abandonCurrentVariant);
  }

  window.addEventListener('pagehide', function () {
    sendAbandonBeacon(document.visibilityState);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      if (abandonHiddenTimer) clearTimeout(abandonHiddenTimer);
      abandonHiddenTimer = setTimeout(function () { sendAbandonBeacon('hidden'); }, ABANDON_HIDDEN_GRACE_MS);
    } else if (abandonHiddenTimer) {
      clearTimeout(abandonHiddenTimer);
      abandonHiddenTimer = null;
    }
  });

  // gh-2017: arm C's bridge, assembled LAST -- every var it reads below
  // (ROLE_DESTINATIONS, NO_LEAD_ID_DESTINATIONS, PARTNER_INDUSTRY_
  // DESTINATIONS) is a `var X = {...}` assignment further up this same
  // IIFE, not a hoisted `function` declaration, so building this object
  // any earlier would capture `undefined` for each of them. trackRouter,
  // collectAttribution, insertFreshLead, appendParams, redirectTo and
  // showError are all `function` declarations and would be safe earlier,
  // but there is no reason to split the object in two. `sb` below is a
  // live getter (gh-2063), not a captured value, so it is immune to this
  // problem regardless of where the object is built -- see ensureSb().
  // js/router-discovery.js is loaded by injecting a <script> element --
  // never a static <script src> tag in this document -- so arms A and B
  // never fetch or execute it at all (#2015: /start?v=a must render
  // exactly what /start renders).
  if (ARM_C) {
    var routerCBridge = {
      get sb() { return ensureSb(); },
      trackRouter: trackRouter,
      collectAttribution: collectAttribution,
      insertFreshLead: insertFreshLead,
      appendParams: appendParams,
      redirectTo: redirectTo,
      showError: showError,
      ROLE_DESTINATIONS: ROLE_DESTINATIONS,
      PARTNER_INDUSTRY_DESTINATIONS: PARTNER_INDUSTRY_DESTINATIONS,
      NO_LEAD_ID_DESTINATIONS: NO_LEAD_ID_DESTINATIONS
    };
    var routerCScript = document.createElement('script');
    routerCScript.src = 'js/router-discovery.js';
    routerCScript.onload = function () {
      if (window.RouterDiscovery && typeof window.RouterDiscovery.init === 'function') {
        window.RouterDiscovery.init(routerCBridge, routerCRoot);
      } else {
        showError('Something went wrong loading this page. Please refresh and try again.');
      }
    };
    routerCScript.onerror = function () {
      showError('Something went wrong loading this page. Please refresh and try again.');
    };
    document.body.appendChild(routerCScript);
  }

  // gh-2075 (D-327): arm D's bridge -- same shape as arm C's immediately
  // above, same reasoning (built last so every plain `var` it reads has
  // already been assigned in this same IIFE; `sb` is a live getter so it
  // is immune regardless). js/router-variant-d.js is loaded directly (not
  // chained after router-discovery.js) so D's first screen -- the role
  // tap, this arm's whole reason for existing -- paints and is tappable
  // without waiting on a second file fetch; router-variant-d.js lazy-loads
  // js/router-discovery.js itself, on demand, only once a visitor has
  // cleared d-email/d-name/d-phone and is about to reach the first
  // question screen it reuses copy/components from (see that file's own
  // comment) -- matching this page's established lazy-load idiom
  // (ensureSb() above, the deferred Supabase UMD script).
  if (ARM_D) {
    var routerDBridge = {
      get sb() { return ensureSb(); },
      trackRouter: trackRouter,
      collectAttribution: collectAttribution,
      insertFreshLead: insertFreshLead,
      appendParams: appendParams,
      redirectTo: redirectTo,
      showError: showError,
      ROLE_DESTINATIONS: ROLE_DESTINATIONS,
      PARTNER_INDUSTRY_DESTINATIONS: PARTNER_INDUSTRY_DESTINATIONS,
      NO_LEAD_ID_DESTINATIONS: NO_LEAD_ID_DESTINATIONS
    };
    var routerDScript = document.createElement('script');
    routerDScript.src = 'js/router-variant-d.js';
    routerDScript.onload = function () {
      if (window.RouterVariantD && typeof window.RouterVariantD.init === 'function') {
        window.RouterVariantD.init(routerDBridge, routerDRoot);
      } else {
        showError('Something went wrong loading this page. Please refresh and try again.');
      }
    };
    routerDScript.onerror = function () {
      showError('Something went wrong loading this page. Please refresh and try again.');
    };
    document.body.appendChild(routerDScript);
  }

  // gh-2076 (D-327): arm E's bridge -- same shape/reasoning as arms C/D
  // immediately above. js/router-variant-e.js is loaded directly (same
  // wiring as js/router-variant-d.js) -- it lazy-loads js/router-
  // discovery.js itself, on demand, at its own init() (see that file's
  // own comment for why it cannot defer that fetch past its first screen
  // the way arm D does: arm E's own first screen IS arm C's role screen).
  if (ARM_E) {
    // #2088 round 1 item 3: read once here (not inside the bridge getter)
    // since window.__oqInternalOverride is set once, synchronously, by
    // the head script above and never changes for the life of this page.
    var oqInternalOverrideFlag = !!window.__oqInternalOverride;
    var routerEBridge = {
      get sb() { return ensureSb(); },
      trackRouter: trackRouter,
      collectAttribution: collectAttribution,
      insertFreshLead: insertFreshLead,
      appendParams: appendParams,
      redirectTo: redirectTo,
      showError: showError,
      ROLE_DESTINATIONS: ROLE_DESTINATIONS,
      PARTNER_INDUSTRY_DESTINATIONS: PARTNER_INDUSTRY_DESTINATIONS,
      NO_LEAD_ID_DESTINATIONS: NO_LEAD_ID_DESTINATIONS,
      oqInternalOverride: oqInternalOverrideFlag
    };
    // #2088 round 2 leftover (item 9): a SEPARATE bridge for the
    // script-load-failure fallback below -- reusing routerEBridge there
    // (round 1's own fix) ran arm C's own js/router-discovery.js with a
    // bridge whose trackRouter/insertFreshLead both tag events/rows with
    // THIS page's `variant` ('e'), so a visitor who silently fell back
    // from E to C's real experience had C's own 'c-*' steps and leads
    // row recorded as variant='e' -- indistinguishable from an actual
    // arm-E run in analytics/the leads table. Every field is identical to
    // routerEBridge except trackRouter/insertFreshLead, which pass 'c' as
    // their own variant override (see those two functions' own comments)
    // -- oqInternalOverride/is_synthetic threading is unaffected, since
    // that argument is unrelated to which arm a row/event is tagged with.
    var routerCFallbackBridge = {
      get sb() { return ensureSb(); },
      trackRouter: function (name, extra) { return trackRouter(name, extra, 'c'); },
      collectAttribution: collectAttribution,
      insertFreshLead: function (nm, em, ph, isSynthetic) { return insertFreshLead(nm, em, ph, isSynthetic, 'c'); },
      appendParams: appendParams,
      redirectTo: redirectTo,
      showError: showError,
      ROLE_DESTINATIONS: ROLE_DESTINATIONS,
      PARTNER_INDUSTRY_DESTINATIONS: PARTNER_INDUSTRY_DESTINATIONS,
      NO_LEAD_ID_DESTINATIONS: NO_LEAD_ID_DESTINATIONS,
      oqInternalOverride: oqInternalOverrideFlag
    };
    var routerEScript = document.createElement('script');
    routerEScript.src = 'js/router-variant-e.js';
    routerEScript.onload = function () {
      if (window.RouterVariantE && typeof window.RouterVariantE.init === 'function') {
        window.RouterVariantE.init(routerEBridge, routerERoot);
      } else {
        showError('Something went wrong loading this page. Please refresh and try again.');
      }
    };
    // Nit (PR #2088 round 1): a script-load failure (network hiccup,
    // ad-blocker, CDN outage on this same-origin file) used to strand the
    // visitor on an empty panel. Arm C's own router-discovery.js is
    // already the fallback module for the professional/contractor
    // tracks this arm reuses, so on a load failure this now falls all the
    // way back to arm C's own experience (its full role-first flow)
    // rather than an error message -- a visitor still completes a router,
    // just not in E's homeowner-exposition variant. Runs with
    // routerCFallbackBridge (item 9 above), NOT routerEBridge, so its
    // rows/events are tagged variant='c'.
    routerEScript.onerror = function () {
      var fallbackScript = document.createElement('script');
      fallbackScript.src = 'js/router-discovery.js';
      fallbackScript.onload = function () {
        if (window.RouterDiscovery && typeof window.RouterDiscovery.init === 'function') {
          window.RouterDiscovery.init(routerCFallbackBridge, routerERoot);
        } else {
          showError('Something went wrong loading this page. Please refresh and try again.');
        }
      };
      fallbackScript.onerror = function () {
        showError('Something went wrong loading this page. Please refresh and try again.');
      };
      document.body.appendChild(fallbackScript);
    };
    document.body.appendChild(routerEScript);
  }

  // gh-2122 (D-332): arm F's bridge -- same shape and reasoning as arms C/D/E
  // above (built last so every plain `var` it reads is already assigned; `sb`
  // is a live getter). One addition: markLeadSaved (see that function). No
  // fallback bridge: a load failure here shows the standard error, it does not
  // silently fall back to another arm, because an F visitor arrived by an
  // explicit ?v=f link and a silent swap would put them in an arm the ad never
  // promised.
  if (ARM_F) {
    var routerFBridge = {
      get sb() { return ensureSb(); },
      trackRouter: trackRouter,
      collectAttribution: collectAttribution,
      insertFreshLead: insertFreshLead,
      appendParams: appendParams,
      redirectTo: redirectTo,
      showError: showError,
      markLeadSaved: markLeadSaved,
      // The record-lead-details Edge Function, called by js/router-variant-f.js as a keepalive fetch (with a sendBeacon
      // fallback on pagehide), so it needs the URL and the public anon key. Both are already public in js/config.js.
      // gh-2121: getters, not eager values -- config.js is now `defer`red (see
      // its <script> tag's own comment), so CONFIG may not exist yet at the
      // moment this bridge object literal is built. js/router-variant-f.js's
      // own detailsUrl()/anonKey reads (grep confirms: both are read inside a
      // function body, called at keepalive-fetch time, never cached at
      // RouterVariantF.init()) already tolerate a getter exactly like `sb`
      // above -- this changes WHEN CONFIG is read (call time, same as
      // today's effective behavior once config.js finishes loading) not
      // WHAT is returned once it has.
      get detailsUrl() { return (typeof CONFIG !== 'undefined' && CONFIG.SUPABASE_URL) ? String(CONFIG.SUPABASE_URL).replace(/\/+$/, '') + '/functions/v1/record-lead-details' : null; },
      get anonKey() { return (typeof CONFIG !== 'undefined' && CONFIG.SUPABASE_ANON) ? CONFIG.SUPABASE_ANON : null; },
      ROLE_DESTINATIONS: ROLE_DESTINATIONS
    };
    var routerFScript = document.createElement('script');
    routerFScript.src = 'js/router-variant-f.js';
    routerFScript.onload = function () {
      if (window.RouterVariantF && typeof window.RouterVariantF.init === 'function') {
        window.RouterVariantF.init(routerFBridge, routerFRoot);
      } else {
        showError('Something went wrong loading this page. Please refresh and try again.');
      }
    };
    routerFScript.onerror = function () {
      showError('Something went wrong loading this page. Please refresh and try again.');
    };
    document.body.appendChild(routerFScript);
  }
})();
</script>
