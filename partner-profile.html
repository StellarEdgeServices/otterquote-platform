<!DOCTYPE html>
<html lang="en">
<head>
<!-- Sentry Error Monitoring -->
<!-- gh-2043: predeclare sentryOnLoad before the loader tag; the loader invokes it once the SDK is ready (pattern from gh-2010, PR #2023). -->
<script>
  window.sentryOnLoad = function () {
    Sentry.init({
      environment: window.location.hostname.includes("staging") ? "staging" : "production",
      // gh-439: drop phantom events from non-http(s) preview contexts (data:/file:/blob:
      // URLs -- e.g. Claude's HTML preview renders pages via data: URIs; relative scripts
      // like js/auth.js then fail and report noise such as "Auth is not defined").
      denyUrls: [/^data:/, /^file:/, /^blob:/, /data:text\/html/],
      beforeSend: function (event) {
        var proto = window.location.protocol;
        if (proto !== "http:" && proto !== "https:") return null;
        var req = event.request && event.request.url;
        if (req && /^(data|file|blob):/.test(req)) return null;
        return event;
      }
    });
  };
</script>
<script
  src="https://js.sentry-cdn.com/49b5839b50adc240398d822c46d4a86e.min.js"
  crossorigin="anonymous"
></script>
<!-- Coming-soon gate — flip CONFIG.HOMEOWNER_LAUNCH_ENABLED=true in js/config.js to remove -->
<script src="js/cookie-storage.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script>(function(){if(typeof CONFIG!=='undefined'&&!CONFIG.HOMEOWNER_LAUNCH_ENABLED){window.location.replace('/coming-soon.html?from=partner-profile&persona=homeowner');}})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partner Profile &mdash; Otter Quotes</title>
<meta name="description" content="An Otter Quotes partner profile page.">
<meta name="robots" content="noindex">

<script src="/js/ga-gate.js"></script>

<script src="/js/reddit-pixel-gate.js"></script>

<!-- Microsoft Clarity (wwr7qlk8g5) is loaded by /js/ga-gate.js, behind the same production-host gate as GA4 (gh-1619). Do not add a per-page loader. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/nav.css">

<style>
    /* gh-862/gh-881: partner-branded "Trusted Partners" page — a real,
       distinct destination, not a duplicate of the referral funnel link. */
    .profile-wrapper {
        min-height: calc(100vh - 64px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--sp-12) var(--sp-4);
    }

    .profile-card {
        max-width: 560px;
        width: 100%;
        background: var(--navy-2);
        border: 1px solid rgba(224, 123, 0, 0.2);
        border-radius: var(--radius-lg);
        padding: var(--sp-12) var(--sp-8);
        text-align: center;
    }

    .profile-eyebrow {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--amber);
        margin-bottom: var(--sp-4);
    }

    .profile-avatar-img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto var(--sp-4);
        display: block;
        border: 2px solid var(--amber);
    }

    .profile-avatar-fallback {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        margin: 0 auto var(--sp-4);
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(224, 123, 0, 0.15);
        color: var(--amber);
        font-size: 2rem;
        font-weight: 700;
        font-family: var(--font-heading);
    }

    .profile-name {
        font-size: 1.5rem;
        margin-bottom: var(--sp-1);
        color: var(--white);
    }

    .profile-meta {
        color: var(--slate);
        font-size: 0.95rem;
        margin-bottom: var(--sp-6);
    }

    .profile-trust {
        background: var(--navy);
        border: 1px solid rgba(224, 123, 0, 0.15);
        border-radius: var(--radius-md);
        padding: var(--sp-6);
        margin-bottom: var(--sp-8);
        color: var(--slate);
        font-size: 0.95rem;
        line-height: 1.7;
        text-align: left;
    }

    /* P18 (#3218): "your short link" card, shown only to the signed-in owner of this profile. */
    .slug-card {
        margin-top: var(--sp-8);
        padding-top: var(--sp-6);
        border-top: 1px solid rgba(224, 123, 0, 0.2);
        text-align: left;
    }
    .slug-card h2 { font-size: 1.1rem; color: var(--white); margin-bottom: var(--sp-2); }
    .slug-card p { color: var(--slate); font-size: 0.9rem; line-height: 1.6; margin-bottom: var(--sp-3); }
    .slug-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
    .slug-prefix { color: var(--slate); font-size: 0.95rem; }
    .slug-row .form-input { flex: 1 1 140px; min-width: 0; }
    .slug-current { color: var(--white); font-weight: 600; word-break: break-all; }
    #slugMsg { min-height: 1.2em; margin-top: var(--sp-2); font-size: 0.85rem; }

    .profile-loading,
    .profile-error {
        color: var(--slate);
        font-size: 1rem;
        line-height: 1.6;
    }

    .profile-error {
        color: var(--red, #dc2626);
    }
</style>
</head>
<body>
<header id="site-header" data-active=""></header>

<main class="profile-wrapper">
    <div class="profile-card" id="profileCard">
        <p class="profile-loading" id="profileLoading">Loading partner profile&hellip;</p>
    </div>
</main>

<footer id="site-footer"></footer>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/agent-types.js"></script>
<script src="js/partner-slug.js"></script>

<script>
    // gh-862/gh-881: reads ?code=, looks up the partner via the same public
    // directory RPC ref-re.html already uses (get_referral_agents_public —
    // SECURITY DEFINER, column-list reviewed #820: no email/phone/address),
    // and renders "Proud partner of Otter Quotes" + name/photo/service area
    // per the locked spec on #881. The CTA sends visitors to the real
    // referral funnel (ref.html?code=...) — this page is the "badge of
    // association" a partner can link to from their own site, not a second
    // copy of that funnel link.
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // gh-914 single source (js/agent-types.js)
    const AGENT_TYPE_LABELS = AgentTypes.PARTNER_DISPLAY_LABELS;

    function showError(message) {
        const loading = document.getElementById('profileLoading');
        if (loading) {
            loading.className = 'profile-error';
            loading.textContent = message;
        }
    }

    function renderProfile(agent, code) {
        const card = document.getElementById('profileCard');
        if (!card) return;

        const name = [agent.first_name, agent.last_name].filter(Boolean).join(' ') || 'Your Otter Quotes Partner';
        const typeLabel = AGENT_TYPE_LABELS[agent.agent_type] || 'Otter Quotes Partner';
        const metaParts = [typeLabel];
        if (agent.company) metaParts.push(agent.company);
        if (agent.service_area) metaParts.push(agent.service_area);
        // Escape each part individually so a raw '·' separator (not user
        // data) can be joined in afterward without re-escaping user content.
        const metaText = metaParts.map(escapeHtml).join(' · ');

        const avatarHtml = agent.photo_url
            ? `<img class="profile-avatar-img" src="${escapeHtml(agent.photo_url)}" alt="${escapeHtml(name)}">`
            : `<div class="profile-avatar-fallback">${escapeHtml((name || 'P').charAt(0).toUpperCase())}</div>`;

        const bioHtml = agent.bio
            ? `<p style="margin-top: var(--sp-3);">${escapeHtml(agent.bio)}</p>`
            : '';

        const ctaUrl = `${CONFIG.SITE_URL}/ref.html?code=${encodeURIComponent(code)}`;

        card.innerHTML = `
            <div class="profile-eyebrow">Proud Partner of Otter Quotes</div>
            ${avatarHtml}
            <h1 class="profile-name">${escapeHtml(name)}</h1>
            <p class="profile-meta">${metaText}</p>
            <div class="profile-trust">
                Otter Quotes connects homeowners with multiple competing
                contractor bids &mdash; no fee to use Otter Quotes, with no obligation.
                ${bioHtml}
            </div>
            <a class="btn btn-primary btn-full" href="${ctaUrl}">Get a Contractor Quote</a>
        `;
    }

    // P18 (#3218): "your short link" card. Only the signed-in owner of the displayed profile sees it; the RPC is the
    // authority (it resolves the partner from auth.uid()), this check only decides whether to draw the card.
    function slugDisplayHost() { return String(CONFIG.SITE_URL || '').replace(/^https?:\/\//, '').replace(/\/+$/, ''); }

    function renderSlugState(slug) {
        const cur = document.getElementById('slugCurrent');
        if (!cur) return;
        if (!slug) { cur.innerHTML = ''; return; }
        const shown = escapeHtml(PartnerSlug.displayUrl(CONFIG.SITE_URL, slug));
        cur.innerHTML = PartnerSlug.ROUTING_LIVE
            ? `<p>Your short link: <span class="slug-current">${shown}</span> <button type="button" class="btn btn-secondary" id="slugCopy">Copy</button></p>`
            : `<p>Your short link: <span class="slug-current">${shown}</span><br>Saved. It will start working when short links launch. Your regular link keeps working in the meantime.</p>`;
        const copy = document.getElementById('slugCopy');
        if (copy) copy.addEventListener('click', async function () {
            try { await navigator.clipboard.writeText(PartnerSlug.shortUrl(CONFIG.SITE_URL, slug)); copy.textContent = 'Copied'; }
            catch (_) { copy.textContent = 'Copy failed'; }
        });
    }

    function setSlugMsg(text, isError) {
        const el = document.getElementById('slugMsg');
        if (!el) return;
        el.className = isError ? 'form-error' : 'form-hint';
        el.textContent = text;
    }

    async function onSlugSubmit(ev) {
        ev.preventDefault();
        const input = document.getElementById('slugInput');
        const btn = document.getElementById('slugSave');
        btn.disabled = true;
        setSlugMsg('Saving\u2026', false);
        const r = await PartnerSlug.save(sb, input.value);
        btn.disabled = false;
        if (!r.ok) { input.classList.add('error'); setSlugMsg(r.message, true); return; }
        input.classList.remove('error');
        input.value = r.slug;
        setSlugMsg(r.changed ? 'Saved.' : 'That is already your short link.', false);
        renderSlugState(r.slug);
    }

    async function maybeRenderSlugCard(code) {
        try {
            if (typeof Auth === 'undefined' || typeof PartnerSlug === 'undefined') return;
            const user = await Auth.getUser();
            if (!user) return;
            const { data: mine } = await sb.from('referral_agents')
                .select('unique_code, vanity_slug, status')
                .eq('user_id', user.id).maybeSingle();
            if (!mine || mine.unique_code !== code || mine.status !== 'active') return;
            const card = document.getElementById('profileCard');
            if (!card) return;
            const wrap = document.createElement('div');
            wrap.className = 'slug-card';
            wrap.id = 'slugCard';
            wrap.innerHTML = `
                <h2>Your short link</h2>
                <p>Pick a short address that is easy to say out loud. ${PartnerSlug.ROUTING_LIVE ? 'Visitors who use it are credited to you, the same as your regular link.' : 'Once short links launch, visitors who use it will be credited to you, the same as your regular link.'}</p>
                <div id="slugCurrent"></div>
                <form id="slugForm" novalidate>
                    <label class="form-label" for="slugInput">Short link</label>
                    <div class="slug-row">
                        <span class="slug-prefix">${escapeHtml(slugDisplayHost())}/</span>
                        <input class="form-input" id="slugInput" name="slug" type="text" inputmode="url" autocomplete="off"
                               autocapitalize="none" spellcheck="false" minlength="${PartnerSlug.MIN}" maxlength="${PartnerSlug.MAX}"
                               placeholder="jane-doe" value="${escapeHtml(mine.vanity_slug || '')}">
                        <button type="submit" class="btn btn-primary" id="slugSave">Save</button>
                    </div>
                    <div id="slugMsg" role="status" aria-live="polite"></div>
                </form>`;
            card.appendChild(wrap);
            document.getElementById('slugForm').addEventListener('submit', onSlugSubmit);
            renderSlugState(mine.vanity_slug);
        } catch (_) { /* the picker is optional; the profile above is already drawn */ }
    }

    async function init() {
        // Header/footer auto-render via nav.js's DOMContentLoaded listener
        // reading data-active/data-auth off #site-header (same pattern as
        // ref-re.html) — no manual Nav.renderHeader() call needed here.
        const params = new URLSearchParams(window.location.search);
        let code = params.get('code');

        // ── 2026-08-25 ────────────────────────────────────────────────────
        // No ?code= used to be a dead end. That made this page unreachable
        // from the partner's own nav — a partner had no way to look at the
        // profile prospects actually see. Same complaint class Dustin
        // reported on contractor-profile.html ("I can't get to any other
        // part of my account"). A signed-in partner with no code in the URL
        // now resolves their OWN unique_code and previews their own page.
        if (!code && typeof Auth !== 'undefined') {
            try {
                const user = await Auth.getUser();
                if (user) {
                    const { data: mine } = await sb
                        .from('referral_agents')
                        .select('unique_code')
                        .eq('user_id', user.id)
                        .maybeSingle();
                    if (mine && mine.unique_code) code = mine.unique_code;
                }
            } catch (_) { /* fall through to the missing-code message below */ }
        }

        if (!code) {
            showError("This partner profile link is missing its code — please ask your partner for their link again.");
            return;
        }

        try {
            const { data, error } = await sb
                .rpc('get_referral_agents_public')
                .select('*')
                .eq('unique_code', code)
                .single();

            if (error || !data) {
                console.error('Failed to load partner profile:', error);
                showError("We couldn't find that partner profile. The link may be out of date.");
                return;
            }

            renderProfile(data, code);
            maybeRenderSlugCard(code);
        } catch (err) {
            console.error('Error loading partner profile:', err);
            showError("Something went wrong loading this partner profile. Please try again.");
        }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
