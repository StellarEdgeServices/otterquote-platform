  <script src="js/cookie-storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>

  <script>
    (function() {
      'use strict';

      let currentUser = null;
      let currentProfile = null;
      let currentClaim = null;
      let carriers = [];
      let isEditingClaim = false;

      async function init() {
        try {
          currentUser = await Auth.requireAuth('homeowner');
          if (!currentUser) return;

          currentProfile = await Auth.getProfile();
          await loadCarriers();
          await loadClaimData();

          renderWelcome();
          renderClaimInfo();
          renderChecklist();
          updateSubmitButton();
          updateProgressBar();
          await updateStatusBanner();

          setupEventListeners();
        } catch (err) {
          console.error('Dashboard init error:', err);
          showError('Failed to load dashboard. Please refresh the page.');
        }
      }

      async function loadCarriers() {
        try {
          const { data, error } = await sb.from('carrier_profiles').select('id, carrier_name').order('carrier_name');
          if (!error && data) carriers = data.map(c => ({ id: c.id, name: c.carrier_name }));
        } catch (err) { console.error('Error loading carriers:', err); }
      }

      async function loadClaimData() {
        if (!currentUser) return;
        try {
          const { data, error } = await sb.from('claims').select('*').eq('user_id', currentUser.id)
            .order('created_at', { ascending: false }).limit(1).single();
          if (data) {
            currentClaim = data;
            window.currentClaim = currentClaim;
          }
          if (!currentClaim) {
            const { data: newClaim } = await sb.from('claims').insert({
              user_id: currentUser.id, status: 'draft', damage_type: 'roof',
              is_test: Auth.isTestEmail(currentUser.email),
            }).select().single();
            if (newClaim) { currentClaim = newClaim; window.currentClaim = currentClaim; }
          }
          if (!currentClaim) {
            currentClaim = { id: null, status: 'draft', has_estimate: false, has_measurements: false, has_material_selection: false, ready_for_bids: false };
          }
          if (currentClaim?.ready_for_bids) {
            document.getElementById('status-banner').classList.add('active');
            document.getElementById('checklist-section').style.display = 'none';
            document.getElementById('submit-ready-section').style.display = 'none';
          }
        } catch (err) {
          console.error('[Dashboard] Error in loadClaimData:', err);
          currentClaim = { id: null, status: 'draft', has_estimate: false, has_measurements: false, has_material_selection: false, ready_for_bids: false };
        }
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);
      }

      function renderWelcome() {
        const firstName = currentProfile?.full_name?.split(' ')[0] || currentProfile?.first_name || 'there';
        document.getElementById('user-first-name').textContent = firstName;
        const address = currentProfile?.address_street
          ? [currentProfile.address_street, currentProfile.address_city, currentProfile.address_state, currentProfile.address_zip].filter(Boolean).join(', ')
          : currentProfile?.address || 'Address not set';
        document.getElementById('user-address').textContent = address;
      }

      function renderClaimInfo() {
        if (!currentClaim) return;
        const display = document.getElementById('claim-display');
        if (display) display.innerHTML = '';
      }

      function renderChecklist() {
        if (!currentClaim) return;
        const container = document.getElementById('checklist-container');
        if (container) container.innerHTML = '';
      }

      function updateProgressBar() {
        let completed = 0;
        const total = 3;
        if (currentClaim?.has_estimate) completed++;
        if (currentClaim?.has_measurements) completed++;
        if (currentClaim?.has_material_selection) completed++;
        const percent = Math.round((completed / total) * 100);
        const pctEl = document.getElementById('progress-percent');
        const fillEl = document.getElementById('progress-fill');
        if (pctEl) pctEl.textContent = percent;
        if (fillEl) fillEl.style.width = percent + '%';
      }

      async function updateStatusBanner() {
        if (!currentClaim?.ready_for_bids) return;
        const banner = document.getElementById('status-banner');
        if (banner) banner.classList.add('active');
      }

      /**
       * gh-1570: the checklist-complete gate, factored out so the top-of-page
       * banner (updateReadyToSubmitBanner) and the activity_log write
       * (logChecklistCompleteOnce) share the exact same definition of "ready".
       * Tolerant of a currentClaim that is null/undefined or missing any of
       * these fields (a claim created before a field existed, or not yet loaded).
       */
      function isChecklistComplete() {
        const hasEstimate     = !!currentClaim?.has_estimate;
        const hasMaterial     = !!currentClaim?.has_material_selection;
        const hasMeasurements = !!currentClaim?.has_measurements;

        const needsMeasurements = currentClaim?.funding_type === 'cash';
        const measurementsOk    = !needsMeasurements || hasMeasurements;

        const needsEstimate = currentClaim?.funding_type !== 'cash';
        const estimateOk    = !needsEstimate || hasEstimate;

        return { isReady: estimateOk && hasMaterial && measurementsOk, needsEstimate, needsMeasurements, hasEstimate, hasMaterial, hasMeasurements };
      }

      function updateSubmitButton() {
        const btn = document.getElementById('submit-btn');
        const hint = document.getElementById('submit-hint');
        const { isReady, needsEstimate, needsMeasurements, hasEstimate, hasMaterial, hasMeasurements } = isChecklistComplete();

        if (btn) btn.disabled = !isReady;

        if (hint) {
          if (!isReady) {
            const missing = [];
            if (needsEstimate && !hasEstimate) missing.push('Insurance Estimate');
            if (!hasMaterial) missing.push('Material Selection');
            if (needsMeasurements && !hasMeasurements) missing.push('Property Measurements (required for retail projects)');
            hint.textContent = `Complete the required items: ${missing.join(', ')}.`;
          } else {
            hint.textContent = 'Your project details are complete. Submit them now to get competitive bids from contractors.';
          }
        }

        // gh-1570: mirror the same ready/not-ready state in the unmissable
        // top-of-page banner, and fire the (idempotent) checklist_complete
        // activity_log write once the checklist is actually complete.
        updateReadyToSubmitBanner(isReady);
      }

      /**
       * gh-1570 — shows/hides the top-of-page "You're ready" banner and, on the
       * transition into "ready", kicks off the one-time activity_log write.
       * Purely a display/side-effect function — it never re-derives readiness
       * itself, so it can never disagree with updateSubmitButton() about what
       * "ready" means.
       */
      function updateReadyToSubmitBanner(isReady) {
        const banner = document.getElementById('ready-to-submit-banner');
        if (!banner) return;

        const alreadySubmitted = !!currentClaim?.ready_for_bids || currentClaim?.status === 'active'
          || currentClaim?.status === 'bidding' || currentClaim?.status === 'awarded'
          || currentClaim?.status === 'contract_signed';

        const show = !!isReady && !alreadySubmitted;
        banner.classList.toggle('active', show);

        if (show) {
          logChecklistCompleteOnce();
        }
      }

      /**
       * gh-1570 — writes ONE activity_log row (event_type: checklist_complete)
       * per claim, the first time this dashboard observes the checklist as
       * complete. Idempotent: reads existing activity for the claim first via a
       * jsonb-containment filter on metadata.claim_id, so a reload (or this
       * function firing twice in one session) never writes a second row.
       * Every branch is wrapped, nothing here throws outward, and a missing
       * currentUser/currentClaim/window.sb is a silent no-op rather than an error.
       */
      let checklistCompleteLogInFlight = false;
      async function logChecklistCompleteOnce() {
        if (checklistCompleteLogInFlight) return;
        if (!window.sb || !currentUser?.id || !currentClaim?.id) return;

        checklistCompleteLogInFlight = true;
        try {
          const { data: existing, error: checkErr } = await window.sb
            .from('activity_log')
            .select('id')
            .eq('user_id', currentUser.id)
            .eq('event_type', 'checklist_complete')
            .contains('metadata', { claim_id: currentClaim.id })
            .limit(1);

          if (checkErr) {
            console.warn('[logChecklistCompleteOnce] existence check failed (non-fatal):', checkErr);
            return;
          }
          if (existing && existing.length > 0) return;

          const { error: insertErr } = await window.sb
            .from('activity_log')
            .insert({
              user_id: currentUser.id,
              event_type: 'checklist_complete',
              title: 'Project checklist complete — ready to submit for bids',
              metadata: { claim_id: currentClaim.id },
            });

          if (insertErr) {
            console.warn('[logChecklistCompleteOnce] insert failed (non-fatal):', insertErr);
          }
        } catch (err) {
          console.warn('[logChecklistCompleteOnce] unexpected error (non-fatal):', err);
        } finally {
          checklistCompleteLogInFlight = false;
        }
      }

      function setupEventListeners() {
        const submitBtn = document.getElementById('submit-btn');
        if (submitBtn) submitBtn.addEventListener('click', async () => { await submitForBids(); });

        const readyBtn = document.getElementById('ready-to-submit-btn');
        if (readyBtn) readyBtn.addEventListener('click', async () => { await submitForBids(); });
      }

      async function submitForBids() {
        const btn = document.getElementById('submit-btn');
        if (!currentClaim) return;
        if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

        try {
          const submitUpdate = { status: 'active', ready_for_bids: true };
          if (sb && currentClaim.id) {
            const { error } = await sb.from('claims').update(submitUpdate).eq('id', currentClaim.id);
            if (error) throw error;
          }
          if (currentClaim) Object.assign(currentClaim, submitUpdate);

          const submitSection = document.getElementById('submit-ready-section');
          const successSection = document.getElementById('submit-success');
          if (submitSection) submitSection.style.display = 'none';
          if (successSection) successSection.classList.add('active');

          // gh-1570: the job's done — the top-of-page banner hands off to the
          // status banner below.
          const readyBanner = document.getElementById('ready-to-submit-banner');
          if (readyBanner) readyBanner.classList.remove('active');

          await updateStatusBanner();
        } catch (err) {
          console.error('[submitForBids] Error:', err);
          if (btn) { btn.disabled = false; btn.textContent = 'Submit for Bids'; }
          showError('Failed to submit your project. Please try again.');
        }
      }

      function showError(message) {
        const el = document.getElementById('error-message');
        const textEl = document.getElementById('error-text');
        if (!el || !textEl) return;
        textEl.textContent = message;
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 5000);
      }

      function showSuccess(message) {
        const el = document.getElementById('success-message');
        const textEl = document.getElementById('success-text');
        if (!el || !textEl) return;
        textEl.textContent = message;
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 4000);
      }

      document.addEventListener('DOMContentLoaded', () => {
        Auth.ready().then(async () => { await init(); }).catch(err => {
          console.error('Auth.ready() failed:', err);
          window.location.href = '/login.html';
        });
      });

    })();
  </script>
</body>
</html>
