<!DOCTYPE html>
<html lang="en">
<head>
<!-- Sentry Error Monitoring -->
<script
  src="https://js.sentry-cdn.com/49b5839b50adc240398d822c46d4a86e.min.js"
  crossorigin="anonymous"
></script>
<script>
  Sentry.onLoad(function() {
    Sentry.init({
      environment: window.location.hostname.includes('staging') ? 'staging' : 'production',
      denyUrls: [/^data:/, /^file:/, /^blob:/, /data:text\/html/],
      beforeSend: function (event) {
        var proto = window.location.protocol;
        if (proto !== 'http:' && proto !== 'https:') return null;
        var req = event.request && event.request.url;
        if (req && /^(data|file|blob):/.test(req)) return null;
        return event;
      }
    });
  });
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/img/brand-assets/favicon.png">
  <title>My Project Dashboard &mdash; Otter Quotes</title>
  <meta name="description" content="Review and submit your project details for competitive bids from contractors.">

  <script src="/js/ga-gate.js"></script>
  <script>gtag('config','G-D1Y1TLGEFY');</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/nav.css">

  <style>
    .dashboard-layout { min-height: calc(100vh - 64px); display: flex; flex-direction: column; }
    .dashboard-main { flex: 1; padding: var(--sp-12) 0; }
    .ready-to-submit-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      background: var(--green-light);
      color: #065F46;
      padding: var(--sp-6);
      border-radius: var(--radius-lg);
      border: 2px solid var(--green);
      box-shadow: 0 0 0 4px rgba(16,185,129,0.15);
      margin-bottom: var(--sp-8);
    }
    .ready-to-submit-banner.active { display: flex; }
    .ready-to-submit-text { display: flex; align-items: center; gap: var(--sp-4); flex: 1; }
    .ready-to-submit-icon { font-size: 1.75rem; flex-shrink: 0; }
  </style>
</head>
<body>
  <header id="site-header" data-active=""></header>
  <div class="dashboard-layout">
    <div class="dashboard-main">
      <div class="container">
        <div id="error-message" class="error-message"><span>⚠️</span><span id="error-text"></span></div>
        <div id="success-message" class="success-message"><span>✓</span><span id="success-text"></span></div>
        <div id="ready-to-submit-banner" class="ready-to-submit-banner">
          <div class="ready-to-submit-text">
            <div class="ready-to-submit-icon">✓</div>
            <div>
              <strong>You're ready — submit for bids</strong>
              <p>Every required item on your checklist is complete. Submit now to start getting bids from contractors.</p>
            </div>
          </div>
          <button class="btn btn-primary btn-lg" id="ready-to-submit-btn">Submit for Bids</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
