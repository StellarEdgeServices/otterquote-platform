# Netlify configuration — OtterQuote (D-182)
# Production deploys from: main branch
# Staging deploys from: staging branch
#
# Build command: injects context-specific Stripe publishable key from STRIPE_PK
# env var into js/config.js (replaces %%STRIPE_PK%% placeholder) at build time.
# Keys are set per context below — no hardcoded Stripe keys in source files.

[build]
  publish = "."
  command = "sed -i \"s|%%STRIPE_PK%%|${STRIPE_PK}|g\" js/config.js && echo 'STRIPE_PK injected into js/config.js'"

# Stripe publishable key per deploy context (not secrets — publishable keys are client-safe)
[context.production.environment]
  STRIPE_PK = "pk_live_51TCI2O0AJRnqIYPU4ybaUmt2FRxihUu4kMKXvjnrvfsWRHyoi8ptkVuyKsDs3Zq4dMrGniPGg5BxtAmZfukah5aI00K31rnCbk"

# Staging context — deploys to staging--jade-alpaca-b82b5e.netlify.app
[context.staging]
  publish = "."

[context.staging.environment]
  STRIPE_PK = "pk_test_51TCI2O0AJRnqIYPUgKku8lRifucMiKIBTdu8hkmBLjjXVR73eggMnqVuPPtlZF8thfGypv8UShBoLsoIgY4ELfRP009TrgSIxo"

# Branch deploy previews (feature branches)
[context.deploy-preview]
  publish = "."

# Explicit Content-Type for .txt files (llms.txt, robots.txt, etc.)
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

# Force UTF-8 charset on all HTML responses.
# Without this explicit header, some browsers fall back to Windows-1252 encoding
# which garbles UTF-8 multi-byte characters (em dashes render as "â??", etc.).
# This is the root-cause fix. HTML entities in source files are belt-and-suspenders.
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Admin auth gate — W4-P1 (May 1, 2026)
# Intercepts /admin-*.html before static HTML is served.
# Unauthenticated or non-admin sessions redirect to /login.html?reason=admin_required.
# Source: netlify/edge-functions/admin-auth-gate.ts
# PWA — Partner App (2026-08-03)
# Correct MIME for the web app manifest; keep the service worker uncached so
# updates propagate on next load.
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "/partner-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# gh-817: js/auth.js and js/nav.js gate every role-based redirect (contractor
# vs partner vs homeowner dashboard). Neither was previously covered by a
# cache rule, so a browser could keep serving a pre-fix copy across a deploy
# indefinitely (only a revalidate, not a hard TTL, forces a fresh fetch).
# no-cache forces revalidation on every load without fully disabling caching.
[[headers]]
  for = "/js/auth.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/nav.js"
  [headers.values]
    Cache-Control = "no-cache"

[[edge_functions]]
  path = "/admin-*.html"
  function = "admin-auth-gate"

# Referral short-link query passthrough — #630 (2026-08-06)
# /ref/:code must always redirect to /ref.html?code=:code, but Netlify's
# declarative redirect engine only auto-forwards the incoming query string
# when the "to" target has no query string of its own — so utm_* (and any
# other) params on the short link were silently dropped by the plain
# _redirects rule. Named `query = {...}` matching can't cover an open-ended
# param set either (every key + exact combination would need enumerating).
# Netlify's own guidance for open-ended query forwarding is an Edge
# Function, so /ref/* is handled there instead of a declarative rule.
# Source: netlify/edge-functions/ref-redirect.ts
[[edge_functions]]
  path = "/ref/*"
  function = "ref-redirect"
