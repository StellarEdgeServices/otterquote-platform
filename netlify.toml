# Netlify configuration — OtterQuote (D-182)
# Production deploys from: main branch
# Staging deploys from: staging branch
#
# Build command: injects context-specific Stripe publishable key from STRIPE_PK
# env var into js/config.js (replaces %%STRIPE_PK%% placeholder) at build time.
# Keys are set per context below — no hardcoded Stripe keys in source files.

# gh-2392 (supersedes the gh-2389 delete-in-place approach): the site is NOT
# published from the repo root any more. The build command copies the served
# tree into _site/ and publishes that. Everything internal is simply never
# copied, so it is physically absent from the deploy: no exact-case redirect to
# bypass. Measured on the gh-2389 Deploy Preview: redirect rules match EXACT CASE
# only while Netlify's static lookup is case-insensitive, so
# /nEtlify/edge-functions/ref-redirect.ts, /REACT-APP/app/lib/attribution-core.ts
# and /netlify%2fedge-functions%2f... still returned 200 while netlify/ and
# react-app/app/lib/attribution-core.ts had to stay in the publish dir.
# Now they do not: edge functions are bundled from the SOURCE checkout
# (default netlify/edge-functions relative to the base dir, unaffected by
# `publish`), and the source tree is never modified by this command.
# What is copied: every top-level entry (plus .well-known if it ever exists)
# except the denylist below (matched case-insensitively); other dotfiles/dot-dirs (.git, .github, .claude,
# .netlify, .gitignore ...) are never copied because `*` does not match them.
# Nested junk (node_modules, .DS_Store, .git, *.md/*.py/*.sh/*.toml/*.ts/*.tsx) is pruned from the copy afterwards.
# STRIPE_PK is injected into the COPY (_site/js/config.js); the source file and
# its placeholder logic are untouched. (js/config.js currently hardcodes its
# keys, so the sed is a no-op today; kept so a %%STRIPE_PK%% placeholder works.)
# A NEW root directory is published by default: scripts/netlify-publish-dir.test.py
# pins the exact set of served top-level dirs and fails CI if one appears, so add
# it to the denylist here (internal) or to the test (served) deliberately.
# _redirects and [[headers]] are unaffected: _redirects is copied into _site/
# and netlify.toml is read from the base dir.
# Test: python3 scripts/netlify-publish-dir.test.py
[build]
  publish = "_site"
  command = '''
set -eu
rm -rf _site
mkdir _site
for f in * .well-known; do
  [ -e "$f" ] || continue
  l=$(printf '%s' "$f" | tr 'A-Z' 'a-z')
  case "$l" in
    _site|netlify|react-app|supabase|scripts|sql|tests|handoffs|docs|archive|runbooks|skills-for-code|democracy|deploy-checks|forge-config|otterquote-deploy|tools|node_modules|netlify.toml|tools-e2e-test.txt|package.json|package-lock.json|*.md|*.py|*.sh|*.toml) continue ;;
  esac
  cp -R "$f" _site/
done
find _site \( -name node_modules -o -name .git -o -name .DS_Store \) -prune -exec rm -rf {} +
find _site -type f \( -iname '*.md' -o -iname '*.py' -o -iname '*.sh' -o -iname '*.toml' -o -iname '*.ts' -o -iname '*.tsx' \) -delete
sed -i "s|%%STRIPE_PK%%|${STRIPE_PK}|g" _site/js/config.js
echo 'STRIPE_PK injected into _site/js/config.js; repo internals excluded from publish dir (gh-2392)'
'''

# gh-2389: skip a PRODUCTION build when nothing the site serves changed.
# Netlify semantics (docs.netlify.com/build/configure-builds/ignore-builds/):
# ignore command exit 0 = no changes, SKIP the build; exit 1 = BUILD.
# CACHED_COMMIT_REF = last commit Netlify built before this one, so several
# skipped merges accumulate into the next diff (nothing is lost).
# Deploy previews and branch deploys are not credit-metered, so only the
# production context is gated; they still build as before.
# (Publish is now _site, gh-2392; the build still runs from the repo root.) This list names ONLY the
# trees/files that no served page references (verified by grep, gh-2389).
# Any path NOT listed here still triggers a build (fails toward building).
# Also BUILDS when: CACHED_COMMIT_REF is empty, equals COMMIT_REF (cache-less
# rebuild / retry of the same commit), or git diff errors (e.g. ref missing).
# CARVE-OUT: react-app/app/lib/attribution-core.ts is imported by
# netlify/edge-functions/first-touch-attribution.ts and bundled into the site's
# edge function, so a change to it must BUILD even though react-app is excluded.
# Rule: any file imported (transitively) by anything under netlify/ must build;
# scripts/netlify-ignore.test.py enforces this by parsing those imports.
# Excluded: react-app (own site, own netlify.toml + base-dir check), supabase,
# scripts, .github, sql, tests, handoffs, docs, Docs, .claude, Archive,
# skills-for-code, runbooks, deploy-checks, forge-config,
# otterquote-deploy, root-level *.md, .gitignore, .gitattributes.
# Test: python3 scripts/netlify-ignore.test.py
[context.production]
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- react-app/app/lib/attribution-core.ts && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':!react-app' ':!supabase' ':!scripts' ':!.github' ':!sql' ':!tests' ':!handoffs' ':!docs' ':!Docs' ':!.claude' ':!Archive' ':!skills-for-code' ':!runbooks' ':!deploy-checks' ':!forge-config' ':!otterquote-deploy' ':(exclude,glob)*.md' ':!.gitignore' ':!.gitattributes' || exit 1"

# Stripe publishable key per deploy context (not secrets — publishable keys are client-safe)
[context.production.environment]
  STRIPE_PK = "pk_live_51TCI2O0AJRnqIYPU4ybaUmt2FRxihUu4kMKXvjnrvfsWRHyoi8ptkVuyKsDs3Zq4dMrGniPGg5BxtAmZfukah5aI00K31rnCbk"

# Staging context — deploys to staging--jade-alpaca-b82b5e.netlify.app
[context.staging]
  publish = "_site"

[context.staging.environment]
  STRIPE_PK = "pk_test_51TCI2O0AJRnqIYPUgKku8lRifucMiKIBTdu8hkmBLjjXVR73eggMnqVuPPtlZF8thfGypv8UShBoLsoIgY4ELfRP009TrgSIxo"

# Branch deploy previews (feature branches)
[context.deploy-preview]
  publish = "_site"

# Explicit Content-Type for .txt files (llms.txt, robots.txt, etc.)
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

# Force UTF-8 charset on all HTML responses.
# Without this explicit header, some browsers fall back to Windows-1252 encoding
# which garbles UTF-8 multi-byte characters (em dashes render as "â??", etc.).
# This is the root-cause fix. HTML entities in source files are belt-and-suspenders.
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Admin auth gate — W4-P1 (May 1, 2026)
# Intercepts /admin-* (with or without .html / trailing slash) before static HTML is served.
# Unauthenticated or non-admin sessions redirect to /login.html?reason=admin_required.
# Source: netlify/edge-functions/admin-auth-gate.ts
# gh-2063 fix round 2 (PR #2065 review, blocker 2): the original version of
# this rule set /img/* AND /assets/* to a year-long `immutable` cache. That
# was wrong for both paths, and independent review caught it before merge:
# `immutable` tells a browser it never has to re-check the file for the
# life of the cache, which is only safe for a content-hashed filename that
# gets a NEW name every time its contents change. Nothing under /img/* or
# /assets/* in this repo is content-hashed -- both are edited in place.
# /assets/*, concretely: assets/partner-onepager-re.html and
# assets/partner-onepager-insurance.html (8 commits each, most recently
# gh-1965's Meta Pixel include 6 days before this fix) are linked from
# partner-dashboard.html/partner-insurance.html/partner-re.html; a partner
# who had opened either one would have kept a stale copy -- missing legal/
# copy fixes (D-104) and tracking changes -- for a full year. That rule is
# removed outright rather than narrowed: this repo has no /assets/* content
# that is safe to cache immutably today. /img/* icons (otter-icon.png,
# favicon.png, otter-quotes-icon-512.png, otter-icon-white.png) are also
# replaced in place, not renamed, so `immutable` was equally wrong there;
# kept, but downgraded to a short revalidating policy (some caching value,
# no risk of a year-long stale asset) rather than dropped entirely. #2063's
# item 5 is otherwise satisfied by confirming Netlify's own compression is
# already on (no config change needed for that).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# PWA — Partner App (2026-08-03)
# Correct MIME for the web app manifest; keep the service worker uncached so
# updates propagate on next load.
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "/partner-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# PWA — Admin App (gh-1479, 2026-09-02); same reasoning as partner-sw.js above.
[[headers]]
  for = "/admin-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# gh-817: js/auth.js and js/nav.js gate every role-based redirect (contractor
# vs partner vs homeowner dashboard). Neither was previously covered by a
# cache rule, so a browser could keep serving a pre-fix copy across a deploy
# indefinitely (only a revalidate, not a hard TTL, forces a fresh fetch).
# no-cache forces revalidation on every load without fully disabling caching.
[[headers]]
  for = "/js/auth.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/nav.js"
  [headers.values]
    Cache-Control = "no-cache"

# gh-1598 REFUTED-REOPENED fix (2026-09-05): the glob was "/admin-*.html", so
# the extensionless form "/admin-dashboard" (which Netlify Pretty URLs also
# 301s "/Admin-Dashboard.html" and "/admin-dashboard/" onto) served the full
# admin HTML shell to an anonymous request. A `path` glob is case-sensitive
# (measured on deploy-preview-1684: "/Admin-Dashboard.html" fell through to
# Pretty URLs' 301 instead of the gate), so this is a regex `pattern`: any
# case of "admin-" at the root, with or without ".html" or a trailing slash.
# The two public PWA assets (service worker + manifest, no admin data) are
# excluded so the manifest fetch — which sends no cookie — keeps working.
# The inline config in admin-auth-gate.ts declares the same and takes precedence.
[[edge_functions]]
  pattern = '^/[Aa][Dd][Mm][Ii][Nn]-.*$'
  excludedPattern = ['^/admin-sw\.js$', '^/admin-app\.webmanifest$']
  function = "admin-auth-gate"

# First-touch ad attribution — gh-1983 (2026-09-16)
# On a GET carrying utm_* / fbclid / gclid with no stored first touch, adds
# Set-Cookie oq_ft (Domain=.otterquote.com, 90 d) to the normal response —
# including the /get-started* 301 to app.otterquote.com — so the attribution
# reaches the React signup before any JS runs. Untagged requests return
# immediately. Static asset paths are excluded to keep invocations to pages.
# Source: netlify/edge-functions/first-touch-attribution.ts
[[edge_functions]]
  path = "/*"
  excludedPath = ["/js/*", "/css/*", "/img/*", "/assets/*", "/data/*", "/*.js", "/*.css", "/*.png", "/*.jpg", "/*.jpeg", "/*.svg", "/*.webp", "/*.ico", "/*.webmanifest", "/*.txt", "/*.xml", "/*.json", "/*.woff2"]
  function = "first-touch-attribution"

# Referral short-link query passthrough — #630 (2026-08-06)
# /ref/:code must always redirect to /ref.html?code=:code, but Netlify's
# declarative redirect engine only auto-forwards the incoming query string
# when the "to" target has no query string of its own — so utm_* (and any
# other) params on the short link were silently dropped by the plain
# _redirects rule. Named `query = {...}` matching can't cover an open-ended
# param set either (every key + exact combination would need enumerating).
# Netlify's own guidance for open-ended query forwarding is an Edge
# Function, so /ref/* is handled there instead of a declarative rule.
# Source: netlify/edge-functions/ref-redirect.ts
[[edge_functions]]
  path = "/ref/*"
  function = "ref-redirect"

# gh-1540 REFUTED-REOPENED fix (2026-09-03): /recruit/ and /Recruit.html
# were measuring 301 (not the required 200) because Netlify's built-in
# Pretty URLs post-processing normalizes trailing slashes and .html-case
# ahead of `_redirects`, pre-empting the 200-rewrite rules already declared
# there. A sitewide `pretty_urls = false` toggle was rejected on review — it
# strips that canonicalization for every other page on the site too. This
# edge function intercepts only these two literal paths, ahead of Pretty
# URLs, so the rest of the site's behavior is unchanged.
# Source: netlify/edge-functions/recruit-redirect.ts
[[edge_functions]]
  path = "/recruit/"
  function = "recruit-redirect"

[[edge_functions]]
  path = "/Recruit.html"
  function = "recruit-redirect"

# gh-1745 fix round 1 (2026-09-07): REVIEW: FAIL on PR #1789 found the plain
# `_redirects` 301 rules added for gh-1745 never fire — Pretty URLs dual-
# serves the extensionless /blog/ and /guides/ paths as a 200 ahead of
# `_redirects`, the identical failure mode already fixed twice in this repo
# (gh-1540, gh-1598; see that comment block above). Same remedy: an edge
# function scoped to exactly these 6 literal paths, running ahead of Pretty
# URLs. The `_redirects` rules stay in place unchanged as documented intent;
# this is what actually executes. No other path is affected.
# Source: netlify/edge-functions/blog-guides-redirect.ts
[[edge_functions]]
  path = "/blog/what-to-do-after-storm-damages-roof"
  function = "blog-guides-redirect"

[[edge_functions]]
  path = "/blog/how-to-negotiate-better-roof-repair-insurance-claim"
  function = "blog-guides-redirect"

[[edge_functions]]
  path = "/guides/how-to-file-property-damage-claim"
  function = "blog-guides-redirect"

[[edge_functions]]
  path = "/guides/how-to-choose-contractor"
  function = "blog-guides-redirect"

[[edge_functions]]
  path = "/guides/how-to-negotiate-with-insurer"
  function = "blog-guides-redirect"

[[edge_functions]]
  path = "/guides/how-to-read-contractor-estimate"
  function = "blog-guides-redirect"

# gh-2389 (R-134 protective): the build publishes the whole repo root
# (`publish = "."`), so repository internals were world-readable on
# otterquote.com -- measured 2026-09-30 with curl: /supabase/config.toml 200,
# /supabase/functions/process-dunning/index.ts 200, /scripts/*.py 200,
# /README.md 200, /react-app/package.json 200. Every rule below returns 404
# for a non-site path. `force = true` is required: without it Netlify serves
# the matching static file ahead of a redirect rule. No served page, script
# or stylesheet loads any of these paths (grep in PR #gh-2389). Evaluation
# order: `_redirects` rules run before these, so the gh-1795
# /otterquote-deploy/blog/*.html 301s in `_redirects` still win over the
# /otterquote-deploy/* block.

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

